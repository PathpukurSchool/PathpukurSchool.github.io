    function showStatus(type, message) {
      const msgDiv = document.getElementById('status-message');
      msgDiv.classList.remove('hidden', 'bg-blue-100', 'text-blue-800', 'bg-red-100', 'text-red-800', 'bg-green-100', 'text-green-800', 'border-blue-300', 'border-red-300', 'border-green-300');
      
      let icon = '';
      if (type === 'processing') {
        msgDiv.classList.add('bg-blue-100', 'text-blue-800', 'border', 'border-blue-300');
        icon = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>';
      } else if (type === 'error') {
        msgDiv.classList.add('bg-red-100', 'text-red-800', 'border', 'border-red-300');
        icon = '<i class="fa-solid fa-triangle-exclamation mr-2"></i>';
      } else if (type === 'success') {
        msgDiv.classList.add('bg-green-100', 'text-green-800', 'border', 'border-green-300');
        icon = '<i class="fa-solid fa-circle-check mr-2"></i>';
      }
      
      msgDiv.innerHTML = `${icon}<span>${message}</span>`;
    }

    function clearStatus() {
      const msgDiv = document.getElementById('status-message');
      msgDiv.classList.add('hidden');
      msgDiv.innerHTML = '';
    }

    // ------------------------------------------------------------------
    // ৪. মূল ডেটা ফেচিং ও রেন্ডারিং ফাংশন
    // ------------------------------------------------------------------
    async function fetchClassStatus() {
      const selectedClass = document.getElementById('class-select').value;
      const tablesContainer = document.getElementById('tables-container');
      const summarySection = document.getElementById('summary-section');
      const summaryCards = document.getElementById('summary-cards');

      tablesContainer.innerHTML = '';
      summaryCards.innerHTML = '';
      summarySection.classList.add('hidden');

      if (!selectedClass) {
        clearStatus();
        return;
      }

      showStatus('processing', `শ্রেণী ${selectedClass}-এর তথ্য লোড করা হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন।`);

      const config = classConfigs[selectedClass];

      try {
        // Supabase থেকে তথ্য আনা
        const { data, error } = await supabaseClient
          .from(config.tableName)
          .select('*')
          .eq('session', CURRENT_SESSION);

        if (error) throw error;

        if (!data || data.length === 0) {
          showStatus('error', `শ্রেণী ${selectedClass}-এ সেশন ${CURRENT_SESSION}-এর কোনো শিক্ষার্থীর ডেটা পাওয়া যায়নি।`);
          return;
        }

        // সেকশন তালিকা বের করা ও সর্ট করা
        const sections = [...new Set(data.map(item => item.section))].sort();

        // সেকশন ওয়াইজ স্টুডেন্ট কাউন্ট সামারি রেন্ডার
        let totalStudents = data.length;
        summaryCards.innerHTML = `
          <div class="bg-indigo-600 text-white rounded-lg p-3 text-center shadow">
            <div class="text-xs uppercase font-medium">মোট শিক্ষার্থী</div>
            <div class="text-2xl font-bold">${totalStudents}</div>
          </div>
        `;

        sections.forEach(sec => {
          const secCount = data.filter(d => d.section === sec).length;
          summaryCards.innerHTML += `
            <div class="bg-white border border-slate-200 rounded-lg p-3 text-center shadow-sm">
              <div class="text-xs text-slate-500 font-medium">সেকশন ${sec}</div>
              <div class="text-xl font-bold text-slate-800">${secCount}</div>
            </div>
          `;
        });
        summarySection.classList.remove('hidden');

        // প্রতিটি পরীক্ষার জন্য আলাদা টেবিল তৈরি
        Object.keys(config.exams).forEach(examName => {
          const subjects = config.exams[examName];
          
          let tableHtml = `
            <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
              <div class="bg-slate-800 text-white px-5 py-3 flex items-center justify-between">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-file-pen mr-2 text-indigo-400"></i>${examName}</h3>
                <span class="text-xs bg-slate-700 px-2.5 py-1 rounded-full border border-slate-600">শ্রেণী: ${selectedClass}</span>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left text-sm border-collapse">
                  <thead>
                    <tr class="bg-slate-100 border-b border-slate-200 text-slate-700 font-semibold">
                      <th class="p-3 border-r border-slate-200">সেকশন</th>
                      ${subjects.map(s => `<th class="p-3 text-center border-r border-slate-200 min-w-[100px]">${s.label}</th>`).join('')}
                    </tr>
                  </thead>
                  <tbody>
          `;

          sections.forEach(sec => {
            const secData = data.filter(d => d.section === sec);
            tableHtml += `
              <tr class="border-b border-slate-200 hover:bg-slate-50">
                <td class="p-3 font-semibold bg-slate-50 border-r border-slate-200">সেকশন ${sec}</td>
            `;

            subjects.forEach(sub => {
              // নম্বর আপলোড হয়েছে এমন শিক্ষার্থীর সংখ্যা গণনা (NOT NULL)
              const uploadedCount = secData.filter(d => d[sub.field] !== null && d[sub.field] !== undefined).length;
              
              const isZero = uploadedCount === 0;
              const displayVal = isZero ? '-' : uploadedCount;
              const cellClass = isZero ? 'zero-count' : 'text-slate-800 font-medium';

              tableHtml += `
                <td class="p-3 text-center border-r border-slate-200 ${cellClass}">
                  ${displayVal}
                </td>
              `;
            });

            tableHtml += `</tr>`;
          });

          tableHtml += `
                  </tbody>
                </table>
              </div>
            </div>
          `;

          tablesContainer.innerHTML += tableHtml;
        });

        showStatus('success', `শ্রেণী ${selectedClass}-এর নম্বর আপলোড স্ট্যাটাস সফলভাবে লোড করা হয়েছে।`);

      } catch (err) {
        console.error(err);
        showStatus('error', `তথ্য লোড করতে সমস্যা হয়েছে: ${err.message || 'Supabase সংযোগ চেক করুন।'}`);
      }
    }
  </script>
</body>
</html>
