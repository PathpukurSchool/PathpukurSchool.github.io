<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>পতপুকুর হাই স্কুল (উ: মা:) - রেজাল্ট পোর্টাল</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- jsPDF & AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Atma:wght@500;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap');
    body {
      font-family: 'Noto Sans Bengali', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- Header Section -->
  <header class="bg-indigo-900 text-white shadow-lg">
    <div class="max-w-4xl mx-auto px-4 py-5 text-center">
      <!-- School Name -->
      <div class="flex items-center justify-center gap-2 mb-1">
        <i data-lucide="graduation-cap" class="w-8 h-8 text-indigo-300"></i>
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">পতপুকুর হাই স্কুল (উ: মা:)</h1>
      </div>
      <!-- Sub-heading & Session -->
      <p class="text-indigo-200 text-base md:text-lg font-medium flex items-center justify-center gap-2 mt-1">
        <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
        পরীক্ষার ফলাফল ও মূল্যায়ন পোর্টাল — শিক্ষাবর্ষ: <span id="currentSessionDisplay" class="bg-indigo-800 px-2 py-0.5 rounded text-yellow-300 font-bold">2026</span>
      </p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-3xl mx-auto px-4 py-6 w-full flex-grow">
    
    <!-- Controls Card -->
    <div class="bg-white rounded-xl shadow-md border border-slate-200 p-5 md:p-6">
      
      <div class="border-b pb-3 mb-5 flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="sliders" class="w-5 h-5 text-indigo-600"></i>
          বিবরণ ও ফিল্টার নির্বাচন
        </h2>
        <span class="text-xs text-slate-500 bg-slate-100 px-2 py-1 rounded-full border">A4 Portrait Format</span>
      </div>

      <!-- Controls Form -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        
        <!-- Class Select -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1">
            <i data-lucide="book-open" class="w-4 h-4 text-indigo-500"></i> শ্রেণি (Class)
          </label>
          <select id="classSelect" onchange="updateExamOptions()" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white text-sm font-medium">
            <option value="v">পঞ্চম শ্রেণি (Class V)</option>
            <option value="vi">ষষ্ঠ শ্রেণি (Class VI)</option>
            <option value="vii">সপ্তম শ্রেণি (Class VII)</option>
            <option value="viii">অষ্টম শ্রেণি (Class VIII)</option>
            <option value="ix">নবম শ্রেণি (Class IX)</option>
            <option value="x">দশম শ্রেণি (Class X)</option>
            <option value="xi">একাদশ শ্রেণি (Class XI)</option>
          </select>
        </div>

        <!-- Section Select -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1">
            <i data-lucide="users" class="w-4 h-4 text-indigo-500"></i> সেকশন (Section)
          </label>
          <select id="sectionSelect" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white text-sm font-medium">
            <option value="A">Section A</option>
            <option value="B">Section B</option>
            <option value="C">Section C</option>
          </select>
        </div>

        <!-- Exam Select (Dynamic) -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1">
            <i data-lucide="clipboard-check" class="w-4 h-4 text-indigo-500"></i> পরীক্ষা (Exam)
          </label>
          <select id="examSelect" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white text-sm font-medium">
            <!-- Dynamic Population -->
          </select>
        </div>

      </div>

      <!-- Action Button -->
      <div class="mt-6 flex justify-center">
        <button id="downloadBtn" onclick="fetchAndGeneratePDF()" class="w-full md:w-auto px-8 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold rounded-lg shadow-md flex items-center justify-center gap-2 transition duration-200">
          <i data-lucide="download" class="w-5 h-5"></i>
          PDF টেবিল ডাউনলোড করুন
        </button>
      </div>

      <!-- Inline Status Messages (No Popups) -->
      <div id="statusContainer" class="mt-5 hidden">
        <!-- Loading State -->
        <div id="loadingStatus" class="hidden bg-blue-50 border border-blue-200 text-blue-800 px-4 py-3 rounded-lg flex items-center gap-3">
          <svg class="animate-spin h-5 w-5 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="text-sm font-medium">ডাটা সংগ্রহ করে PDF তৈরি হচ্ছে...</span>
        </div>

        <!-- Success State -->
        <div id="successStatus" class="hidden bg-emerald-50 border border-emerald-300 text-emerald-800 px-4 py-3 rounded-lg flex items-center gap-3">
          <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-600"></i>
          <span id="successText" class="text-sm font-medium">PDF সফলভাবে ডাউনলোড হয়েছে!</span>
        </div>

        <!-- Error State -->
        <div id="errorStatus" class="hidden bg-rose-50 border border-rose-300 text-rose-800 px-4 py-3 rounded-lg flex items-center gap-3">
          <i data-lucide="alert-triangle" class="w-5 h-5 text-rose-600"></i>
          <span id="errorText" class="text-sm font-medium">কোনো সমস্যা দেখা দিয়েছে।</span>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 py-3 text-center text-xs">
    <p>© 2026 পতপুকুর হাই স্কুল (উ: মা:) — সমস্ত অধিকার সংরক্ষিত</p>
  </footer>

  <script>
    // Lucide Icons init
    lucide.createIcons();

    // Supabase Configuration
    const SUPABASE_URL = "https://bjjwzgzjjcpnndbuelkh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqand6Z3pqamNwbm5kYnVlbGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTk1NDMsImV4cCI6MjEwMjM5NTU0M30.ICT0pRA2GtlJhxKxo8ghp0x2pVLem1csBkq_hvNVGUs";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const CURRENT_SESSION = "2026";

    // Dynamic Exam Mapping according to Class
    const examMapByClass = {
      v: [
        { val: "e1", label: "প্রথম পর্যায়ক্রমিক মূল্যায়ন (1st Exam)" },
        { val: "e2", label: "দ্বিতীয় পর্যায়ক্রমিক মূল্যায়ন (2nd Exam)" },
        { val: "e3", label: "তৃতীয় পর্যায়ক্রমিক মূল্যায়ন (3rd Exam)" }
      ],
      vi: [
        { val: "e1", label: "প্রথম পর্যায়ক্রমিক মূল্যায়ন (1st Exam)" },
        { val: "e2", label: "দ্বিতীয় পর্যায়ক্রমিক মূল্যায়ন (2nd Exam)" },
        { val: "e3", label: "তৃতীয় পর্যায়ক্রমিক মূল্যায়ন (3rd Exam)" }
      ],
      vii: [
        { val: "e1", label: "প্রথম পর্যায়ক্রমিক মূল্যায়ন (1st Exam)" },
        { val: "e2", label: "দ্বিতীয় পর্যায়ক্রমিক মূল্যায়ন (2nd Exam)" },
        { val: "e3", label: "তৃতীয় পর্যায়ক্রমিক মূল্যায়ন (3rd Exam)" }
      ],
      viii: [
        { val: "e1", label: "প্রথম পর্যায়ক্রমিক মূল্যায়ন (1st Exam)" },
        { val: "e2", label: "দ্বিতীয় পর্যায়ক্রমিক মূল্যায়ন (2nd Exam)" },
        { val: "e3", label: "তৃতীয় পর্যায়ক্রমিক মূল্যায়ন (3rd Exam)" }
      ],
      ix: [
        { val: "e1", label: "প্রথম পর্যায়ক্রমিক মূল্যায়ন (1st Exam)" },
        { val: "e2", label: "দ্বিতীয় পর্যায়ক্রমিক মূল্যায়ন (2nd Exam)" },
        { val: "e3", label: "তৃতীয় পর্যায়ক্রমিক মূল্যায়ন (3rd Exam)" },
        { val: "proj", label: "প্রকল্প মূল্যায়ন (Project)" }
      ],
      x: [
        { val: "e1", label: "প্রথম পর্যায়ক্রমিক মূল্যায়ন (1st Exam)" },
        { val: "e2", label: "দ্বিতীয় পর্যায়ক্রমিক মূল্যায়ন (2nd Exam)" },
        { val: "test", label: "টেস্ট পরীক্ষা (Test Exam)" }
      ],
      xi: [
        { val: "sem1", label: "সেমিস্টার ১ (Semester I)" },
        { val: "sem2", label: "সেমিস্টার ২ (Semester II)" },
        { val: "proj", label: "প্রকল্প (Project)" }
      ]
    };

    // Bengali Subject Names Mapping for PDF Header
    const bengaliSubjectNames = {
      bengali: "বাংলা",
      english: "ইংরেজি",
      math: "গণিত",
      science: "বিজ্ঞান",
      life_science: "জীবন বিজ্ঞান",
      physical_science: "ভৌত বিজ্ঞান",
      history: "ইতিহাস",
      geography: "ভূগোল",
      arabic: "আরবি",
      sanskrit: "সংস্কৃত",
      philosophy: "দর্শন",
      education: "শিক্ষাবিজ্ঞান",
      political_science: "রাষ্ট্রবিজ্ঞান",
      work_education: "কর্মশিক্ষা",
      physical_education: "শারীরশিক্ষা"
    };

    // Update Exam dropdown when class selection changes
    function updateExamOptions() {
      const cls = document.getElementById('classSelect').value;
      const examSelect = document.getElementById('examSelect');
      examSelect.innerHTML = '';

      const options = examMapByClass[cls] || [];
      options.forEach(opt => {
        const el = document.createElement('option');
        el.value = opt.val;
        el.textContent = opt.label;
        examSelect.appendChild(el);
      });
    }

    // Initialize dropdown on load
    updateExamOptions();

    // UI Status Renderer (No Popups)
    function showStatus(type, msg = '') {
      const container = document.getElementById('statusContainer');
      const loading = document.getElementById('loadingStatus');
      const success = document.getElementById('successStatus');
      const error = document.getElementById('errorStatus');

      container.classList.remove('hidden');
      loading.classList.add('hidden');
      success.classList.add('hidden');
      error.classList.add('hidden');

      if (type === 'loading') {
        loading.classList.remove('hidden');
      } else if (type === 'success') {
        document.getElementById('successText').innerText = msg;
        success.classList.remove('hidden');
      } else if (type === 'error') {
        document.getElementById('errorText').innerText = msg;
        error.classList.remove('hidden');
      }
    }

    // Fetch Data from Supabase and Build PDF
    async function fetchAndGeneratePDF() {
      const cls = document.getElementById('classSelect').value;
      const section = document.getElementById('sectionSelect').value;
      const examPrefix = document.getElementById('examSelect').value;
      const downloadBtn = document.getElementById('downloadBtn');

      downloadBtn.disabled = true;
      showStatus('loading');

      try {
        const tableName = `result_${cls}`;

        // Fetch Data from Supabase
        const { data, error } = await supabaseClient
          .from(tableName)
          .select('*')
          .eq('session', CURRENT_SESSION)
          .eq('section', section)
          .order('roll_no', { ascending: true });

        if (error) throw error;

        if (!data || data.length === 0) {
          showStatus('error', `শ্রেণি: ${cls.toUpperCase()}, সেকশন: ${section}-এর কোনো ডাটা পাওয়া যায়নি।`);
          downloadBtn.disabled = false;
          return;
        }

        // Generate A4 Compact PDF
        generateCompactPDF(data, cls, section, examPrefix);
        showStatus('success', `শ্রেণি ${cls.toUpperCase()} (${section})-এর রেজাল্ট PDF ডাউনলোড হয়েছে।`);

      } catch (err) {
        console.error(err);
        showStatus('error', 'ডাটাবেজ কানেকশন বা তথ্য আনার ক্ষেত্রে ত্রুটি ঘটেছে: ' + err.message);
      } fontFinally: {
        downloadBtn.disabled = false;
      }
      downloadBtn.disabled = false;
    }

    function generateCompactPDF(data, cls, section, examPrefix) {
      const { jsPDF } = window.jspdf;
      
      // Vertical / Portrait A4 Page
      const doc = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
      });

      const prefix = `${examPrefix}_`;
      const sampleRow = data[0];
      
      // Filter subjects related to chosen exam
      const examSubjectKeys = Object.keys(sampleRow).filter(k => k.startsWith(prefix));

      // 1. Header Information (Compact Top Alignment)
      doc.setFontSize(13);
      doc.setFont('helvetica', 'bold');
      doc.text("Pathpukur High School (H.S.)", 105, 10, { align: "center" });

      doc.setFontSize(9);
      doc.setFont('helvetica', 'normal');
      const examLabelText = document.getElementById('examSelect').options[document.getElementById('examSelect').selectedIndex].text;
      doc.text(`Class: ${cls.toUpperCase()} | Section: ${section} | Exam: ${examLabelText} | Session: ${CURRENT_SESSION}`, 105, 15, { align: "center" });
      
      // Minimal line separator
      doc.setLineWidth(0.3);
      doc.line(8, 17, 202, 17);

      // 2. Dynamic Table Headers (Bengali labels)
      const tableHeaders = [["Roll", "Student Name"]];
      examSubjectKeys.forEach(k => {
        const rawSubject = k.replace(prefix, '');
        const bnName = bengaliSubjectNames[rawSubject] || rawSubject;
        tableHeaders[0].push(bnName);
      });
      tableHeaders[0].push("Total");

      // 3. Dynamic Rows Data
      const tableRows = data.map(row => {
        let grandTotal = 0;
        const rowArr = [row.roll_no, row.student_name];

        examSubjectKeys.forEach(k => {
          const val = row[k];
          if (val !== null && val !== undefined) {
            rowArr.push(val);
            grandTotal += Number(val);
          } else {
            rowArr.push("-");
          }
        });

        rowArr.push(grandTotal);
        return rowArr;
      });

      // 4. Ultra-Compact Paper-Saving AutoTable PDF Layout
      doc.autoTable({
        startY: 19,
        head: tableHeaders,
        body: tableRows,
        theme: 'plain', // Minimalist theme to remove thick borders and save ink/space
        styles: {
          fontSize: 7.5,
          cellPadding: 1.2,
          halign: 'center',
          valign: 'middle',
          lineWidth: 0.1,
          lineColor: [180, 180, 180]
        },
        headStyles: {
          fillColor: [230, 235, 245],
          textColor: [0, 0, 0],
          fontStyle: 'bold',
          lineWidth: 0.2,
          lineColor: [100, 100, 100]
        },
        columnStyles: {
          0: { cellWidth: 12 }, // Roll
          1: { halign: 'left', cellWidth: 42 } // Student Name
        },
        margin: { top: 8, bottom: 8, left: 8, right: 8 }, // Ultra-narrow margins
        pageBreak: 'auto'
      });

      // Save PDF
      doc.save(`Result_Class_${cls.toUpperCase()}_Sec_${section}_${CURRENT_SESSION}.pdf`);
    }
  </script>
</body>
</html>
