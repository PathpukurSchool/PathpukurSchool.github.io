<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathpukur High School (HS) - Result Export & Secured Import</title>
  
  <!-- FontAwesome Icons & Bangla Font -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- SheetJS & PapaParse for File Processing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tiro Bangla', 'Poppins', sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    .card-container {
      width: 100%;
      max-width: 680px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      margin-top: 10px;
      border: 1px solid #e2e8f0;
    }

    .header {
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: #ffffff;
      padding: 20px 15px;
      text-align: center;
    }

    .header h1 {
      font-size: 22px;
      margin-bottom: 5px;
      letter-spacing: 0.5px;
    }

    .header h2 {
      font-size: 14px;
      font-weight: 400;
      color: #93c5fd;
    }

    .description-box {
      background: #f8fafc;
      border-left: 4px solid #2563eb;
      padding: 12px 15px;
      margin: 15px;
      border-radius: 4px;
      font-size: 13px;
      color: #334155;
      line-height: 1.6;
    }

    .description-box i {
      color: #2563eb;
      margin-right: 5px;
    }

    .form-body {
      padding: 10px 20px 25px 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: #fff;
      transition: all 0.2s ease-in-out;
    }

    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Security Section Styling */
    .security-box {
      background: #fffbeeb0;
      border: 1px solid #fde68a;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 18px;
    }

    .security-box label {
      color: #92400e;
    }

    /* Button Grid Layout */
    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      width: 100%;
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s ease-in-out, transform 0.1s;
    }

    .btn-download { background: #16a34a; }
    .btn-download:hover { background: #15803d; }

    .btn-upload { background: #2563eb; }
    .btn-upload:hover { background: #1d4ed8; }

    .btn:active { transform: scale(0.99); }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }

    /* Upload Box Styling */
    .file-drop-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      background: #fafafa;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .file-drop-zone:hover {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .file-drop-zone i {
      font-size: 24px;
      color: #64748b;
      margin-bottom: 5px;
    }

    .file-drop-zone p {
      font-size: 12px;
      color: #64748b;
    }

    /* Status Notifications */
    .status-msg {
      margin-top: 15px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 8px;
      word-break: break-word;
    }

    .status-info { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; display: flex; }
    .status-success { background: #dcfce7; color: #15803d; border: 1px solid #86efac; display: flex; }
    .status-error { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; display: flex; }

    @media (max-width: 520px) {
      .button-grid { grid-template-columns: 1fr; }
      .header h1 { font-size: 18px; }
      body { padding: 8px; }
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- হেডার -->
    <div class="header">
      <h1><i class="fa-solid fa-school"></i> Pathpukur High School (HS)</h1>
      <h2><i class="fa-solid fa-shield-halved"></i> Secured Result Management Portal</h2>
    </div>

    <!-- বিবরণ -->
    <div class="description-box">
      <p><i class="fa-solid fa-circle-info"></i> <strong>নির্দেশিকা:</strong> এক্সেল ফাইল ডাউনলোডের জন্য কোনো পাসকীর প্রয়োজন নেই। তবে ডাটাবেজে ফাইল আপলোড বা আপডেট করার জন্য সঠিক <strong>পাসকী (Passkey)</strong> দেওয়া বাধ্যতামূলক এবং সিস্টেমে <strong>এডিট মোড অন (Edit Mode True)</strong> থাকতে হবে।</p>
    </div>

    <!-- ফরম বডি -->
    <div class="form-body">
      <!-- শ্রেণী নির্বাচন -->
      <div class="form-group">
        <label for="classSelect"><i class="fa-solid fa-layer-group"></i> শ্রেণী নির্বাচন করুন (Select Class):</label>
        <select id="classSelect" class="form-control">
          <option value="">-- শ্রেণী নির্বাচন করুন --</option>
          <option value="v">Class V</option>
          <option value="vi">Class VI</option>
          <option value="vii">Class VII</option>
          <option value="viii">Class VIII</option>
          <option value="ix">Class IX</option>
          <option value="x">Class X</option>
          <option value="xi">Class XI</option>
        </select>
      </div>

      <!-- আপলোড সিকিউরিটি বক্স (Passkey Input) -->
      <div class="security-box">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="passkeyInput"><i class="fa-solid fa-lock"></i> আপলোড পাসকী প্রদান করুন (Upload Passkey):</label>
          <input type="password" id="passkeyInput" class="form-control" placeholder="এখানে সিকিউরিটি পাসকী লিখুন...">
        </div>
      </div>

      <!-- ফাইল ড্রপ জোন -->
      <div class="form-group">
        <label><i class="fa-solid fa-file-csv"></i> ফাইল নির্বাচন করুন (.xlsx / .csv):</label>
        <div class="file-drop-zone" onclick="document.getElementById('fileInput').click()">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <p id="fileNameDisplay">ফাইল নির্বাচন করতে এখানে ক্লিক করুন</p>
          <input type="file" id="fileInput" accept=".csv, .xlsx, .xls" style="display: none;" onchange="handleFileSelect(event)">
        </div>
      </div>

      <!-- অ্যাকশন বাটন -->
      <div class="button-grid">
        <button id="downloadBtn" class="btn btn-download" onclick="downloadExcel()">
          <i class="fa-solid fa-file-excel"></i> এক্সেল ডাউনলোড
        </button>
        <button id="uploadBtn" class="btn btn-upload" onclick="validateAndUpload()">
          <i class="fa-solid fa-cloud-arrow-up"></i> ফাইল আপলোড করুন
        </button>
      </div>

      <!-- নোটিফিকেশন মেসেজ বক্স -->
      <div id="statusBox" class="status-msg"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://bjjwzgzjjcpnndbuelkh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqand6Z3pqamNwbm5kYnVlbGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTk1NDMsImV4cCI6MjEwMjM5NTU0M30.ICT0pRA2GtlJhxKxo8ghp0x2pVLem1csBkq_hvNVGUs";

    // Supabase JS Client ইনিশিয়ালাইজেশন
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const tableMapping = {
      "v": "result_v",
      "vi": "result_vi",
      "vii": "result_vii",
      "viii": "result_viii",
      "ix": "result_ix",
      "x": "result_x",
      "xi": "result_xi"
    };

    let selectedFile = null;

    function showStatus(message, type) {
      const statusBox = document.getElementById('statusBox');
      statusBox.className = 'status-msg status-' + type;
      
      let icon = '';
      if (type === 'info') icon = '<i class="fa-solid fa-spinner fa-spin"></i> ';
      else if (type === 'success') icon = '<i class="fa-solid fa-circle-check"></i> ';
      else if (type === 'error') icon = '<i class="fa-solid fa-circle-exclamation"></i> ';

      statusBox.innerHTML = icon + message;
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        selectedFile = file;
        document.getElementById('fileNameDisplay').innerHTML = `<strong>নির্বাচিত ফাইল:</strong> ${file.name}`;
      }
    }

    // --- ১. কোনো পাসকী ছাড়াই এক্সেল ডাউনলোড ---
    async function downloadExcel() {
      const selectedClass = document.getElementById('classSelect').value;
      if (!selectedClass) {
        showStatus("অনুগ্রহ করে একটি শ্রেণী নির্বাচন করুন!", "error");
        return;
      }

      const tableName = tableMapping[selectedClass];
      showStatus(`Supabase থেকে ${selectedClass.toUpperCase()} ক্লাসের ডাটা তৈরি করা হচ্ছে...`, "info");

      try {
        const { data, error } = await supabaseClient
          .from(tableName)
          .select('*')
          .order('id', { ascending: true }); // id বা আপনার প্রাইমারি কি অনুযায়ী সাজানো

        if (error) throw error;

        if (!data || data.length === 0) {
          showStatus(`Class ${selectedClass.toUpperCase()} এর টেবিলে কোনো ডাটা নেই!`, "error");
          return;
        }

        const worksheet = XLSX.utils.json_to_sheet(data);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, `Class_${selectedClass.toUpperCase()}`);

        const fileName = `Result_Class_${selectedClass.toUpperCase()}_2026.xlsx`;
        XLSX.writeFile(workbook, fileName);

        showStatus(`সফলভাবে ${fileName} ফাইলটি ডাউনলোড হয়েছে!`, "success");

      } catch (error) {
        console.error("Download Error:", error);
        showStatus(`ডাটা ডাউনলোডে সমস্যা হয়েছে: ${error.message || 'ইন্টারনেট কানেকশন চেক করুন'}`, "error");
      }
    }

    // --- ২. পাসকী ও এডিট মোড যাচাইকরণ ---
    async function validateAndUpload() {
      const selectedClass = document.getElementById('classSelect').value;
      const userPasskey = document.getElementById('passkeyInput').value.trim();

      if (!selectedClass) {
        showStatus("অনুগ্রহ করে যে ক্লাসের ডাটা আপলোড করতে চান তা নির্বাচন করুন!", "error");
        return;
      }

      if (!userPasskey) {
        showStatus("ফাইল আপলোড করতে পাসকী প্রদান করা বাধ্যতামূলক!", "error");
        return;
      }

      if (!selectedFile) {
        showStatus("আপলোড করার জন্য একটি Excel বা CSV ফাইল নির্বাচন করুন!", "error");
        return;
      }

      showStatus("পাসকী এবং সিকিউরিটি সেটিংস যাচাই করা হচ্ছে...", "info");

      try {
        // Supabase Client ব্যবহার করে page_settings ডাটা লোড
        const { data: settingsData, error } = await supabaseClient
          .from('page_settings')
          .select('*')
          .eq('page_name', 'upload_result_file');

        if (error) throw error;

        if (!settingsData || settingsData.length === 0) {
          showStatus("সিস্টেম সিকিউরিটি সেটিংস পাওয়া যায়নি! ('upload_result_file' নাম রো চেক করুন)", "error");
          return;
        }

        const pageConfig = settingsData[0];

        // ক) Edit Mode যাচাই
        if (pageConfig.edit_mode !== true) {
          showStatus("বর্তমানে ফাইল আপলোড বা এডিট করার সুবিধাটি বন্ধ রয়েছে (Edit Mode Disabled)!", "error");
          return;
        }

        // খ) Passkey সঠিকতা নিশ্চিত করা
        if (String(pageConfig.passkey).trim() !== userPasskey) {
          showStatus("আপনার দেওয়া পাসকীটি ভুল! সঠিক পাসকী দিয়ে চেষ্টা করুন।", "error");
          return;
        }

        // সিকিউরিটি পাস করলে ডাটা প্রসেস শুরু হবে
        processAndPushFile(tableMapping[selectedClass]);

      } catch (error) {
        console.error("Validation Error:", error);
        showStatus(`যাচাইকরণের সময় সমস্যা দেখা দিয়েছে: ${error.message || 'নেটওয়ার্ক চেক করুন'}`, "error");
      }
    }

    // --- ৩. ফাইল প্রসেস করে Supabase এ আপলোড করা ---
    function processAndPushFile(tableName) {
      showStatus("ফাইল প্রসেস করে Supabase এ আপলোড করা হচ্ছে...", "info");
      const fileExt = selectedFile.name.split('.').pop().toLowerCase();

      if (fileExt === 'csv') {
        Papa.parse(selectedFile, {
          header: true,
          dynamicTyping: true,
          skipEmptyLines: true,
          complete: function (results) {
            cleanAndPushData(tableName, results.data);
          }
        });
      } else if (fileExt === 'xlsx' || fileExt === 'xls') {
        const reader = new FileReader();
        reader.onload = function (e) {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          
          // empty cells handled properly
          const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: null });
          cleanAndPushData(tableName, jsonData);
        };
        reader.readAsArrayBuffer(selectedFile);
      } else {
        showStatus("কেবলমাত্র .csv অথবা .xlsx ফাইল আপলোড করা যাবে!", "error");
      }
    }

    // ডাটা ক্লিয়ারেন্স (ফাঁকা স্পেস বাদ দেওয়া)
    function cleanAndPushData(tableName, rawData) {
      if (!rawData || rawData.length === 0) {
        showStatus("ফাইলে কোনো ডাটা পাওয়া যায়নি!", "error");
        return;
      }

      // অবজেক্টের কী (Key) থেকে অপ্রয়োজনীয় হোয়াইটস্পেস তুলে ফেলা
      const cleanedData = rawData.map(row => {
        const newRow = {};
        Object.keys(row).forEach(key => {
          const cleanKey = key.trim();
          newRow[cleanKey] = row[key] === '' ? null : row[key];
        });
        return newRow;
      });

      pushToSupabase(tableName, cleanedData);
    }

    // --- ৪. Supabase ডাটাবেজে Bulk Upsert পাঠানো ---
    async function pushToSupabase(tableName, payloadData) {
      try {
        // Supabase Upsert Operation
        const { data, error } = await supabaseClient
          .from(tableName)
          .upsert(payloadData);

        if (error) throw error;

        showStatus(`🎉 সফলভাবে ${payloadData.length} টি রেকর্ড ${tableName} টেবিলে আপলোড/আপডেট করা হয়েছে!`, "success");
        document.getElementById('passkeyInput').value = ''; // সফল হলে পাসকী ফিল্ড ক্লিয়ার হবে
        document.getElementById('fileInput').value = '';
        document.getElementById('fileNameDisplay').innerText = 'ফাইল নির্বাচন করতে এখানে ক্লিক করুন';
        selectedFile = null;

      } catch (err) {
        console.error("Supabase Upload Error:", err);
        showStatus(`আপলোড ব্যর্থ হয়েছে: ${err.message || 'কলাম নেম বা টেবিল ফরম্যাট সঠিক নেই'}`, "error");
      }
    }
  </script>
</body>
</html>
