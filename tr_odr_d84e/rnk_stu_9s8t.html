    // শ্রেণী অনুযায়ী ডাটা লোড ফাংশন
    async function loadClassData() {
        const refreshIcon = document.getElementById('refreshIcon');
        if (refreshIcon) refreshIcon.classList.add('fa-spin');

        const selectedClass = document.getElementById('classSelect').value;
        currentConfig = classRules[selectedClass];

        const { data, error } = await _supabase.from(currentConfig.table).select('*');

        if (error) {
            alert("ডাটা পেতে সমস্যা হয়েছে: " + error.message);
            if (refreshIcon) refreshIcon.classList.remove('fa-spin');
            return;
        }

        if (data && data.length > 0) {
            const sessionElem = document.getElementById('sessionDisplay');
            if (sessionElem) sessionElem.innerText = data[0].session || "2026";
        }

        // প্রক্রিয়াকরণ এবং র‍্যাঙ্ক গণনা
        currentClassStudents = processAndRankStudents(data || [], currentConfig, selectedClass);

        renderSubjectInfoBanner(currentConfig);

        const totalClassMarks = currentClassStudents.reduce((acc, curr) => acc + curr.grandTotal, 0);

        const noDataAlert = document.getElementById('noDataAlert');
        const tableSection = document.getElementById('tableSection');

        if (currentClassStudents.length === 0 || totalClassMarks === 0) {
            if (noDataAlert) noDataAlert.classList.remove('hidden');
            if (tableSection) tableSection.classList.add('hidden');
            if (refreshIcon) refreshIcon.classList.remove('fa-spin');
            return;
        }

        if (noDataAlert) noDataAlert.classList.add('hidden');
        if (tableSection) tableSection.classList.remove('hidden');

        // ড্রপডাউনের পছন্দ অনুযায়ী সর্ট করে ডাটা দেখানো
        sortAndRenderTable();

        if (refreshIcon) setTimeout(() => { refreshIcon.classList.remove('fa-spin'); }, 500);
    }

    // ছাত্র-ছাত্রীদের নম্বর হিসাব ও র‍্যাঙ্ক নির্ধারণ
    function processAndRankStudents(rawData, config, classKey) {
        if (!rawData || rawData.length === 0) return [];

        let activeExamIndexes = [];

        if (classKey === 'x') {
            const hasTestUploaded = rawData.some(st => 
                config.subjects.some(sub => st[`test_${sub.key}`] !== null && st[`test_${sub.key}`] !== undefined)
            );

            if (hasTestUploaded) {
                activeExamIndexes = [2];
            } else {
                config.exams.forEach((ex, exIdx) => {
                    const hasMarks = rawData.some(st => 
                        config.subjects.some(sub => st[`${ex.key}${sub.key}`] !== null && st[`${ex.key}${sub.key}`] !== undefined)
                    );
                    if (hasMarks) activeExamIndexes.push(exIdx);
                });
            }
        } else {
            config.exams.forEach((ex, exIdx) => {
                const hasMarks = rawData.some(st => 
                    config.subjects.some(sub => st[`${ex.key}${sub.key}`] !== null && st[`${ex.key}${sub.key}`] !== undefined)
                );
                if (hasMarks) activeExamIndexes.push(exIdx);
            });
        }

        let fullMarksPerSubject = {};
        let classTotalFullMarks = 0;

        config.subjects.forEach(sub => {
            let subFM = 0;
            activeExamIndexes.forEach(exIdx => {
                subFM += sub.marks[exIdx];
            });
            fullMarksPerSubject[sub.key] = subFM;
        });

        activeFullMarksPerSubject = fullMarksPerSubject;

        if (config.isBestOfFive) {
            const sortedFMs = Object.values(fullMarksPerSubject).sort((a, b) => b - a);
            classTotalFullMarks = sortedFMs.slice(0, 5).reduce((a, b) => a + b, 0);
        } else {
            classTotalFullMarks = Object.values(fullMarksPerSubject).reduce((a, b) => a + b, 0);
        }

        currentCalculatedFullMarks = classTotalFullMarks;

        let processed = rawData.map(st => {
            let subjectTotals = {};
            let subjectScoresList = [];
            let grandTotal = 0;
            let hasAbsent = false;
            let failedPassRule = false;

            config.subjects.forEach(sub => {
                let subSum = 0;
                let subHasData = false;

                activeExamIndexes.forEach(exIdx => {
                    const ex = config.exams[exIdx];
                    const key = `${ex.key}${sub.key}`;
                    if (st[key] !== undefined && st[key] !== null) {
                        subSum += Number(st[key]);
                        subHasData = true;
                    } else if (st.hasOwnProperty(key) && st[key] === null) {
                        hasAbsent = true;
                    }
                });

                if (subHasData) {
                    subjectTotals[sub.key] = subSum;
                    subjectScoresList.push({ key: sub.key, score: subSum, fm: fullMarksPerSubject[sub.key] });
                }
            });

            if (config.isBestOfFive) {
                subjectScoresList.sort((a, b) => b.score - a.score);
                const best5 = subjectScoresList.slice(0, 5);
                grandTotal = best5.reduce((acc, curr) => acc + curr.score, 0);

                if (grandTotal < (classTotalFullMarks * config.passPct)) {
                    failedPassRule = true;
                }
            } else {
                grandTotal = Object.values(subjectTotals).reduce((a, b) => a + b, 0);

                if (classKey === 'x' && activeExamIndexes.includes(2)) {
                    Object.values(subjectTotals).forEach(val => {
                        if (val < 15) failedPassRule = true;
                    });
                } else {
                    Object.entries(subjectTotals).forEach(([sKey, val]) => {
                        if (val < (fullMarksPerSubject[sKey] * config.passPct)) {
                            failedPassRule = true;
                        }
                    });
                }
            }

            const pct = classTotalFullMarks > 0 ? ((grandTotal / classTotalFullMarks) * 100).toFixed(1) : 0;

            return {
                ...st,
                subjectTotals,
                grandTotal,
                hasAbsent,
                allPassed: !failedPassRule,
                percentage: isNaN(pct) ? 0 : pct
            };
        });

        // মেধা তালিকা অনুযায়ী প্রাথমিক সাজানো
        processed.sort((a, b) => {
            if (b.grandTotal !== a.grandTotal) return b.grandTotal - a.grandTotal;
            if (a.hasAbsent !== b.hasAbsent) return a.hasAbsent ? 1 : -1;
            if (a.allPassed !== b.allPassed) return a.allPassed ? -1 : 1;
            return a.roll_no - b.roll_no;
        });

        return processed.map((st, index) => ({
            ...st,
            calculatedRank: st.grandTotal > 0 ? index + 1 : null
        }));
    }

    // বিষয়ভিত্তিক পূর্ণমানের ব্যানার প্রদর্শন
    function renderSubjectInfoBanner(config) {
        const banner = document.getElementById('subjectInfoBanner');
        const fmText = document.getElementById('dynamicFullMarksText');
        if (fmText) fmText.innerText = currentCalculatedFullMarks;
        
        if (!banner) return;
        banner.innerHTML = '';
        config.subjects.forEach(sub => {
            const subFm = activeFullMarksPerSubject[sub.key] || 0;
            banner.innerHTML += `<span class="bg-slate-100 border border-slate-200 text-slate-700 text-xs px-2.5 py-1 rounded-md font-medium">${sub.name}: <strong class="text-sky-600">${subFm}</strong></span>`;
        });
    }

    // র‍্যাঙ্ক ব্যাজ ফরম্যাট
    function getRankBadgeWithIcon(rank) {
        let iconHtml = '';
        if (rank === 1) iconHtml = `<i class="fa-solid fa-crown text-amber-400 mr-1"></i>`;
        else if (rank === 2) iconHtml = `<i class="fa-solid fa-medal text-slate-300 mr-1"></i>`;
        else if (rank === 3) iconHtml = `<i class="fa-solid fa-award text-amber-600 mr-1"></i>`;
        else if (rank >= 4 && rank <= 10) iconHtml = `<i class="fa-solid fa-star text-amber-400 mr-1"></i>`;

        const isTop10 = rank <= 10;
        const badgeBg = isTop10 ? 'bg-amber-500 text-white shadow-sm' : 'bg-sky-100 text-sky-800';

        return `<span class="inline-flex items-center justify-center ${badgeBg} px-2.5 py-0.5 rounded-full font-bold text-xs">${iconHtml}#${rank}</span>`;
    }

    // 🔄 রোল / র‍্যাঙ্ক এর ড্রপডাউন পরিবর্তন অনুযায়ী টেবিল রি-সর্ট ও রেন্ডার
    function sortAndRenderTable() {
        const sortBy = document.getElementById('sortSelect').value;
        let sortedStudents = [...currentClassStudents];

        if (sortBy === 'roll') {
            // রোল অনুযায়ী ছোট থেকে বড় (Ascending)
            sortedStudents.sort((a, b) => a.roll_no - b.roll_no);
        } else if (sortBy === 'rank') {
            // র‍্যাঙ্ক অনুযায়ী সাজানো
            sortedStudents.sort((a, b) => {
                const rankA = a.calculatedRank || 999999;
                const rankB = b.calculatedRank || 999999;
                if (rankA !== rankB) return rankA - rankB;
                return a.roll_no - b.roll_no;
            });
        }

        renderStudentTable(sortedStudents, currentConfig);
        filterTable(); // কোনো ফিল্টার টেক্সট আগে থেকে ইনপুটে লেখা থাকলে তাও অ্যাপ্লাই হবে
    }

    // বিষয়ভিত্তিক টেবিল হেডার ও ডেটা রেন্ডারিং ফাংশন
    function renderStudentTable(students, config) {
        const thead = document.getElementById('rankTableHead');
        const tbody = document.getElementById('rankTableBody');
        const badge = document.getElementById('studentCountBadge');

        if (badge) badge.innerText = `মোট: ${students.length}`;
        if (!thead || !tbody) return;

        // ১. ডাইনামিক টেবিল হেডার তৈরি
        let subjectHeaders = config.subjects.map(sub => `<th class="py-3 px-2 text-center text-xs border">${sub.name}</th>`).join('');

        thead.innerHTML = `
            <tr class="bg-slate-100 text-slate-700 font-bold border-b">
                <th class="py-3 px-3 text-center border">রোল</th>
                <th class="py-3 px-3 text-center border">সেকশন</th>
                <th class="py-3 px-4 text-left border">শিক্ষার্থীর নাম</th>
                <th class="py-3 px-3 text-center border">মেধা র‍্যাঙ্ক</th>
                ${subjectHeaders}
                <th class="py-3 px-3 text-center border">প্রাপ্ত মোট নম্বর</th>
                <th class="py-3 px-3 text-center border">শতকরা (%)</th>
            </tr>
        `;

        // ২. টেবিল বডি রেন্ডার
        tbody.innerHTML = '';

        students.forEach(st => {
            const tr = document.createElement('tr');
            tr.id = `row-roll-${st.roll_no}`;
            tr.setAttribute('data-roll', st.roll_no);
            tr.setAttribute('data-rank', st.calculatedRank || 9999);
            
            const isTop10 = st.calculatedRank && st.calculatedRank <= 10;
            const highlightClass = isTop10 ? 'bg-amber-50/50 font-semibold' : 'hover:bg-sky-50';

            tr.className = `${highlightClass} transition-colors border-b border-slate-200`;

            // বিষয়ভিত্তিক নম্বর সেল তৈরি
            let subjectCells = config.subjects.map(sub => {
                const mark = st.subjectTotals[sub.key] !== undefined ? st.subjectTotals[sub.key] : '-';
                return `<td class="py-3 px-2 text-center text-slate-700 border">${mark}</td>`;
            }).join('');

            tr.innerHTML = `
                <td class="py-3 px-3 text-center font-bold text-slate-800 border">${st.roll_no}</td>
                <td class="py-3 px-3 text-center font-semibold text-slate-600 border">${st.section || '-'}</td>
                <td class="py-3 px-4 text-left font-bold text-slate-900 border">${st.student_name}</td>
                <td class="py-3 px-3 text-center border">
                    ${st.calculatedRank ? getRankBadgeWithIcon(st.calculatedRank) : '<span class="text-slate-400">N/A</span>'}
                </td>
                ${subjectCells}
                <td class="py-3 px-3 text-center font-extrabold text-sky-600 border">${st.grandTotal}</td>
                <td class="py-3 px-3 text-center font-bold text-emerald-600 border">${st.percentage}%</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // রোল এবং র‍্যাঙ্ক অনুযায়ী টেক্সট সার্চ/ফিল্টার
    function filterTable() {
        const filterInput = document.getElementById('tableFilterInput');
        if (!filterInput) return;
        
        const searchInput = filterInput.value.trim().toLowerCase();
        const rows = document.querySelectorAll('#rankTableBody tr');

        rows.forEach(row => {
            const roll = row.getAttribute('data-roll');
            const rank = row.getAttribute('data-rank');

            if (searchInput === '' || roll.includes(searchInput) || rank.includes(searchInput)) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    }

// 🖨️ প্রিন্ট করার সময় হেডার ইংরেজিতে রূপান্তর
    function printRankTable() {
        const selectedClassKey = document.getElementById('classSelect').value;
        const classNameEn = classNameMapEn[selectedClassKey] || selectedClassKey.toUpperCase();
        const sessionText = document.getElementById('sessionDisplay').innerText || '2026';
        const visibleRows = Array.from(document.querySelectorAll('#rankTableBody tr')).filter(r => r.style.display !== 'none').length;

        const headerMeta = document.getElementById('printHeaderMeta');
        if (headerMeta) {
            headerMeta.innerText = `Class: ${classNameEn} | Session: ${sessionText} | Total Students: ${visibleRows}`;
        }

        window.print();
    }
</script>
