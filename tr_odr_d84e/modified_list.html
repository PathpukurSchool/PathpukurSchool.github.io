  <script>
  (function() {
      try {
          var isLoggedIn = sessionStorage.getItem("teacherLoggedIn") === "true";

          var ref = document.referrer;
          var isValidReferrer = false;
          if (ref) {
              var refUrl = new URL(ref);
              // আপনার ডোমেন চেক
              if (refUrl.hostname === "pathpukurschool.github.io" || refUrl.hostname === "localhost") {
                  isValidReferrer = true;
              }
          }

          // সেশন না থাকলে বা অননুমোদিত উপায়ে আসলে হোম পেজে রিডাইরেক্ট
          if (!isLoggedIn) {
              sessionStorage.clear();
              window.location.replace("https://pathpukurschool.github.io/");
              return;
          }

          // ভ্যালিড ইউজার হলে পেজ দৃশ্যমান করা
          document.addEventListener("DOMContentLoaded", function() {
              var shield = document.getElementById("security-shield");
              if (shield) shield.remove();
          });

      } catch (e) {
          sessionStorage.clear();
          window.location.replace("https://pathpukurschool.github.io/");
      }
  })();
  </script>

<script>
    // ⚡ সাব-পেজে অ্যাক্টিভিটি ট্র্যাকিং আপডেট রাখা (যাতে অহেতুক অটো-লগআউট না হয়)
    function updateActivityTime() {
        localStorage.setItem('lastActivityTime', Date.now().toString());
    }
    ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(evt => {
        document.addEventListener(evt, updateActivityTime, { passive: true });
    });
    
const SUPABASE_URL = "https://bjjwzgzjjcpnndbuelkh.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqand6Z3pqamNwbm5kYnVlbGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTk1NDMsImV4cCI6MjEwMjM5NTU0M30.ICT0pRA2GtlJhxKxo8ghp0x2pVLem1csBkq_hvNVGUs";

const supabaseClient = supabase.createClient(SUPABASE_URL, ANON_KEY);
const CLASS_ORDER = { 'V': 1, 'VI': 2, 'VII': 3, 'VIII': 4, 'IX': 5, 'X': 6, 'XI': 7 };
let trackerDataCache = {}; // ফিল্টারিংয়ের জন্য ক্যশ রিকর্ড

document.addEventListener("DOMContentLoaded", function() {
    startAutoRefreshLoop();
});

// 🟢 ১. পাসওয়ার্ড হাইড/শো করার ফাংশন
function togglePasskeyVisibility() {
    const input = document.getElementById("passkey");
    const icon = document.getElementById("togglePasskey");
    if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}

// 🟢 ২. পেজ হ্যাং প্রতিরোধে সেফ লুপ (Auto Refresh Safety Loop)
let isFetching = false;
async function startAutoRefreshLoop() {
    if (!isFetching) {
        isFetching = true;
        await refreshAllData();
        isFetching = false;
    }
    setTimeout(startAutoRefreshLoop, 100000); // একটি রিকোয়েস্ট শেষ হলে 1 মিনিট পর আবার রান হবে
}

async function refreshAllData() {
    const spinIcon = document.getElementById("spinIcon");
    if (spinIcon) spinIcon.classList.add("spinning");

    await Promise.all([
        fetchFinalisationStatus(),
        loadModifiedData()
    ]);

    if (spinIcon) setTimeout(() => spinIcon.classList.remove("spinning"), 500);
}

// 🟢 ৩. ফাইনালাইজেশন স্ট্যাটাস ট্র্যাকার
async function fetchFinalisationStatus() {
    const classes = ['v', 'vi', 'vii', 'viii', 'ix', 'x', 'xi'];

    try {
        const { data, error } = await supabaseClient
            .from('page_security')
            .select('page_name, edit_mode');

        if (error) throw error;

        classes.forEach(c => {
            const cell = document.getElementById(`status-${c}`);
            if (!cell) return;

            const pageRecord = data ? data.find(p => p.page_name === `result_${c}`) : null;

            if (pageRecord) {
                const isEditOn = String(pageRecord.edit_mode).toLowerCase() === 'true';
                trackerDataCache[c] = isEditOn ? 'active' : 'finalised';
                
                if (isEditOn) {
                    cell.innerHTML = `<span style="color:#b45309; background:#fef3c7; padding:3px 8px; border-radius:10px; font-size:11px; font-weight:bold;"><i class="fa-solid fa-pen-to-square"></i> Active</span>`;
                } else {
                    cell.innerHTML = `<span style="color:#047857; background:#d1fae5; padding:3px 8px; border-radius:10px; font-size:11px; font-weight:bold;"><i class="fa-solid fa-circle-check"></i> Finalised</span>`;
                }
            } else {
                trackerDataCache[c] = 'na';
                cell.innerHTML = `<span style="color:#94a3b8;">N/A</span>`;
            }
        });

    } catch (err) {
        console.error('Finalisation Status Error:', err);
    }
}

// 🟢 ৪. ট্র্যাকার ফিল্টার ফাংশন
function filterTracker(filterType, btnElement) {
    // ফিল্টার বাটনের অ্যাক্টিভ ক্লাস স্টেটমেন্ট
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');

    const classes = ['v', 'vi', 'vii', 'viii', 'ix', 'x', 'xi'];
    classes.forEach(c => {
        const headerCell = document.querySelector(`.cls-col[data-class="${c}"]`);
        const valueCell = document.querySelector(`.cls-val[data-class="${c}"]`);
        const status = trackerDataCache[c];

        if (filterType === 'all') {
            headerCell.style.display = '';
            valueCell.style.display = '';
        } else if (filterType === status) {
            headerCell.style.display = '';
            valueCell.style.display = '';
        } else {
            headerCell.style.display = 'none';
            valueCell.style.display = 'none';
        }
    });
}

// 🟢 ৫. ট্র্যাকিং মোড অন/অফ
async function toggleMode(enable) {
    const passkey = document.getElementById('passkey').value.trim();
    if (!passkey) {
        alert("অনুগ্রহ করে পাসকি প্রদান করুন!");
        return;
    }

    try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/toggle_modified_list_mode`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "apikey": ANON_KEY,
                "Authorization": `Bearer ${ANON_KEY}`
            },
            body: JSON.stringify({ p_passkey: passkey, p_enable: enable })
        });

        const result = await response.json();
        alert(result.message || "অপারেশন সম্পন্ন হয়েছে।");
        if (result.success) {
            document.getElementById('passkey').value = "";
        }
        loadModifiedData();
    } catch (err) {
        alert("Error: " + err.message);
    }
}

function togglePrintStatus(checkbox, key) {
    const row = checkbox.closest('tr');
    if (checkbox.checked) {
        row.classList.add('completed-row');
        localStorage.setItem(key, 'true');
    } else {
        row.classList.remove('completed-row');
        localStorage.removeItem(key);
    }
}

// 🟢 ৬. সংশোধিত তথ্য লোড করা
async function loadModifiedData() {
    try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_modified_students_list`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "apikey": ANON_KEY,
                "Authorization": `Bearer ${ANON_KEY}`
            }
        });

        const result = await response.json();
        const statusDiv = document.getElementById("statusMessage");
        const tableWrapper = document.getElementById("tableWrapper");
        const tbody = document.getElementById("tableBody");
        const btnEnable = document.getElementById("btnEnable");
        const btnDisable = document.getElementById("btnDisable");

        if (!result || !result.is_active) {
            statusDiv.innerHTML = `<div class="status-badge status-inactive"><i class="fa-solid fa-circle-exclamation"></i> ট্র্যাকিং মোড বন্ধ রয়েছে। কোনো রেকর্ড দেখা যাবে না।</div>`;
            tableWrapper.style.display = "none";
            btnEnable.style.display = "inline-flex";
            btnDisable.style.display = "none";
            return;
        }

        btnEnable.style.display = "none";
        btnDisable.style.display = "inline-flex";

        if (!result.data || result.data.length === 0) {
            statusDiv.innerHTML = `<div class="status-badge status-active"><i class="fa-solid fa-info-circle"></i> ট্র্যাকিং মোড চালু রয়েছে। তবে এখনও কোনো নম্বর সংশোধন করা হয়নি।</div>`;
            tableWrapper.style.display = "none";
            return;
        }

        statusDiv.innerHTML = `<div class="status-badge status-active"><i class="fa-solid fa-check-circle"></i> ট্র্যাকিং মোড চালু রয়েছে। মোট ${result.data.length}টি সংশোধন পাওয়া গেছে।</div>`;
        tbody.innerHTML = "";

        // ক্লাস অনুসারে সাজানো
        result.data.sort((a, b) => {
            const classA = a.class_name.replace('result_', '').toUpperCase();
            const classB = b.class_name.replace('result_', '').toUpperCase();
            
            const orderA = CLASS_ORDER[classA] || 99;
            const orderB = CLASS_ORDER[classB] || 99;

            if (orderA !== orderB) {
                return orderA - orderB;
            }
            return (a.roll_no || 0) - (b.roll_no || 0);
        });

        result.data.forEach(row => {
            // 🟢 ইংরেজিতে তারিখ ও সময় ফর্ম্যাট (English Format)
            const timeObj = new Date(row.modified_at);
            const time = timeObj.toLocaleString('en-GB', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            }).toUpperCase();

            const classNameFormatted = row.class_name.replace('result_', '').toUpperCase();
            const printStorageKey = `print_${row.class_name}_${row.student_id}_${row.updated_column}`;
            const isPrinted = localStorage.getItem(printStorageKey) === 'true';

            tbody.innerHTML += `
                <tr class="${isPrinted ? 'completed-row' : ''}">
                    <td class="col-check" style="text-align: center;">
                        <input type="checkbox" ${isPrinted ? 'checked' : ''} onchange="togglePrintStatus(this, '${printStorageKey}')" style="cursor: pointer; width: 16px; height: 16px;">
                    </td>
                    <td><strong>${classNameFormatted}</strong></td>
                    <td>${row.section || 'A'}</td>
                    <td>${row.roll_no}</td>
                    <td style="text-align: left; padding-left: 12px;">${row.student_name}</td>
                    <td><span class="badge-col">${row.updated_column}</span></td>
                    <td style="font-family: monospace;">${time}</td>
                </tr>
            `;
        });

        tableWrapper.style.display = "block";
    } catch (err) {
        console.error("Error fetching data:", err);
    }
}
</script>
