  <script>
  (function() {
      try {
          var isLoggedIn = sessionStorage.getItem("teacherLoggedIn") === "true";

          var ref = document.referrer;
          var isValidReferrer = false;
          if (ref) {
              var refUrl = new URL(ref);
              // আপনার ডোমেন চেক
              if (refUrl.hostname === "pathpukurschool.github.io" || refUrl.hostname === "localhost") {
                  isValidReferrer = true;
              }
          }

          // সেশন না থাকলে বা অননুমোদিত উপায়ে আসলে হোম পেজে রিডাইরেক্ট
          if (!isLoggedIn) {
              sessionStorage.clear();
              window.location.replace("https://pathpukurschool.github.io/");
              return;
          }

          // ভ্যালিড ইউজার হলে পেজ দৃশ্যমান করা
          document.addEventListener("DOMContentLoaded", function() {
              var shield = document.getElementById("security-shield");
              if (shield) shield.remove();
          });

      } catch (e) {
          sessionStorage.clear();
          window.location.replace("https://pathpukurschool.github.io/");
      }
  })();
</script>

  <script>
    function updateActivityTime() {
        localStorage.setItem('lastActivityTime', Date.now().toString());
    }
    ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(evt => {
        document.addEventListener(evt, updateActivityTime, { passive: true });
    });
    
    // Lucide Icons init
    lucide.createIcons();

    // Supabase Configuration
    const SUPABASE_URL = "https://bjjwzgzjjcpnndbuelkh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqand6Z3pqamNwbm5kYnVlbGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTk1NDMsImV4cCI6MjEwMjM5NTU0M30.ICT0pRA2GtlJhxKxo8ghp0x2pVLem1csBkq_hvNVGUs";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const CURRENT_SESSION = "2026";

    const examMapByClass = {
      v: [
        { val: "e1", label: "1st Exam" },
        { val: "e2", label: "2nd Exam" },
        { val: "e3", label: "3rd Exam" }
      ],
      vi: [
        { val: "e1", label: "1st Exam" },
        { val: "e2", label: "2nd Exam" },
        { val: "e3", label: "3rd Exam" }
      ],
      vii: [
        { val: "e1", label: "1st Exam" },
        { val: "e2", label: "2nd Exam" },
        { val: "e3", label: "3rd Exam" }
      ],
      viii: [
        { val: "e1", label: "1st Exam" },
        { val: "e2", label: "2nd Exam" },
        { val: "e3", label: "3rd Exam" }
      ],
      ix: [
        { val: "e1", label: "1st Exam" },
        { val: "e2", label: "2nd Exam" },
        { val: "e3", label: "3rd Exam" },
        { val: "proj", label: "Project" }
      ],
      x: [
        { val: "e1", label: "1st Exam" },
        { val: "e2", label: "2nd Exam" },
        { val: "test", label: "Test Exam" }
      ],
      xi: [
        { val: "sem1", label: "Semester I" },
        { val: "sem2", label: "Semester II" },
        { val: "proj", label: "Project / Practical" }
      ]
    };

    const bengaliSubjectNames = {
      bengali: "BEN",
      english: "ENG",
      math: "MATH",
      science: "EVS",
      life_science: "LSC",
      physical_science: "PSC",
      history: "HIST",
      geography: "GEO",
      arabic: "ARAB",
      sanskrit: "SNSK",
      philosophy: "PHIL",
      education: "EDCN",
      political_science: "POLS",
      work_education: "WED",
      physical_education: "PED"
    };

    function updateExamOptions() {
      const cls = document.getElementById('classSelect').value;
      const examSelect = document.getElementById('examSelect');
      examSelect.innerHTML = '';

      const options = examMapByClass[cls] || [];
      options.forEach(opt => {
        const el = document.createElement('option');
        el.value = opt.val;
        el.textContent = opt.label;
        examSelect.appendChild(el);
      });
    }

    updateExamOptions();

    function showStatus(type, msg = '') {
      const container = document.getElementById('statusContainer');
      const loading = document.getElementById('loadingStatus');
      const success = document.getElementById('successStatus');
      const error = document.getElementById('errorStatus');

      container.classList.remove('hidden');
      loading.classList.add('hidden');
      success.classList.add('hidden');
      error.classList.add('hidden');

      if (type === 'loading') {
        loading.classList.remove('hidden');
      } else if (type === 'success') {
        document.getElementById('successText').innerText = msg;
        success.classList.remove('hidden');
      } else if (type === 'error') {
        document.getElementById('errorText').innerText = msg;
        error.classList.remove('hidden');
      }
    }

    async function fetchAndGeneratePDF() {
      const cls = document.getElementById('classSelect').value;
      const section = document.getElementById('sectionSelect').value;
      const examPrefix = document.getElementById('examSelect').value;
      const downloadBtn = document.getElementById('downloadBtn');

      downloadBtn.disabled = true;
      showStatus('loading');

      try {
        const tableName = `result_${cls}`;

        const { data, error } = await supabaseClient
          .from(tableName)
          .select('*')
          .eq('session', CURRENT_SESSION)
          .eq('section', section)
          .order('roll_no', { ascending: true });

        if (error) throw error;

        if (!data || data.length === 0) {
          showStatus('error', `শ্রেণি: ${cls.toUpperCase()}, সেকশন: ${section}-এর কোনো ডাটা পাওয়া যায়নি।`);
          downloadBtn.disabled = false;
          return;
        }

        generateCompactPDF(data, cls, section, examPrefix);
        showStatus('success', `শ্রেণি ${cls.toUpperCase()} (${section})-এর রেজাল্ট PDF ডাউনলোড হয়েছে।`);

      } catch (err) {
        console.error(err);
        showStatus('error', 'ডাটাবেজ কানেকশন বা তথ্য আনার ক্ষেত্রে ত্রুটি ঘটেছে: ' + err.message);
      } finally {
        downloadBtn.disabled = false;
      }
    }

    function generateCompactPDF(data, cls, section, examPrefix) {
      const { jsPDF } = window.jspdf;
      
      const doc = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
      });

      const prefix = `${examPrefix}_`;
      const sampleRow = data[0];
      
      const examSubjectKeys = Object.keys(sampleRow).filter(k => k.startsWith(prefix));

      doc.setFontSize(13);
      doc.setFont('helvetica', 'bold');
      doc.text("Pathpukur High School (H.S.)", 105, 10, { align: "center" });

      doc.setFontSize(9);
      doc.setFont('helvetica', 'normal');
      const examLabelText = document.getElementById('examSelect').options[document.getElementById('examSelect').selectedIndex].text;
      doc.text(`Class: ${cls.toUpperCase()} | Section: ${section} | Exam: ${examLabelText} | Session: ${CURRENT_SESSION}`, 105, 15, { align: "center" });
      
      doc.setLineWidth(0.3);
      doc.line(8, 17, 202, 17);

      const tableHeaders = [["Roll", "Student Name"]];
      examSubjectKeys.forEach(k => {
        const rawSubject = k.replace(prefix, '');
        const bnName = bengaliSubjectNames[rawSubject] || rawSubject;
        tableHeaders[0].push(bnName);
      });
      tableHeaders[0].push("Total");

      const tableRows = data.map(row => {
        let grandTotal = 0;
        const rowArr = [row.roll_no, row.student_name];

        examSubjectKeys.forEach(k => {
          const val = row[k];
          if (val !== null && val !== undefined) {
            rowArr.push(val);
            grandTotal += Number(val);
          } else {
            rowArr.push("-");
          }
        });

        rowArr.push(grandTotal);
        return rowArr;
      });

      doc.autoTable({
        startY: 19,
        head: tableHeaders,
        body: tableRows,
        theme: 'plain',
        styles: {
          fontSize: 7.5,
          cellPadding: 1.2,
          halign: 'center',
          valign: 'middle',
          lineWidth: 0.1,
          lineColor: [180, 180, 180]
        },
        headStyles: {
          fillColor: [230, 235, 245],
          textColor: [0, 0, 0],
          fontStyle: 'bold',
          lineWidth: 0.2,
          lineColor: [100, 100, 100]
        },
        columnStyles: {
          0: { cellWidth: 12 },
          1: { halign: 'left', cellWidth: 42 }
        },
        margin: { top: 8, bottom: 8, left: 8, right: 8 },
        pageBreak: 'auto'
      });

      doc.save(`Result_Class_${cls.toUpperCase()}_Sec_${section}_${CURRENT_SESSION}.pdf`);
    }
  </script>
  <script src="home.js"></script>
</body>
