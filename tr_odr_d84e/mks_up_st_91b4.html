              if (refUrl.hostname === "pathpukurschool.github.io" || refUrl.hostname === "localhost") {
                  isValidReferrer = true;
              }
          }

          if (!isLoggedIn) {
              sessionStorage.clear();
              window.location.replace("https://pathpukurschool.github.io/");

          document.addEventListener("DOMContentLoaded", function() {
              var shield = document.getElementById("security-shield");
              if (shield) shield.remove();
          });

      } catch (e) {
          sessionStorage.clear();
          window.location.replace("https://pathpukurschool.github.io/");
      }

    async function loadDynamicSession(tableName) {
      try {
        const { data, error } = await supabaseClient
          .from(tableName)
          .select('session')
          .order('session', { ascending: false })
          .limit(1);

        if (error) throw error;

        if (data && data.length > 0 && data[0].session) {
          CURRENT_SESSION = data[0].session;
        }
      } catch (e) {
        console.warn('সেশন লোড করতে সমস্যা হয়েছে, ডিফল্ট সেশন ব্যবহৃত হচ্ছে:', e);
      }
      document.getElementById('current-session').innerText = CURRENT_SESSION;
    }

    function showStatus(type, message) {
      const msgDiv = document.getElementById('status-message');
      msgDiv.className = 'no-print rounded-xl p-4 mb-6 border transition-all duration-300 flex items-center gap-3';
      
      let icon = '';
      if (type === 'processing') {
        msgDiv.classList.add('bg-blue-50', 'text-blue-900', 'border-blue-200');
        icon = '<i class="fa-solid fa-spinner fa-spin text-blue-600 text-lg"></i>';
      } else if (type === 'error') {
        msgDiv.classList.add('bg-rose-50', 'text-rose-900', 'border-rose-200');
        icon = '<i class="fa-solid fa-triangle-exclamation text-rose-600 text-lg"></i>';
      } else if (type === 'success') {
        msgDiv.classList.add('bg-emerald-50', 'text-emerald-900', 'border-emerald-200');
        icon = '<i class="fa-solid fa-circle-check text-emerald-600 text-lg"></i>';
      }
      
      msgDiv.innerHTML = `${icon}<span class="font-medium text-sm sm:text-base">${message}</span>`;
    }

    function clearStatus() {
      const msgDiv = document.getElementById('status-message');
      msgDiv.classList.add('hidden');
      msgDiv.innerHTML = '';
    }

    async function fetchClassStatus() {
      const selectedClass = document.getElementById('class-select').value;
      const tablesContainer = document.getElementById('tables-container');
      const summarySection = document.getElementById('summary-section');
      const summaryCards = document.getElementById('summary-cards');

      tablesContainer.innerHTML = '';
      summaryCards.innerHTML = '';
      summarySection.classList.add('hidden');

      if (!selectedClass) {
        clearStatus();
        return;
      }

      showStatus('processing', `শ্রেণী ${selectedClass}-এর তথ্য লোড করা হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন।`);

      const config = classConfigs[selectedClass];

      try {
        await loadDynamicSession(config.tableName);

        const { data, error } = await supabaseClient
          .from(config.tableName)
          .select('*')
          .eq('session', CURRENT_SESSION);

        if (error) throw error;

        if (!data || data.length === 0) {
          showStatus('error', `শ্রেণী ${selectedClass}-এ সেশন ${CURRENT_SESSION}-এর কোনো শিক্ষার্থীর ডেটা পাওয়া যায়নি।`);
          return;
        }

        const sections = [...new Set(data.map(item => item.section))].sort();

        let totalStudents = data.length;
        summaryCards.innerHTML = `
          <div class="bg-emerald-900 text-white rounded-lg p-3 text-center shadow-sm border border-emerald-950">
            <div class="text-xs uppercase font-medium text-emerald-200">মোট শিক্ষার্থী</div>
            <div class="text-2xl font-bold text-amber-300 mt-0.5">${totalStudents}</div>
          </div>
        `;

        sections.forEach(sec => {
          const secCount = data.filter(d => d.section === sec).length;
          summaryCards.innerHTML += `
            <div class="bg-white border border-slate-200 rounded-lg p-3 text-center shadow-sm">
              <div class="text-xs text-slate-500 font-semibold">সেকশন ${sec}</div>
              <div class="text-xl font-bold text-slate-800 mt-0.5">${secCount}</div>
            </div>
          `;
        });
        summarySection.classList.remove('hidden');

        Object.keys(config.exams).forEach(examName => {
          const subjects = config.exams[examName];
          
          let tableHtml = `
            <div class="table-card bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden page-break-inside-avoid">
              <div class="table-header bg-slate-900 text-white px-5 py-3 flex items-center justify-between border-b border-slate-800">
                <h3 class="font-bold text-base sm:text-lg flex items-center gap-2 text-slate-100">
                  <i class="fa-solid fa-file-pen text-amber-400 no-print"></i> ${examName}
                </h3>
                <span class="text-xs bg-slate-800 font-medium text-amber-300 px-3 py-1 rounded-full border border-slate-700">শ্রেণী: ${selectedClass} | সেশন: ${CURRENT_SESSION}</span>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left text-sm border-collapse">
                  <thead>
                    <tr class="bg-slate-100 text-slate-800 font-bold border-b border-slate-300">
                      <th class="p-3 border-r border-b border-slate-300 bg-slate-200 text-slate-900 w-28">সেকশন</th>
                      ${subjects.map(s => `<th class="p-3 text-center border-r border-b border-slate-300 min-w-[100px]">${s.label}</th>`).join('')}
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-200">
          `;

          sections.forEach(sec => {
            const secData = data.filter(d => d.section === sec);
            tableHtml += `
              <tr class="hover:bg-slate-50 transition-colors">
                <td class="p-3 font-bold bg-slate-50 border-r border-slate-300 text-slate-900">সেকশন ${sec}</td>
            `;

            subjects.forEach(sub => {
              const uploadedCount = secData.filter(d => d[sub.field] !== null && d[sub.field] !== undefined && d[sub.field] !== '').length;
              
              const isZero = uploadedCount === 0;
              const displayVal = isZero ? '-' : uploadedCount;
              const cellClass = isZero ? 'zero-count border-r border-red-200' : 'text-slate-900 font-semibold border-r border-slate-200';

              tableHtml += `
                <td class="p-3 text-center ${cellClass}">
                  ${displayVal}
                </td>
              `;
            });

            tableHtml += `</tr>`;
          });

          tableHtml += `
                  </tbody>
                </table>
              </div>
            </div>
          `;

          tablesContainer.innerHTML += tableHtml;
        });

        showStatus('success', `শ্রেণী ${selectedClass}-এর নম্বর আপলোড স্ট্যাটাস (সেশন ${CURRENT_SESSION}) সফলভাবে লোড করা হয়েছে।`);

      } catch (err) {
        console.error(err);
        showStatus('error', `তথ্য লোড করতে সমস্যা হয়েছে: ${err.message || 'Supabase সংযোগ চেক করুন।'}`);
      }
    }
