<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পরীক্ষার খাতা পুনঃমূল্যায়নের আবেদন</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #1e3a8a; --accent: #2563eb; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .header { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { color: var(--primary); margin: 0 0 5px 0; font-size: 24px; }
        .header h3 { color: #64748b; margin: 0; font-size: 16px; font-weight: normal; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        input, select, button { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        button { background: var(--accent); color: #fff; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
        button:hover { background: var(--primary); }
        .alert { padding: 12px 15px; border-radius: 6px; margin-bottom: 15px; display: none; font-size: 14px; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
        .alert-success { background: #dcfce7; color: #166534; border: 1px solid #4ade80; }
        .alert-info { background: #e0f2fe; color: #075985; border: 1px solid #38bdf8; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; }
        th { background: #f1f5f9; color: var(--primary); }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-success { background: #dcfce7; color: #166534; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-top: 20px; }
        @media(max-width: 600px) { table { display: block; overflow-x: auto; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="school-name">Pathpukur High School (H.S.)</h1>
        <h3>পরীক্ষার খাতা পুনঃমূল্যায়নের আবেদন পোর্টাল (<span id="session-display">Session: Loading...</span>)</h3>
    </div>

    <div id="alert-box" class="alert"></div>

    <div class="grid">
        <div class="form-group">
            <label>শ্রেণি (Class)</label>
            <select id="class-select">
                <option value="">নির্বাচন করুন</option>
                <option value="V">Class V</option>
                <option value="VI">Class VI</option>
                <option value="VII">Class VII</option>
                <option value="VIII">Class VIII</option>
                <option value="IX">Class IX</option>
                <option value="X">Class X</option>
                <option value="XI">Class XI</option>
            </select>
        </div>
        <div class="form-group">
            <label>সেকশন (Section)</label>
            <select id="section-select">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
            </select>
        </div>
        <div class="form-group">
            <label>রোল নম্বর (1 - 700)</label>
            <input type="number" id="roll-input" min="1" max="700" placeholder="যেমন: 12">
        </div>
        <div class="form-group" style="justify-content: flex-end;">
            <button onclick="searchStudent()">খুঁজুন (Search)</button>
        </div>
    </div>

    <!-- Marks & Application Area -->
    <div id="student-section" class="card" style="display: none;">
        <h3>শিক্ষার্থীর বিবরণ ও নম্বর</h3>
        <p><strong>নাম:</strong> <span id="st-name"></span> | <strong>শ্রেণি:</strong> <span id="st-class"></span> | <strong>রোল:</strong> <span id="st-roll"></span></p>
        
        <form id="scrutiny-form">
            <table id="marks-table">
                <thead>
                    <tr>
                        <th>নির্বাচন</th>
                        <th>বিষয় (Subject)</th>
                        <th>প্রাপ্ত নম্বর</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <br>
            <button type="button" id="submit-btn" onclick="confirmAndSubmit()">আবেদন সাবমিট করুন</button>
        </form>
    </div>

    <!-- Application List Area -->
    <div class="card">
        <h3>আবেদনকারীদের তালিকা ও স্ট্যাটাস</h3>
        <table id="applications-table">
            <thead>
                <tr>
                    <th>তারিখ</th>
                    <th>শ্রেণি ও সেকশন</th>
                    <th>রোল</th>
                    <th>নাম</th>
                    <th>আবেদনকৃত বিষয় ও স্ট্যাটাস</th>
                    <th>সামগ্রিক স্ট্যাটাস</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    // Supabase Configuration
    const SUPABASE_URL = "https://bjjwzgzjjcpnndbuelkh.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqand6Z3pqamNwbm5kYnVlbGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTk1NDMsImV4cCI6MjEwMjM5NTU0M30.ICT0pRA2GtlJhxKxo8ghp0x2pVLem1csBkq_hvNVGUs";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentSession = new Date().getFullYear().toString();
    let currentStudentData = null;
    let allowedColumns = [];

    // Initialize Session & Load Application Table
    window.onload = async () => {
        document.getElementById('session-display').innerText = `Session: ${currentSession}`;
        loadAllApplications();
    };

    function showAlert(msg, type = 'error') {
        const box = document.getElementById('alert-box');
        box.className = `alert alert-${type}`;
        box.innerText = msg;
        box.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function clearAlert() {
        document.getElementById('alert-box').style.display = 'none';
    }

    // Mapping relevant exams per class
    function getExamConfig(className) {
        if (['V', 'VI', 'VII', 'VIII'].includes(className)) {
            return { table: `result_${className.toLowerCase()}`, prefix: 'e3_', label: '3rd Exam' };
        } else if (className === 'IX') {
            return { table: 'result_ix', prefix: ['e3_', 'proj_'], label: '3rd Exam & Project' };
        } else if (className === 'X') {
            return { table: 'result_x', prefix: 'test_', label: 'Test Exam' };
        } else if (className === 'XI') {
            return { table: 'result_xi', prefix: ['sem2_', 'proj_'], label: 'Semester II & Project' };
        }
        return null;
    }

    async function searchStudent() {
        clearAlert();
        document.getElementById('student-section').style.display = 'none';

        const className = document.getElementById('class-select').value;
        const section = document.getElementById('section-select').value;
        const roll = parseInt(document.getElementById('roll-input').value);

        if (!className || !roll) {
            showAlert('দয়া করে শ্রেণি এবং রোল নম্বর সঠিকভাবে পূরণ করুন।');
            return;
        }

        if (roll < 1 || roll > 700) {
            showAlert('রোল নম্বর ১ থেকে ৭০০ এর মধ্যে হতে হবে।');
            return;
        }

        const config = getExamConfig(className);

        // 1. Check if class-wide marks uploaded
        const { data: classCheck } = await supabaseClient
            .from(config.table)
            .select('*')
            .eq('session', currentSession)
            .eq('section', section)
            .limit(50);

        let isAnyUploaded = false;
        if (classCheck && classCheck.length > 0) {
            isAnyUploaded = classCheck.some(row => 
                Object.keys(row).some(k => {
                    if (Array.isArray(config.prefix)) return config.prefix.some(p => k.startsWith(p)) && row[k] !== null;
                    return k.startsWith(config.prefix) && row[k] !== null;
                })
            );
        }

        if (!isAnyUploaded) {
            showAlert(`Class ${className}-এর ${config.label}-এর নম্বর এখনো আপলোড হয়নি, তাই আবেদন করা যাবে না।`, 'error');
            return;
        }

        // 2. Fetch specific student
        const { data: student, error } = await supabaseClient
            .from(config.table)
            .select('*')
            .eq('session', currentSession)
            .eq('section', section)
            .eq('roll_no', roll)
            .single();

        if (error || !student) {
            showAlert('এই রোল নম্বরের কোনো শিক্ষার্থী খুঁজে পাওয়া যায়নি।');
            return;
        }

        // 3. Check existing application
        const { data: existingApp } = await supabaseClient
            .from('scrutiny_applications')
            .select('*')
            .eq('session', currentSession)
            .eq('class_name', className)
            .eq('section', section)
            .eq('roll_no', roll)
            .single();

        if (existingApp) {
            showAlert(`ইতিপূর্বে আপনার আবেদন জমা নেওয়া হয়েছে (স্ট্যাটাস: ${existingApp.overall_status})। দ্বিতীয়বার আবেদন করা যাবে না।`, 'info');
            return;
        }

        // Display Student Data & Subject Table
        currentStudentData = student;
        document.getElementById('st-name').innerText = student.student_name;
        document.getElementById('st-class').innerText = className;
        document.getElementById('st-roll').innerText = roll;

        const tbody = document.querySelector('#marks-table tbody');
        tbody.innerHTML = '';
        allowedColumns = [];

        Object.keys(student).forEach(col => {
            let matches = false;
            if (Array.isArray(config.prefix)) {
                matches = config.prefix.some(p => col.startsWith(p));
            } else {
                matches = col.startsWith(config.prefix);
            }

            if (matches && student[col] !== null) {
                allowedColumns.push(col);
                const subLabel = col.replace(/_/g, ' ').toUpperCase();
                tbody.innerHTML += `
                    <tr>
                        <td><input type="checkbox" name="subject" value="${col}"></td>
                        <td>${subLabel}</td>
                        <td>${student[col]}</td>
                    </tr>
                `;
            }
        });

        document.getElementById('student-section').style.display = 'block';
    }

    async function confirmAndSubmit() {
        const selected = Array.from(document.querySelectorAll('input[name="subject"]:checked')).map(cb => cb.value);
        
        if (selected.length === 0) {
            showAlert('পুনঃমূল্যায়নের জন্য নূন্যতম একটি বিষয় নির্বাচন করুন।');
            return;
        }

        if (!confirm('আপনি কি নিশ্চিত যে আবেদনটি জমা দিতে চান? একবার সাবমিট করার পর আর পরিবর্তন করা যাবে না।')) {
            return;
        }

        const appliedSubjectsObj = {};
        selected.forEach(col => {
            appliedSubjectsObj[col] = {
                old_marks: currentStudentData[col],
                status: 'Under Processing'
            };
        });

        const payload = {
            session: currentSession,
            class_name: currentStudentData.class_name,
            section: currentStudentData.section,
            roll_no: currentStudentData.roll_no,
            student_name: currentStudentData.student_name,
            applied_subjects: appliedSubjectsObj,
            overall_status: 'Under Processing'
        };

        const { error } = await supabaseClient.from('scrutiny_applications').insert([payload]);

        if (error) {
            showAlert('আবেদন জমা দেওয়ার সময় সমস্যা হয়েছে: ' + error.message);
        } else {
            showAlert('আপনার পুনঃমূল্যায়নের আবেদন সফলভাবে জমা নেওয়া হয়েছে!', 'success');
            document.getElementById('student-section').style.display = 'none';
            loadAllApplications();
        }
    }

    async function loadAllApplications() {
        const { data, error } = await supabaseClient
            .from('scrutiny_applications')
            .select('*')
            .eq('session', currentSession)
            .order('class_name', { ascending: true })
            .order('roll_no', { ascending: true });

        if (error) return;

        const tbody = document.querySelector('#applications-table tbody');
        tbody.innerHTML = '';

        data.forEach(app => {
            let subjectsFormatted = '';
            Object.keys(app.applied_subjects).forEach(k => {
                const sub = app.applied_subjects[k];
                const badgeClass = sub.status.includes('Verified') ? 'badge-success' : 'badge-pending';
                subjectsFormatted += `<div><strong>${k.toUpperCase()}:</strong> ${sub.old_marks} → <span class="status-badge ${badgeClass}">${sub.status}</span></div>`;
            });

            const overallBadge = app.overall_status === 'Completed' ? 'badge-success' : 'badge-pending';
            const dt = new Date(app.created_at).toLocaleDateString('bn-IN');

            tbody.innerHTML += `
                <tr>
                    <td>${dt}</td>
                    <td>Class ${app.class_name} (${app.section})</td>
                    <td>${app.roll_no}</td>
                    <td>${app.student_name}</td>
                    <td>${subjectsFormatted}</td>
                    <td><span class="status-badge ${overallBadge}">${app.overall_status}</span></td>
                </tr>
            `;
        });
    }
</script>

</body>
</html>
