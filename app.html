
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>PHS Teacher Portal</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="PHS-LOGO.png">
    
    <!-- Supabase & HTML5 QR Scanner CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --primary: #2563eb;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --accent: #10b981;
            --danger: #ef4444;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            background: #1e293b;
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid var(--primary);
        }

        .header img { width: 60px; height: 60px; border-radius: 50%; }
        .header h2 { margin: 5px 0 0 0; font-size: 1.2rem; color: #60a5fa; }

        .container {
            width: 90%;
            max-width: 450px;
            margin-top: 20px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn:hover { background: #1d4ed8; }
        .btn-success { background: var(--accent); }
        .btn-danger { background: var(--danger); }

        #reader { width: 100%; margin-top: 15px; border-radius: 8px; overflow: hidden; }
        
        .status-msg {
            padding: 15px;
            border-radius: 8px;
            background: #334155;
            margin-top: 15px;
            text-align: center;
            line-height: 1.5;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <img src="PHS-LOGO.png" alt="PHS Logo">
        <h2>Pathpukur High School</h2>
        <small>Teacher Marks Entry Portal</small>
    </div>

    <div class="container">
        <!-- ১. রেজিস্ট্রেশন স্ক্রিন -->
        <div id="register-screen" class="hidden">
            <h3>শিক্ষক রেজিস্ট্রেশন</h3>
            <div class="form-group">
                <label>নাম:</label>
                <input type="text" id="reg-name" placeholder="আপনার নাম লিখুন">
            </div>
            <div class="form-group">
                <label>মোবাইল নম্বর:</label>
                <input type="tel" id="reg-phone" placeholder="১০ ডিজিটের নম্বর">
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড:</label>
                <input type="password" id="reg-pass" placeholder="পাসওয়ার্ড তৈরি করুন">
            </div>
            <button class="btn" onclick="registerTeacher()">রেজিস্টার করুন</button>
        </div>

        <!-- ২. পেন্ডিং স্ট্যাটাস মেসেজ -->
        <div id="pending-screen" class="hidden">
            <div class="status-msg">
                ⚠️ <strong>আবেদন প্রক্রিয়াধীন:</strong><br>
                আপনার আবেদনটি জমা হয়েছে। প্রধান শিক্ষক বা সিস্টেম অ্যাডমিন অনুমোদন (Approve) করার পর অ্যাকাউন্টটি চালু হবে।
            </div>
        </div>

        <!-- ৩. মূল ড্যাশবোর্ড (অ্যাপ্রুভড ইউজারদের জন্য) -->
        <div id="dashboard-screen" class="hidden">
            <h3>স্টুডেন্ট মার্কস আপলোড</h3>
            
            <button class="btn btn-success" onclick="startScanner()">📷 QR কোড স্ক্যান করুন</button>
            <div id="reader"></div>

            <div class="form-group" style="margin-top: 15px;">
                <label>স্টুডেন্ট আইডি / রোল (QR থেকে প্রাপ্ত):</label>
                <input type="text" id="student-id" placeholder="স্টুডেন্ট তথ্য">
            </div>

            <div class="form-group">
                <label>প্রাপ্ত নম্বর (Marks):</label>
                <input type="number" id="student-marks" placeholder="নম্বর দিন">
            </div>

            <button class="btn" onclick="uploadMarks()">নম্বর সেভ করুন</button>
            <button class="btn btn-danger" style="margin-top: 20px;" onclick="logout()">লগ আউট</button>
        </div>
    </div>

    <script>
        // Supabase Initialization
        const SUPABASE_URL = "YOUR_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Security Lockdown: অ্যাপ লিঙ্ক সরাসরি ব্রাউজারে খোলা বা কপি-পেস্ট আটকানো
        (function enforceStandaloneApp() {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            if (!isStandalone) {
                // পিসি বা সাধারণ ব্রাউজার থেকে সরাসরি ঢুকলে মূল সাইটে পাঠাবে
                window.location.replace("https://pathpukurschool.github.io/");
            }
        })();

        // Unique Device Token Identifier
        function getDeviceToken() {
            let token = localStorage.getItem("phs_device_token");
            if (!token) {
                token = 'dev-' + Math.random().toString(36).substr(2, 9) + '-' + Date.now();
                localStorage.setItem("phs_device_token", token);
            }
            return token;
        }

        // App Entry Check
        async function checkAppAccess() {
            const phone = localStorage.getItem("phs_teacher_phone");
            const deviceToken = getDeviceToken();

            if (!phone) {
                showScreen("register-screen");
                return;
            }

            const { data, error } = await supabase
                .from('teacher_devices')
                .select('*')
                .eq('phone_number', phone)
                .single();

            if (error || !data) {
                localStorage.clear();
                showScreen("register-screen");
                return;
            }

            // Single Device Validation Check
            if (data.device_token !== deviceToken) {
                alert("আপনার অ্যাকাউন্টটি অন্য একটি ডিভাইসে লগইন করা হয়েছে। এই ডিভাইসটি লগ আউট করা হলো।");
                localStorage.clear();
                showScreen("register-screen");
                return;
            }

            if (data.status === 'pending') {
                showScreen("pending-screen");
            } else if (data.status === 'active') {
                showScreen("dashboard-screen");
            } else {
                alert("আপনার অ্যাকাউন্টটি বাতিল করা হয়েছে।");
                localStorage.clear();
                showScreen("register-screen");
            }
        }

        // Registration Logic
        async function registerTeacher() {
            const name = document.getElementById("reg-name").value;
            const phone = document.getElementById("reg-phone").value;
            const pass = document.getElementById("reg-pass").value;
            const token = getDeviceToken();

            if (!name || !phone || !pass) {
                alert("সব তথ্য সঠিকভাবে পূরণ করুন।");
                return;
            }

            const { data, error } = await supabase
                .from('teacher_devices')
                .upsert([{ 
                    teacher_name: name, 
                    phone_number: phone, 
                    password_hash: pass, 
                    device_token: token,
                    status: 'pending'
                }], { onConflict: 'phone_number' });

            if (error) {
                alert("রেজিস্ট্রেশনে ত্রুটি: " + error.message);
            } else {
                localStorage.setItem("phs_teacher_phone", phone);
                showScreen("pending-screen");
            }
        }

        // QR Code Scanner Integration
        let html5QrcodeScanner;
        function startScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render((decodedText) => {
                document.getElementById("student-id").value = decodedText;
                html5QrcodeScanner.clear();
            });
        }

        // Upload Marks Logic (Offline Capable)
        function uploadMarks() {
            const studentId = document.getElementById("student-id").value;
            const marks = document.getElementById("student-marks").value;

            if (!studentId || !marks) {
                alert("স্টুডেন্ট আইডি ও মার্কস পূরণ করুন।");
                return;
            }

            if (navigator.onLine) {
                // অনলাইন আপলোড লজিক
                alert(`সাফল্যের সাথে আইডি ${studentId} এর জন্য ${marks} নম্বর আপলোড করা হয়েছে।`);
            } else {
                // অফলাইন ক্যাশিং
                let offlineData = JSON.parse(localStorage.getItem("phs_offline_marks") || "[]");
                offlineData.push({ studentId, marks, timestamp: new Date() });
                localStorage.setItem("phs_offline_marks", JSON.stringify(offlineData));
                alert("ইন্টারনেট সংযোগ নেই। মার্কস লোকাল মেমরিতে সেভ করা হলো (অনলাইনে এলে সিঙ্ক হবে)।");
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        function showScreen(id) {
            document.querySelectorAll('.container > div').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        // Register Service Worker for Offline Capabilities
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // Initialize App
        checkAppAccess();
    </script>
</body>
</html>
