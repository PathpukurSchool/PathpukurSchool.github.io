<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ছুটির তালিকা - পাতপুকুর হাই স্কুল (উঃ মাঃ)</title>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * { box-sizing: border-box; font-family: 'Tiro Bangla', serif, Arial, sans-serif; }
    body { background-color: #f4f7f6; margin: 0; padding: 20px; color: #111; }
    .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    
    /* Header */
    .header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; }
    .school-name { font-size: 26px; color: #1a5f7a; margin: 0; font-weight: bold; }
    .page-title { font-size: 20px; color: #333; margin: 5px 0 0 0; }
    
    /* Blinking Notice */
    .notice-box {
      background-color: #fff3cd; color: #856404; padding: 8px 12px; border: 1.5px solid #ffeeba;
      border-left: 5px solid #ffc107; border-radius: 4px; font-size: 14px; margin-bottom: 15px; text-align: center;
      animation: blink 2s infinite;
    }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    /* Filters */
    .filter-section { display: flex; gap: 15px; margin-bottom: 15px; }
    .filter-section input, .filter-section select {
      flex: 1; padding: 8px 12px; font-size: 15px; border: 1.5px solid #555;
      border-radius: 5px; outline: none; background: #fff;
    }
    .filter-section input:focus, .filter-section select:focus { border-color: #1a5f7a; }

    /* Action Bar */
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .total-badge { background: #e3f2fd; color: #0d47a1; padding: 6px 14px; font-weight: bold; border-radius: 15px; font-size: 15px; border: 1px solid #90caf9; }
    .btn-download {
      background-color: #2e7d32; color: white; border: none; padding: 8px 16px; font-size: 15px;
      border-radius: 5px; cursor: pointer; transition: background 0.2s; font-weight: bold;
    }
    .btn-download:hover { background-color: #1b5e20; }

    /* Table with Clear Borders & Interactive Effects */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; border: 2px solid #000; }
    th, td { padding: 8px 10px; text-align: left; border: 1.5px solid #333; font-size: 14px; }
    th { background-color: #1a5f7a; color: white; font-size: 15px; text-align: center; }
    
    /* Hover & Click Effects */
    tbody tr { cursor: pointer; transition: background-color 0.2s ease, transform 0.1s ease; }
    tbody tr:nth-child(even) { background-color: #f9f9f9; }
    tbody tr:hover { background-color: #d0ebff !important; } /* মাউস হোভার এফেক্ট */
    tbody tr.selected-row { background-color: #c8e6c9 !important; font-weight: bold; } /* ক্লিক করা সারির এফেক্ট */
    
    /* A4 Size Print Optimizations */
    @media print {
      @page { size: A4 portrait; margin: 10mm 10mm 10mm 10mm; }
      body { background: white; padding: 0; font-size: 12pt; color: #000; }
      .container { box-shadow: none; padding: 0; max-width: 100%; width: 100%; }
      .filter-section, .btn-download { display: none !important; }
      .notice-box { animation: none; opacity: 1; border: 1px solid #000; background: #fff; color: #000; margin-bottom: 10mm; }
      table { border: 2px solid #000; width: 100%; page-break-inside: auto; }
      tr { page-break-inside: avoid; page-break-after: auto; }
      th, td { border: 1px solid #000 !important; padding: 5px 8px; font-size: 11pt; }
      th { background-color: #eee !important; color: #000 !important; }
      tbody tr:hover { background-color: transparent !important; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1 class="school-name">পাতপুকুর হাই স্কুল (উঃ মাঃ)</h1>
    <h2 class="page-title">ছুটির তালিকা: ২০২৬</h2>
  </div>

  <div class="notice-box">
    📢 <strong>নির্দেশিকা:</strong> বিশেষ প্রয়োজনে অথবা সরকারি নির্দেশিকা অনুযায়ী এই ছুটির তালিকা পরিবর্তন হতে পারে।
  </div>

  <div class="filter-section">
    <input type="text" id="searchInput" placeholder="বাংলায় উপলক্ষ্য খুঁজুন..." onkeyup="filterData()">
    <select id="monthSelect" onchange="filterData()">
      <option value="ALL">সব মাস</option>
      <option value="1">জানুয়ারি</option>
      <option value="2">ফেব্রুয়ারি</option>
      <option value="3">মার্চ</option>
      <option value="4">এপ্রিল</option>
      <option value="5">মে</option>
      <option value="6">জুন</option>
      <option value="7">জুলাই</option>
      <option value="8">আগস্ট</option>
      <option value="9">সেপ্টেম্বর</option>
      <option value="10">অক্টোবর</option>
      <option value="11">নভেম্বর</option>
      <option value="12">ডিসেম্বর</option>
    </select>
  </div>

  <div class="action-bar">
    <div class="total-badge" id="totalDaysBadge">মোট ছুটি: ০ দিন</div>
    <button class="btn-download" onclick="window.print()">🖨️ প্রিন্ট / PDF ডাউনলোড (A4)</button>
  </div>

  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th style="width: 25%;">তারিখ</th>
          <th style="width: 40%;">উপলক্ষ্য</th>
          <th style="width: 15%;">দিন সংখ্যা</th>
          <th style="width: 20%;">মন্তব্য</th>
        </tr>
      </thead>
      <tbody id="holidayTableBody">
        <tr><td colspan="4" style="text-align:center;">ডাটা লোড হচ্ছে...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://bjjwzgzjjcpnndbuelkh.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqand6Z3pqamNwbm5kYnVlbGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTk1NDMsImV4cCI6MjEwMjM5NTU0M30.ICT0pRA2GtlJhxKxo8ghp0x2pVLem1csBkq_hvNVGUs';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let rawHolidays = [];

  function bnToEnNum(str) {
    if (!str) return '0';
    const bn = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    return str.toString().replace(/[০-৯]/g, d => bn.indexOf(d));
  }

  function enToBnNum(str) {
    if (str === null || str === undefined) return '';
    const bn = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    return str.toString().replace(/\d/g, d => bn[d]);
  }

  async function fetchHolidays() {
    const { data, error } = await _supabase
      .from('Holiday')
      .select('*')
      .order('id', { ascending: true });

    if (error) {
      console.error(error);
      document.getElementById('holidayTableBody').innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">ডাটা লোড করতে সমস্যা হয়েছে!</td></tr>';
      return;
    }

    rawHolidays = data;
    renderTable(rawHolidays);
  }

  function renderTable(dataList) {
    const tbody = document.getElementById('holidayTableBody');
    tbody.innerHTML = '';
    
    let totalDays = 0;

    if (dataList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">কোনো ছুটি পাওয়া যায়নি।</td></tr>';
      document.getElementById('totalDaysBadge').innerText = 'মোট ছুটি: ০ দিন';
      return;
    }

    dataList.forEach(item => {
      const numDays = parseInt(bnToEnNum(item.days)) || 0;
      totalDays += numDays;

      const row = document.createElement('tr');
      row.onclick = function() {
        this.classList.toggle('selected-row'); // ক্লিক করলে সিলেক্ট কালার হবে
      };

      row.innerHTML = `
        <td style="text-align:center;">${item.date_val || ''}</td>
        <td><strong>${item.occasion || ''}</strong></td>
        <td style="text-align:center;">${item.days !== null && item.days !== undefined ? item.days : ''}</td>
        <td>${item.remarks || ''}</td>
      `;
      tbody.appendChild(row);
    });

    document.getElementById('totalDaysBadge').innerText = `মোট ছুটি: ${enToBnNum(totalDays)} দিন`;
  }

  function filterData() {
    const searchText = document.getElementById('searchInput').value.toLowerCase();
    const selectedMonth = document.getElementById('monthSelect').value;

    const filtered = rawHolidays.filter(item => {
      const matchesSearch = (item.occasion || '').toLowerCase().includes(searchText) || 
                            (item.remarks || '').toLowerCase().includes(searchText);
      
      let matchesMonth = true;
      if (selectedMonth !== 'ALL' && item.date_val) {
        const dateParts = item.date_val.split('.');
        if (dateParts.length >= 2) {
          const monthNum = parseInt(bnToEnNum(dateParts[1]), 10);
          matchesMonth = (monthNum === parseInt(selectedMonth, 10));
        } else {
          matchesMonth = false;
        }
      }

      return matchesSearch && matchesMonth;
    });

    renderTable(filtered);
  }

  fetchHolidays();
</script>

</body>
</html>
