<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow, noarchive">

   <!-- 🛡️ ১. সিকিউরিটি শিল্ড (লগইন চেক হওয়া পর্যন্ত পেজ সম্পূর্ণ হাইড থাকবে) -->
  <style id="security-shield">
    body { display: none !important; }
  </style>

  <!-- 🛡️ ২. সেশন ও রিফারার ভ্যালিডেশন স্ক্রিপ্ট -->
  <script>
  (function() {
      try {
          var isLoggedIn = sessionStorage.getItem("teacherLoggedIn") === "true";

          var ref = document.referrer;
          var isValidReferrer = false;
          if (ref) {
              var refUrl = new URL(ref);
              // আপনার ডোমেন চেক
              if (refUrl.hostname === "pathpukurschool.github.io" || refUrl.hostname === "localhost") {
                  isValidReferrer = true;
              }
          }

          // সেশন না থাকলে বা অননুমোদিত উপায়ে আসলে হোম পেজে রিডাইরেক্ট
          if (!isLoggedIn) {
              sessionStorage.clear();
              window.location.replace("https://pathpukurschool.github.io/");
              return;
          }

          // ভ্যালিড ইউজার হলে পেজ দৃশ্যমান করা
          document.addEventListener("DOMContentLoaded", function() {
              var shield = document.getElementById("security-shield");
              if (shield) shield.remove();
          });

      } catch (e) {
          sessionStorage.clear();
          window.location.replace("https://pathpukurschool.github.io/");
      }
  })();
  </script>
  
  <!-- পরীক্ষার রুটিন (for Teache) -->
  <title>Pathpukur High School (H.S.) - Exam Routine</title>

  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* =========================================================
       1. BASE & RESET STYLES
       ========================================================= */
    * { box-sizing: border-box; font-family: 'Tiro Bangla', 'Poppins', sans-serif; }
    body { margin: 0; background: #f8fafc; color: #1e293b; }

    /* =========================================================
       2. CONTAINER & LAYOUT
       ========================================================= */
    .container {
      width: min(1200px, calc(100% - 24px));
      margin: 0 auto;
      background: #ffffff;
      border-radius: 0 16px 0 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(26, 95, 122, 0.08);
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: #fff;
      padding: 14px 10px;
      text-align: center;
      margin-bottom: 16px;
    }

    .school-name {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.5px;
      font-weight: 900;
      line-height: 1.2;
    }

    .web-only-title {
      font-size: 13px;
      font-weight: 400;
      color: #93c5fd;
      margin: 4px 0 0 0;
    }

    .sub-heading-badge {
      background: linear-gradient(135deg, #f8fbff, #eef7ff);
      color: #93c5fd;
      padding: 11px 16px;
      border: 1px solid #0f4c81;
      border-left: 5px solid #0f4c81;
      border-radius: 10px;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 18px;
      text-align: center;
      font-weight: 700;
      box-shadow: 0 3px 10px rgba(46, 125, 50, 0.08);
    }

    /* =========================================================
       3. FILTERS & ACTION BUTTONS
       ========================================================= */
    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .filter-section select {
      width: 100%;
      padding: 11px 14px;
      font-size: 15px;
      border: 1.5px solid #1a5f7a;
      border-radius: 9px;
      outline: none;
      background: #fff;
      color: #222;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .filter-section select:hover:not(:disabled) {
      border-color: #0d47a1;
    }

    .filter-section select:focus {
      border-color: #0d47a1;
      box-shadow: 0 0 0 4px rgba(13, 71, 161, 0.12);
    }

    .filter-section select:disabled {
      background-color: #f1f3f5;
      cursor: not-allowed;
      opacity: 0.65;
      border-color: #ccc;
    }

    .action-bar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn-action {
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 3px 8px rgba(0,0,0,0.12);
    }

    .btn-action:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 12px rgba(0,0,0,0.16);
    }

    .btn-action:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-print { background-color: #2e7d32; }
    .btn-batch { background-color: #0288d1; }

    .btn-action:disabled {
      background-color: #b0bec5 !important;
      cursor: not-allowed;
      opacity: 0.7;
      box-shadow: none;
    }

    /* =========================================================
       4. WEB TABLE STYLES
       ========================================================= */
    .table-responsive {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
      border: 1.5px solid #1a5f7a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
    }

    th, td {
      padding: 10px 8px;
      text-align: center;
      border: 1px solid #1a5f7a;
      font-size: 15px;
      vertical-align: middle;
    }

    th {
      background-color: #1a5f7a;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 0.2px;
    }

    tbody tr:nth-child(even) { background-color: #f8fafc; }
    tbody tr:hover { background-color: #eef6fc; }
    tbody tr.selected-row { background-color: #d1e7dd !important; font-weight: bold; }

    /* Web Layout: Subject & Time Wrap */
    .subject-time-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 100%;
    }

    .subject-title {
      display: block;
      font-weight: 800;
      color: #111;
      font-size: 15px;
      line-height: 1.35;
    }

    .exam-time {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #0d47a1;
      background: #e3f2fd;
      padding: 3px 8px;
      border-radius: 5px;
      font-weight: 700;
      border: 1px solid #bbdefb;
      white-space: nowrap;
    }

    #batchPrintContainer { display: none; }

    /* =========================================================
       5. DESKTOP & MOBILE RESPONSIVE
       ========================================================= */
    @media (min-width: 600px) {
      body { padding: 20px; }
      .filter-section { flex-direction: row; align-items: center; }
      .filter-section select { flex: 1; min-width: 0; }
    }

    @media (max-width: 599px) {
      .container {
        width: calc(100% - 12px);
        margin: 6px auto;
        padding: 12px;
        border-radius: 12px;
      }
      .action-bar { flex-direction: column; }
      .btn-action { width: 100%; }
    }

    /* =========================================================
       6. 🖨️ PRINT STYLING (A4 LANDSCAPE FIT)
       ========================================================= */
    @media print {
      @page {
        size: A4 landscape;
        margin: 4mm 6mm;
      }

      html, body {
        background: #fff !important;
        padding: 0 !important;
        margin: 0 !important;
        color: #000 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .container {
        box-shadow: none !important;
        padding: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        border: none !important;
      }

      .filter-section, .action-bar, .web-only-title {
        display: none !important;
      }

      .header {
        margin-bottom: 4px !important;
        padding-bottom: 4px !important;
      }

      .school-name {
        font-size: 26pt !important;
        color: #fff !important;
        font-weight: 900 !important;
      }

      .sub-heading-badge {
        border: 2px solid #000 !important;
        background: #f0f0f0 !important;
        color: #000 !important;
        font-size: 14pt !important;
        margin-bottom: 10px !important;
        padding: 5px 10px !important;
        font-weight: bold !important;
        box-shadow: none !important;
      }

      .table-responsive { border: none !important; overflow: visible !important; }
      table { border: 2px solid #000 !important; width: 100% !important; margin: 0 !important; }
      tr { page-break-inside: avoid !important; }

       
      th, td {
        border: 1.5px solid #000 !important;
        padding: 6px 5px !important;
        line-height: 1.3 !important;
      }

      td { font-weight: 600 !important; }

      th { 
        background-color: #e0e0e0 !important; 
        color: #000 !important; 
        font-size: 15pt !important; 
        font-weight: 900 !important; 
      }

      /* ---------------------------------------------------------
         CASE 1: ALL CLASS PRINT (সমস্ত ক্লাস একসাথে)
         - বিষয় উপরে, টাইম নিচে
         - সাধারণ / কম্প্যাক্ট ফন্ট সাইজ
         --------------------------------------------------------- */
      .all-class-print .subject-time-wrap {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 2px !important;
      }

      .all-class-print .subject-title {
        font-size: 13pt !important;
        font-weight: 800 !important;
        color: #000 !important;
        line-height: 1.2 !important;
      }

      .all-class-print .exam-time {
        font-size: 10.5pt !important;
        color: #000 !important;
        background: transparent !important;
        border: 1px solid #444 !important;
        padding: 1px 5px !important;
        border-radius: 3px !important;
        font-weight: 700 !important;
      }

      .all-class-print th, .all-class-print td {
        font-size: 13pt !important;
      }

      /* ---------------------------------------------------------
         CASE 2: SINGLE CLASS & BATCH PRINT (একক ক্লাস বা ব্যাচ প্রিন্ট)
         - বিষয় ও সময় পাশাপাশি (Horizontal Layout) & Middle Alignment
         - ফন্ট সাইজ বড়
         --------------------------------------------------------- */
      .single-class-print .subject-time-wrap,
      .batch-page .subject-time-wrap {
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 12px !important;
        width: 100% !important;
        text-align: center !important;
      }

      /* বিষয় */
      .single-class-print .subject-title,
      .batch-page .subject-title {
        font-size: 20pt !important;
        line-height: 1.2 !important;
        font-weight: 900 !important;
        color: #000 !important;
        margin: 0 !important;
      }

      /* সময় */
      .single-class-print .exam-time,
      .batch-page .exam-time {
        font-size: 16pt !important;
        line-height: 1.2 !important;
        font-weight: 800 !important;
        color: #000 !important;
        background: transparent !important;
        border: 1.5px solid #000 !important;
        border-radius: 4px !important;
        padding: 2px 8px !important;
        margin: 0 !important;
        white-space: nowrap !important;
      }

      /* টেবিল সেল ও হেডার সাইজ বড় */
      .single-class-print th, .single-class-print td,
      .batch-page th, .batch-page td {
        font-size: 18pt !important;
        padding: 8px 6px !important;
      }

      .single-class-print th, .batch-page th {
        font-size: 20pt !important;
        font-weight: 900 !important;
      }

      /* তারিখ ও বারের জন্য আরও বড় ফন্ট */
      .single-class-print td:first-child, .single-class-print td:nth-child(2),
      .batch-page td:first-child, .batch-page td:nth-child(2) {
        font-size: 20pt !important;
        font-weight: 800 !important;
      }

      /* ---------------------------------------------------------
         MODE CONTROLS & BATCH PAGE BREAKS
         --------------------------------------------------------- */
      .single-print-area { display: block; }
      #batchPrintContainer { display: none; }

      body.batch-print-active .single-print-area { display: none !important; }
      body.batch-print-active #batchPrintContainer { display: block !important; }

      .batch-page { 
        page-break-after: always; 
        page-break-inside: avoid;
        margin: 0;
        padding: 0;
      }

      .batch-page:last-child { 
        page-break-after: avoid !important; 
      }
    }
  </style>
</head>
<body>

<div class="container single-print-area" id="singlePrintArea">
  <!-- Header -->
  <div class="header">
    <div class="school-name">Pathpukur High School (H.S.)</div>
    <div class="web-only-title" id="webPageTitle">Exam Routine</div>
  </div>

  <!-- Dynamic Sub Heading -->
  <div class="sub-heading-badge" id="subHeading">
    অনুগ্রহ করে ড্রপ ডাউন থেকে পরীক্ষা নির্বাচন করুন!
  </div>

  <!-- Filters -->
  <div class="filter-section">
    <select id="examSelect" onchange="onExamChange()">
      <option value="NONE">-- Select Exam --</option>
      <option value="1st Exam">1st Exam</option>
      <option value="2nd Exam">2nd Exam</option>
      <option value="3rd Exam">3rd Exam</option>
      <option value="Test Exam">Test Exam</option>
      <option value="Seme I">Semester I</option>
      <option value="Seme II">Semester II</option>
    </select>

    <select id="classSelect" onchange="applyFilters()" disabled>
      <option value="ALL">-- All Classes --</option>
      <option value="V">Class V</option>
      <option value="VI">Class VI</option>
      <option value="VII">Class VII</option>
      <option value="VIII">Class VIII</option>
      <option value="IX">Class IX</option>
      <option value="X">Class X</option>
      <option value="XI">Class XI</option>
    </select>
  </div>

  <!-- Action Bar -->
  <div class="action-bar">
    <button class="btn-action btn-batch" id="btnBatchPrint" onclick="printBatch()" disabled>
      <i class="fa-solid fa-layer-group"></i> Batch Print — All Classes
    </button>
    <button class="btn-action btn-print" id="btnPrint" onclick="window.print()" disabled>
      <i class="fa-solid fa-print"></i> Print
    </button>
  </div>

  <!-- Table Area -->
  <div class="table-responsive">
    <table id="routineTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody">
        <tr><td colspan="10" style="padding: 25px; color: #666; font-size: 16px;">পরীক্ষা নির্বাচন করার পর এখানে রুটিন দেখা যাবে।</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Container for Batch Printing -->
<div id="batchPrintContainer"></div>

<script>
  const SUPABASE_URL = "https://bjjwzgzjjcpnndbuelkh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqand6Z3pqamNwbm5kYnVlbGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTk1NDMsImV4cCI6MjEwMjM5NTU0M30.ICT0pRA2GtlJhxKxo8ghp0x2pVLem1csBkq_hvNVGUs";

  let allRoutineData = [];

  const classMap = [
    { key: 'class_v', label: 'পঞ্চম', code: 'V' },
    { key: 'class_vi', label: 'ষষ্ঠ', code: 'VI' },
    { key: 'class_vii', label: 'সপ্তম', code: 'VII' },
    { key: 'class_viii', label: 'অষ্টম', code: 'VIII' },
    { key: 'class_ix', label: 'নবম', code: 'IX' },
    { key: 'class_x', label: 'দশম', code: 'X' },
    { key: 'class_xi', label: 'একাদশ', code: 'XI' }
  ];

  async function fetchRoutine() {
    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/exam_routine?select=*`, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        }
      });

      if (!response.ok) throw new Error("Database error");
      allRoutineData = await response.json();
    } catch (err) {
      document.getElementById('tableBody').innerHTML = `
        <tr><td colspan="10" style="color: red; padding: 15px;">ডাটা লোড করতে সমস্যা হচ্ছে! ইন্টারনেট কানেকশন চেক করুন।</td></tr>`;
    }
  }

  function parseDateString(dateStr) {
    if (!dateStr) return new Date(0);
    let cleanStr = dateStr.trim();
    let parts = cleanStr.split(/[\.\-\/]/);
    
    if (parts.length === 3) {
      let p0 = parseInt(parts[0], 10);
      let p1 = parseInt(parts[1], 10) - 1;
      let p2 = parseInt(parts[2], 10);
      
      if (parts[0].length === 4) return new Date(p0, p1, p2);
      if (parts[2].length === 4) return new Date(p2, p1, p0);
      if (parts[2].length === 2) return new Date(2000 + p2, p1, p0);
    }
    
    let d = new Date(dateStr);
    return isNaN(d) ? new Date(0) : d;
  }

  function getBengaliDayName(dateStr) {
    let dt = parseDateString(dateStr);
    if (!dt || isNaN(dt) || dt.getTime() === 0) return '';
    const days = ['রবিবার', 'সোমবার', 'মঙ্গলবার', 'বুধবার', 'বৃহস্পতিবার', 'শুক্রবার', 'শনিবার'];
    return days[dt.getDay()];
  }

  function onExamChange() {
    const selectedExam = document.getElementById('examSelect').value;
    const classSelect = document.getElementById('classSelect');
    const btnPrint = document.getElementById('btnPrint');
    const btnBatchPrint = document.getElementById('btnBatchPrint');

    if (selectedExam === 'NONE') {
      classSelect.disabled = true;
      classSelect.value = 'ALL';
      btnPrint.disabled = true;
      btnBatchPrint.disabled = true;
      document.getElementById('tableHead').innerHTML = '';
      document.getElementById('tableBody').innerHTML = `
        <tr><td colspan="10" style="padding: 25px; color: #666; font-size: 16px;">পরীক্ষা নির্বাচন করার পর এখানে রুটিন দেখা যাবে।</td></tr>`;
      document.getElementById('subHeading').innerText = "অনুগ্রহ করে ড্রপ ডাউন থেকে পরীক্ষা নির্বাচন করুন";
      document.getElementById('webPageTitle').innerText = "Exam Routine";
      return;
    }

    classSelect.disabled = false;
    btnPrint.disabled = false;
    btnBatchPrint.disabled = false;

    applyFilters();
  }

  function applyFilters() {
    const selectedExam = document.getElementById('examSelect').value;
    const selectedClass = document.getElementById('classSelect').value;
    const printArea = document.getElementById('singlePrintArea');

    if (selectedExam === 'NONE') return;

    let filtered = allRoutineData.filter(item => item.exam_name === selectedExam);

    if (selectedClass !== 'ALL') {
      const classKey = 'class_' + selectedClass.toLowerCase();
      filtered = filtered.filter(item => item[classKey] && item[classKey].trim() !== '');
      
      // সিঙ্গল ক্লাসের ক্ষেত্রে প্রিন্ট লেআউট ক্লাস পরিবর্তন
      printArea.classList.remove('all-class-print');
      printArea.classList.add('single-class-print');
    } else {
      // সমস্ত ক্লাসের ক্ষেত্রে প্রিন্ট লেআউট ক্লাস পরিবর্তন
      printArea.classList.remove('single-class-print');
      printArea.classList.add('all-class-print');
    }

    filtered.sort((a, b) => parseDateString(a.exam_date) - parseDateString(b.exam_date));

    let sessionText = (filtered.length > 0 && filtered[0].session) ? filtered[0].session : "";
    let fullExamHeading = `${selectedExam} ${sessionText}`.trim();

    // ওয়েবে সাব-টাইটেল প্রদর্শন
    document.getElementById('webPageTitle').innerText = `${fullExamHeading} - Routine`;

    // সাব-হেডিং ব্যাজ টেক্সট
    let subText = `পরীক্ষা: ${fullExamHeading}`;
    if (selectedClass !== 'ALL') {
      const clsObj = classMap.find(c => c.code === selectedClass);
      subText += ` | শ্রেণি: ${clsObj ? clsObj.label : selectedClass}`;
    } else {
      subText += ` | সমস্ত শ্রেণি`;
    }
    document.getElementById('subHeading').innerText = subText;

    let activeClasses = [];
    if (selectedClass !== 'ALL') {
      activeClasses = classMap.filter(c => c.code === selectedClass);
    } else {
      activeClasses = classMap.filter(c => {
        return filtered.some(row => row[c.key] && row[c.key].trim() !== '');
      });
    }

    renderHeaderAndBody(filtered, activeClasses);
  }

  function formatCellData(cellText) {
    if (!cellText || cellText.trim() === '') return '-';

    let parts = cellText.split('|');
    let subject = parts[0] ? parts[0].trim() : '';
    let time = parts[1] ? parts[1].trim() : '';

    if (time !== '') {
      return `
        <div class="subject-time-wrap">
          <span class="subject-title">${subject}</span>
          <span class="exam-time">
            <i class="fa-regular fa-clock"></i> ${time}
          </span>
        </div>
      `;
    } else {
      return `<div class="subject-time-wrap"><span class="subject-title">${subject}</span></div>`;
    }
  }

  function renderHeaderAndBody(data, activeClasses) {
    const thead = document.getElementById('tableHead');
    const tbody = document.getElementById('tableBody');

    let headHtml = `<tr>
      <th style="width: 18%;">তারিখ</th>
      <th style="width: 15%;">বার</th>`;
    
    let colWidth = Math.floor(67 / activeClasses.length);
    activeClasses.forEach(c => { 
      headHtml += `<th style="width: ${colWidth}%;">${c.label}</th>`; 
    });
    headHtml += `</tr>`;
    thead.innerHTML = headHtml;

    tbody.innerHTML = '';
    if (data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${2 + activeClasses.length}" style="padding: 20px;">এই পরীক্ষার কোনো রুটিন পাওয়া যায়নি।</td></tr>`;
      return;
    }

    data.forEach(item => {
      const row = document.createElement('tr');
      row.onclick = function() {
        document.querySelectorAll('tbody tr').forEach(r => r.classList.remove('selected-row'));
        this.classList.add('selected-row');
      };

      let rowHtml = `
        <td><strong>${item.exam_date || ''}</strong></td>
        <td><strong>${getBengaliDayName(item.exam_date)}</strong></td>
      `;

      activeClasses.forEach(c => {
        rowHtml += `<td>${formatCellData(item[c.key])}</td>`;
      });

      row.innerHTML = rowHtml;
      tbody.appendChild(row);
    });
  }

  // 🖨️ Batch Print Logic
  function printBatch() {
    const selectedExam = document.getElementById('examSelect').value;
    if (selectedExam === 'NONE') return;

    let examData = allRoutineData.filter(item => item.exam_name === selectedExam);
    examData.sort((a, b) => parseDateString(a.exam_date) - parseDateString(b.exam_date));

    let sessionText = (examData.length > 0 && examData[0].session) ? examData[0].session : "";
    let fullExamHeading = `${selectedExam} ${sessionText}`.trim();

    let availableClasses = classMap.filter(c => {
      return examData.some(row => row[c.key] && row[c.key].trim() !== '');
    });

    const batchContainer = document.getElementById('batchPrintContainer');
    batchContainer.innerHTML = '';

    availableClasses.forEach(c => {
      let classRows = examData.filter(row => row[c.key] && row[c.key].trim() !== '');
      
      let pageDiv = document.createElement('div');
      pageDiv.className = 'batch-page';

      let html = `
        <div class="header">
          <div class="school-name">Pathpukur High School (H.S.)</div>
        </div>
        <div class="sub-heading-badge">
          পরীক্ষা: ${fullExamHeading} | শ্রেণি: ${c.label} (${c.code})
        </div>
        <table>
          <thead>
            <tr>
              <th style="width: 20%;">তারিখ</th>
              <th style="width: 16%;">বার</th>
              <th style="width: 64%;">বিষয় ও সময়</th>
            </tr>
          </thead>
          <tbody>
      `;

      classRows.forEach(r => {
        html += `
          <tr>
            <td>${r.exam_date || ''}</td>
            <td>${getBengaliDayName(r.exam_date)}</td>
            <td style="text-align: center; vertical-align: middle;">${formatCellData(r[c.key])}</td>
          </tr>
        `;
      });

      html += `
          </tbody>
        </table>
      `;

      pageDiv.innerHTML = html;
      batchContainer.appendChild(pageDiv);
    });

    document.body.classList.add('batch-print-active');
    window.print();
  }

  // প্রিন্ট সম্পন্ন হওয়ার পর বা বাতিল হওয়ার পর ব্যাচ প্রিন্ট মোড সরিয়ে ফেলা
  window.addEventListener('afterprint', () => {
    document.body.classList.remove('batch-print-active');
  });

  window.onload = fetchRoutine;
</script>

</body>
</html>
