<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow, noarchive">

  <!-- 🛡️ ১. সিকিউরিটি শিল্ড (লগইন চেক হওয়া পর্যন্ত পেজ সম্পূর্ণ হাইড থাকবে) -->
  <style id="security-shield">
    body { display: none !important; }
  </style>

  <!-- 🛡️ ২. সেশন ও রিফারার ভ্যালিডেশন স্ক্রিপ্ট -->
  <script>
  (function() {
      try {
          var isLoggedIn = sessionStorage.getItem("teacherLoggedIn") === "true";

          var ref = document.referrer;
          var isValidReferrer = false;
          if (ref) {
              var refUrl = new URL(ref);
              // আপনার ডোমেন চেক
              if (refUrl.hostname === "pathpukurschool.github.io" || refUrl.hostname === "localhost") {
                  isValidReferrer = true;
              }
          }

          // সেশন না থাকলে বা অননুমোদিত উপায়ে আসলে হোম পেজে রিডাইরেক্ট
          if (!isLoggedIn) {
              sessionStorage.clear();
              window.location.replace("https://pathpukurschool.github.io/");
              return;
          }

          // ভ্যালিড ইউজার হলে পেজ দৃশ্যমান করা
          document.addEventListener("DOMContentLoaded", function() {
              var shield = document.getElementById("security-shield");
              if (shield) shield.remove();
          });

      } catch (e) {
          sessionStorage.clear();
          window.location.replace("https://pathpukurschool.github.io/");
      }
  })();
  </script>

  <!-- মার্কস ফয়েল / নম্বরপত্র শিরোনাম -->
  <title>Pathpukur High School (H.S.)</title>
    
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
      font-family: 'Tiro Bangla', 'Poppins', serif, Arial, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    body { 
      background-color: #f1f5f9; 
      color: #0f172a; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px; 
    }
    
    .container { 
      width: 100%;
      max-width: 650px; 
      background: #ffffff; 
      border-radius: 12px; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); 
      overflow: hidden;
      margin-top: 10px;
      border: 1px solid #e2e8f0;
      padding: 0;
    }
    
    /* Header Structure */
    .header { 
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: #ffffff;
      padding: 20px 15px;
      text-align: center; 
      border-bottom: none;
      margin-bottom: 0;
    }
    .school-name { 
      font-size: 22px; 
      color: #ffffff; 
      margin: 0 0 5px 0; 
      font-weight: 700; 
      letter-spacing: 0.5px;
      line-height: 1.3; 
    }
    .page-title { 
      font-size: 14px; 
      color: #93c5fd; 
      margin: 0; 
      font-weight: 400; 
    }
    
    /* Blinking Notice Box */
    .notice-box {
      background: #f8fafc; 
      color: #334155; 
      padding: 12px 15px; 
      border: none;
      border-left: 4px solid #2563eb; 
      border-radius: 4px; 
      font-size: 13px; 
      margin: 15px 15px 0 15px; 
      text-align: left;
      line-height: 1.6;
      animation: blink 2.5s infinite;
    }
    .notice-box i {
      color: #2563eb;
      margin-right: 5px;
    }
    
    /* Filter Controls */
    .filter-section { 
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 18px;
      margin: 0; 
      background: transparent;
      padding: 15px 20px 0 20px;
      border-radius: 0;
      border: none;
    }
    
    .select-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      width: 100%;
    }

    .select-group label {
      font-weight: 700;
      font-size: 13px;
      color: #475569;
    }

    .select-group select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1.5px solid #cbd5e1;
      font-size: 14px;
      outline: none;
      background-color: #fff;
      font-weight: 500;
      color: #0f172a;
      transition: all 0.2s ease-in-out;
    }

    .select-group select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Action Bar & Sub-heading Status */
    .action-bar { 
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center; 
      margin: 0; 
      padding: 15px 20px 25px 20px;
      gap: 12px; 
    }
    .total-badge { 
      background: #e0f2fe; 
      color: #0369a1; 
      padding: 10px 14px; 
      font-weight: 600; 
      border-radius: 6px; 
      font-size: 13px; 
      border: 1px solid #bae6fd; 
      width: 100%; 
      text-align: center; 
    }
    .btn-download {
      width: 100%;
      background-color: #16a34a; 
      color: white; 
      border: none; 
      padding: 12px; 
      font-size: 15px;
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 700; 
      transition: background 0.2s ease-in-out, transform 0.1s; 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-download:hover {
      background-color: #15803d;
    }
    .btn-download:active { 
      background-color: #15803d; 
      transform: scale(0.99); 
    }

    /* Printable A4 Layout Setup */
    .pages-wrapper {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      padding: 0 15px 20px 15px;
      width: 100%;
    }

    .a4-wrapper {
      background: white;
      width: 210mm;
      height: 297mm;
      padding: 3mm 4mm;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
      overflow: hidden;
      position: relative;
    }

    /* Compact Header on A4 Sheet */
    .foil-header {
      border: 1px solid #000;
      padding: 3px 6px;
      margin-bottom: 4px;
    }

    .foil-meta-grid {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: bold;
      white-space: nowrap;
    }

    /* 3 Column Layout for High Density */
    .columns-container {
      display: flex;
      gap: 4px;
      width: 100%;
    }

    .column-block {
      flex: 1;
      width: 33.33%;
    }

    /* Clear Bordered Table Formatting */
    .marks-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .marks-table th, .marks-table td {
      border: 1.5px solid #111;
      padding: 0px 3px;
      font-size: 9.5px;
      height: 5.1mm;
      line-height: 1;
      vertical-align: middle;
    }

    .marks-table th {
      background-color: #1e3a8a;
      color: white;
      text-align: center;
      font-size: 10px;
      font-weight: bold;
      height: 5.5mm;
    }

    /* Empty Rows styling - Without Borders */
    .marks-table tr.empty-row td {
      border: none !important;
      background: transparent !important;
    }

    .col-roll {
      width: 15%;
      text-align: center;
      font-weight: bold;
    }

    .col-name {
      width: 57%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .col-marks {
      width: 28%;
    }

    /* Hover effect on screen view */
    .marks-table tbody tr:not(.empty-row):hover {
      background-color: #e2f0d9 !important;
      cursor: pointer;
    }

    @media (min-width: 600px) {
      .filter-section {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* Responsive adjustments for screens */
    @media screen and (max-width: 800px) {
      .a4-wrapper {
        width: 100%;
        height: auto;
        padding: 6px;
        overflow-x: auto;
      }
      .columns-container {
        min-width: 650px;
      }
      .school-name { font-size: 18px; }
      .page-title { font-size: 13px; }
      .container { margin-top: 0; }
      body { padding: 8px; }
    }

/* Print Optimization for Pure A4 Paper */
  @media print {
    @page {
      size: A4 portrait;
      margin: 0mm;
    }

    html, body {
      background: white !important;
      padding: 0 !important;
      margin: 0 !important;
      height: auto !important;
      overflow: hidden !important;
      -webkit-print-color-adjust: exact;
    }

    .container {
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      width: 100% !important;
      max-width: 100% !important;
      background: white !important;
      border: none !important;
      border-radius: 0 !important;
    }

    .header, .notice-box, .filter-section, .action-bar {
      display: none !important;
    }

    .pages-wrapper {
      gap: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      display: block !important;
    }

    .a4-wrapper {
      box-shadow: none !important;
      width: 210mm !important;
      height: 297mm !important; /* নির্দিষ্ট ২৯৭ মিমি রাখা হয়েছে */
      max-height: 297mm !important;
      padding: 3mm 4mm !important;
      margin: 0 auto !important;
      page-break-after: always;
      page-break-inside: avoid;
      box-sizing: border-box !important;
      overflow: hidden !important; /* অতিরিক্ত উপাদান বাইরে যাওয়া বন্ধ করবে */
    }

    /* শেষ পেজের পর যাতে নতুন কোনো পেজ ব্রেক না হয় */
    .a4-wrapper:last-child,
    .a4-wrapper:last-of-type {
      page-break-after: avoid !important;
      break-after: avoid !important;
    }

    .columns-container {
      min-width: 100% !important;
    }

    .marks-table th {
      background-color: #eee !important;
      color: #000 !important;
      border: 1px solid #000 !important;
    }

    .marks-table td {
      border: 1px solid #000 !important;
    }

    .marks-table tr.empty-row td {
      border: none !important;
    }
  }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1 class="school-name">Pathpukur High School (H.S.)</h1>
      <h2 class="page-title">Marks Foil / Score Sheet: <span id="headerSessionYear">....</span></h2>
    </div>

    <!-- Notice Box -->
    <div class="notice-box">
      <i class="fa-solid fa-circle-info"></i> অনুগ্রহ করে ক্লাস ও সেকশন নির্বাচন করে মার্কস ফয়েল লোড করুন এবং প্রিন্ট করুন।
    </div>

    <!-- Filter Section -->
    <div class="filter-section">
      <div class="select-group">
        <label for="selectClass"><i class="fa-solid fa-graduation-cap"></i> Class:</label>
        <select id="selectClass" onchange="loadStudents()">
          <option value="">-- Select Class --</option>
          <option value="V">Class V</option>
          <option value="VI">Class VI</option>
          <option value="VII">Class VII</option>
          <option value="VIII">Class VIII</option>
          <option value="IX">Class IX</option>
          <option value="X">Class X</option>
          <option value="XI">Class XI</option>
          <option value="XII">Class XII</option>
        </select>
      </div>

      <div class="select-group">
        <label for="selectSection"><i class="fa-solid fa-layer-group"></i> Section:</label>
        <select id="selectSection" onchange="loadStudents()">
          <option value="">-- All Section --</option>
          <option value="A">Section A</option>
          <option value="B">Section B</option>
          <option value="C">Section C</option>
        </select>
      </div>
    </div>

    <!-- Action Bar -->
    <div class="action-bar">
      <div class="total-badge" id="statusBadge">
        Select Class and Section...
      </div>
      <button class="btn-download" onclick="window.print()">
        <i class="fa-solid fa-print"></i> Print
      </button>
    </div>

    <!-- Printable Pages Wrapper Container -->
    <div id="pagesContainer" class="pages-wrapper"></div>
  </div>

  <script>
    // ⚡ সাব-পেজে অ্যাক্টিভিটি ট্র্যাকিং আপডেট রাখা (যাতে অহেতুক অটো-লগআউট না হয়)
    function updateActivityTime() {
        localStorage.setItem('lastActivityTime', Date.now().toString());
    }
    ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(evt => {
        document.addEventListener(evt, updateActivityTime, { passive: true });
    });

    // Supabase Settings
    const SUPABASE_URL = "https://bjjwzgzjjcpnndbuelkh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqand6Z3pqamNwbm5kYnVlbGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTk1NDMsImV4cCI6MjEwMjM5NTU0M30.ICT0pRA2GtlJhxKxo8ghp0x2pVLem1csBkq_hvNVGUs";

    // Convert student name to Proper/Title Case
    function toTitleCase(str) {
      if (!str) return '';
      return str.toLowerCase().split(' ').map(word => {
        return word.charAt(0).toUpperCase() + word.slice(1);
      }).join(' ');
    }

    async function loadStudents() {
      const cls = document.getElementById('selectClass').value;
      const sec = document.getElementById('selectSection').value;
      const statusBadge = document.getElementById('statusBadge');
      const pagesContainer = document.getElementById('pagesContainer');
      const mainHeaderSession = document.getElementById('headerSessionYear');

      pagesContainer.innerHTML = '';

      if (!cls) {
        statusBadge.innerText = "Select Class and Section...";
        if (mainHeaderSession) mainHeaderSession.innerText = '....';
        return;
      }

      statusBadge.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ডাটা লোড হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন';

      let queryParams = [
        `class_name=eq.${encodeURIComponent(cls)}`,
        `order=roll_no.asc`
      ];

      if (sec) {
        queryParams.push(`section=eq.${encodeURIComponent(sec)}`);
      }

      try {
        const fetchUrl = `${SUPABASE_URL}/rest/v1/current_students?${queryParams.join('&')}`;
        
        const response = await fetch(fetchUrl, {
          method: 'GET',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status}`);
        }

        const students = await response.json();

        if (!students || students.length === 0) {
          statusBadge.innerText = "কোনো ছাত্র-ছাত্রীর রেকর্ড পাওয়া যায়নি!";
          if (mainHeaderSession) mainHeaderSession.innerText = '....';
          return;
        }

        // ১. Supabase থেকে সেশন বের করা
        const currentSession = students[0].session ? students[0].session : new Date().getFullYear();

        // ২. শিরোনামের সেশন আপডেট
        if (mainHeaderSession) {
          mainHeaderSession.innerText = currentSession;
        }

        const secText = sec ? `Section: ${sec}` : 'All Section';
        statusBadge.innerHTML = `Class: ${cls} | ${secText} | Total Student: <b>${students.length}</b>`;

        // Page setup: 50 Rows x 3 Columns = 150 per A4 Page
        const ROWS_PER_COLUMN = 50;
        const STUDENTS_PER_PAGE = ROWS_PER_COLUMN * 3; 

        let totalPages = Math.ceil(students.length / STUDENTS_PER_PAGE);

        // ৩. A4 পেজ রেন্ডারিং
        for (let pageIdx = 0; pageIdx < totalPages; pageIdx++) {
          let pageStudents = students.slice(pageIdx * STUDENTS_PER_PAGE, (pageIdx + 1) * STUDENTS_PER_PAGE);
          renderA4Page(pageStudents, cls, sec);
        }

        // ৪. সেশন বছর আপডেট
        document.querySelectorAll('.a4-session-year').forEach(el => {
          el.innerText = currentSession;
        });

      } catch (err) {
        console.error(err);
        statusBadge.innerText = "ডাটা লোড করতে সমস্যা হয়েছে! ইন্টারনেট সংযোগ পরীক্ষা করুন।";
        if (mainHeaderSession) mainHeaderSession.innerText = '....';
      }
    }

    function renderA4Page(studentList, className, sectionName) {
      const pagesContainer = document.getElementById('pagesContainer');

      const pageElement = document.createElement('div');
      pageElement.className = 'a4-wrapper';

      const headerHTML = `
        <div class="foil-header">
          <div class="foil-meta-grid">
            <div>Pathpukur High School; </div>
            <div><b>Class:</b> ${className}; </div>
            <div><b>Section:</b> ${sectionName || 'All'}; </div>
            <div>.............................. <b>Exam: <span class="a4-session-year">....</span></b>; </div>
            <div><b>Subject:</b> ..............................; </div>
            <div><b>Teacher's Sign:</b> .....................; </div>
          </div>
        </div>
      `;
      
      const col1 = studentList.slice(0, 50);
      const col2 = studentList.slice(50, 100);
      const col3 = studentList.slice(100, 150);

      function generateTableHTML(list) {
        let rows = '';
        
        list.forEach(st => {
          rows += `
            <tr>
              <td class="col-roll">${st.roll_no != null ? st.roll_no : ''}</td>
              <td class="col-name" title="${st.student_name || ''}">${toTitleCase(st.student_name || '')}</td>
              <td class="col-marks"></td>
            </tr>
          `;
        });

        for (let i = list.length; i < 50; i++) {
          rows += `
            <tr class="empty-row">
              <td class="col-roll"></td>
              <td class="col-name"></td>
              <td class="col-marks"></td>
            </tr>
          `;
        }

        return `
          <table class="marks-table">
            <thead>
              <tr>
                <th class="col-roll">Roll</th>
                <th class="col-name">Student Name</th>
                <th class="col-marks">Marks</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
        `;
      }

      const columnsHTML = `
        <div class="columns-container">
          <div class="column-block">${generateTableHTML(col1)}</div>
          <div class="column-block">${generateTableHTML(col2)}</div>
          <div class="column-block">${generateTableHTML(col3)}</div>
        </div>
      `;

      pageElement.innerHTML = headerHTML + columnsHTML;
      pagesContainer.appendChild(pageElement);
    }
  </script>

  <!-- 💡 মূল ওয়েবসাইটের অটো-লগআউট ও শেয়ার্ড লজিক ফাইলের লিঙ্ক -->
  <script src="home.js"></script>
</body>
</html>
