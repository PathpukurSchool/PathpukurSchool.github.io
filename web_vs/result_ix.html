<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathpukur High School (HS) - Class IX Marks Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; font-family: 'Tiro Bangla', 'Poppins', sans-serif; }
    body { margin: 0; background: #f1f5f9; color: #1e293b; }
    
    .header-container { background: #1e3a8a; color: #fff; padding: 12px; text-align: center; }
    .header-container h1 { margin: 0; font-size: 18px; }
    .header-container h2 { margin: 4px 0 0; font-size: 14px; font-weight: 400; color: #93c5fd; }
    
    .controls-panel { background: #fff; padding: 10px; border-bottom: 2px solid #e2e8f0; }
    .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 2px; }
    .form-control { width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; background: #e0f2fe; padding: 8px 12px; font-size: 13px; font-weight: 600; color: #0369a1; }
    .edit-off-badge { color: #dc2626; animation: blink 1.2s infinite; font-weight: bold; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    
    .active-info { background: #fef3c7; color: #92400e; padding: 8px 12px; font-size: 13px; font-weight: bold; border-left: 4px solid #f59e0b; }
    
    /* Responsive Sticky Table Container */
    .table-container { max-height: calc(100vh - 230px); overflow: auto; background: #fff; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; }
    th, td { border-bottom: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; padding: 6px; text-align: center; font-size: 13px; }
    
    /* Sticky Top Header */
    thead th { position: sticky; top: 0; background: #1e293b; color: #fff; z-index: 10; }
    /* Sticky Left Roll Column */
    th.sticky-col, td.sticky-col { position: sticky; left: 0; z-index: 5; background: #334155; color: #fff; font-weight: bold; width: 50px; }
    thead th.sticky-col { z-index: 15; background: #0f172a; }

    .mark-input { width: 60px; text-align: center; padding: 5px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; font-weight: bold; outline: none; }
    .mark-input:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.2); }
    .mark-input[readonly] { background: #f8fafc; color: #64748b; border-color: transparent; }
    
    .save-success { background: #dcfce7 !important; transition: background 0.5s; }
    .save-error { background: #fee2e2 !important; border-color: #ef4444 !important; }
    
    .passkey-bar { display: flex; gap: 8px; align-items: center; background: #fff; padding: 8px; border-top: 1px solid #cbd5e1; }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>Pathpukur High School (HS)</h1>
    <h2>Marks Upload Portal | Session: <span id="sessionDisplay">2026</span> | Class: IX</h2>
  </div>

  <div class="controls-panel">
    <div class="filter-grid">
      <div class="form-group">
        <label>Exam</label>
        <select id="examSelect" class="form-control" onchange="applyFilters()">
          <option value="1st Exam">1st Exam</option>
          <option value="2nd Exam">2nd Exam</option>
          <option value="3rd Exam">3rd Exam</option>
          <option value="Project">Project</option>
        </select>
      </div>
      <div class="form-group">
        <label>Section</label>
        <select id="sectionSelect" class="form-control" onchange="applyFilters()">
          <option value="--All--">--All--</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
        </select>
      </div>
      <div class="form-group">
        <label>Subject</label>
        <select id="subjectSelect" class="form-control" onchange="applyFilters()">
          <option value="Bengali">Bengali</option>
          <option value="English">English</option>
          <option value="Math">Math</option>
          <option value="Physical Science">Physical Science</option>
          <option value="Life Science">Life Science</option>
          <option value="History">History</option>
          <option value="Geography">Geography</option>
        </select>
      </div>
      <div class="form-group">
        <label>Search</label>
        <input type="text" id="searchInput" class="form-control" placeholder="Name or Roll..." oninput="applyFilters()">
      </div>
    </div>
  </div>

  <div class="status-bar">
    <div>Marks Limit: <span id="limitDisplay" style="color:#d97706;">0-40</span></div>
    <div id="securityStatus">
      <!-- Passkey control or Edit Off Badge -->
    </div>
  </div>

  <div class="active-info" id="activeFilterBadge">
    IX - All : 2026 | 1st Exam : Bengali
  </div>

  <div class="table-container">
    <table id="marksTable">
      <thead>
        <tr>
          <th class="sticky-col">Roll</th>
          <th>Sec</th>
          <th>Student Name</th>
          <th id="dynamicSubjectHeader">Bengali</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- Dynamic Rows -->
      </tbody>
    </table>
  </div>

  <script>
    const SUPABASE_URL = "https://bjjwzgzjjcpnndbuelkh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqand6Z3pqamNwbm5kYnVlbGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTk1NDMsImV4cCI6MjEwMjM5NTU0M30.ICT0pRA2GtlJhxKxo8ghp0x2pVLem1csBkq_hvNVGUs";
    
    let rawData = [];
    let currentPasskey = "";
    let isEditAllowed = false;
    let inactivityTimer = null;

    const columnMap = {
      "1st Exam": { "Bengali":"e1_bengali", "English":"e1_english", "Math":"e1_math", "Physical Science":"e1_physical_science", "Life Science":"e1_life_science", "History":"e1_history", "Geography":"e1_geography", limit: 40 },
      "2nd Exam": { "Bengali":"e2_bengali", "English":"e2_english", "Math":"e2_math", "Physical Science":"e2_physical_science", "Life Science":"e2_life_science", "History":"e2_history", "Geography":"e2_geography", limit: 40 },
      "3rd Exam": { "Bengali":"e3_bengali", "English":"e3_english", "Math":"e3_math", "Physical Science":"e3_physical_science", "Life Science":"e3_life_science", "History":"e3_history", "Geography":"e3_geography", limit: 90 },
      "Project":  { "Bengali":"proj_bengali", "English":"proj_english", "Math":"proj_math", "Physical Science":"proj_physical_science", "Life Science":"proj_life_science", "History":"proj_history", "Geography":"proj_geography", limit: 30 }
    };

    window.onload = async () => {
      await checkSecurityStatus();
      await fetchMarksData();
      resetInactivityTimer();
      setupOfflineSync();
    };

    // Activity tracker for 15 mins timeout
    ['mousemove', 'keydown', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, resetInactivityTimer);
    });

    function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      if (currentPasskey) {
        inactivityTimer = setTimeout(() => {
          logoutEditMode("15 মিনিট ইনঅ্যাক্টিভ থাকার কারণে এডিট মুড বন্ধ করা হলো।");
        }, 15 * 60 * 1000); // 15 Minutes
      }
    }

    function logoutEditMode(msg) {
      currentPasskey = "";
      alert(msg);
      renderTable();
    }

    async function checkSecurityStatus() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/page_security?page_name=eq.result_v_ix&select=*`, {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
        });
        const data = await res.json();
        const secDiv = document.getElementById('securityStatus');

        if (data.length > 0 && String(data[0].edit_mode).toLowerCase() === 'true') {
          isEditAllowed = true;
          secDiv.innerHTML = `
            <div class="passkey-bar">
              <input type="password" id="passkeyInput" class="form-control" placeholder="Passkey..." style="width:100px;">
              <button onclick="unlockEdit()" class="form-control" style="background:#2563eb; color:#fff; cursor:pointer;">Unlock</button>
            </div>`;
        } else {
          isEditAllowed = false;
          secDiv.innerHTML = `<span class="edit-off-badge">এডিট মুড অফ</span>`;
        }
      } catch (err) { console.error(err); }
    }

    function unlockEdit() {
      const input = document.getElementById('passkeyInput').value.trim();
      if (!input) return alert("পাসকি লিখুন!");
      currentPasskey = input;
      alert("এডিট মুড সক্রিয় হয়েছে (১৫ মিনিটের জন্য)");
      renderTable();
    }

    async function fetchMarksData() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/result_ix?select=*&order=section.asc,roll_no.asc`, {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
        });
        rawData = await res.json();
        applyFilters();
      } catch (err) { console.error(err); }
    }

    function applyFilters() {
      const exam = document.getElementById('examSelect').value;
      const sec = document.getElementById('sectionSelect').value;
      const sub = document.getElementById('subjectSelect').value;
      const search = document.getElementById('searchInput').value.toLowerCase();

      const limit = columnMap[exam].limit;
      document.getElementById('limitDisplay').textContent = `0-${limit}`;
      document.getElementById('dynamicSubjectHeader').textContent = sub;
      document.getElementById('activeFilterBadge').textContent = `IX - ${sec} : 2026 | ${exam} : ${sub}`;

      let filtered = rawData.filter(item => {
        const matchesSec = (sec === "--All--" || item.section === sec);
        const matchesSearch = item.student_name.toLowerCase().includes(search) || String(item.roll_no).includes(search);
        return matchesSec && matchesSearch;
      });

      renderTable(filtered);
    }

    function renderTable(dataList = rawData) {
      const exam = document.getElementById('examSelect').value;
      const sub = document.getElementById('subjectSelect').value;
      const colName = columnMap[exam][sub];
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      dataList.forEach(row => {
        const val = row[colName] !== null ? row[colName] : '';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="sticky-col">${row.roll_no}</td>
          <td>${row.section}</td>
          <td style="text-align:left;">${row.student_name}</td>
          <td>
            <input type="number" 
                   pattern="[0-9]*"
                   inputmode="numeric"
                   class="mark-input"
                   value="${val}"
                   ${!currentPasskey || !isEditAllowed ? 'readonly' : ''}
                   onfocus="this.select()"
                   onkeydown="handleKeyNavigation(event, this)"
                   onchange="saveMarks(${row.id}, '${colName}', this)"
            />
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function saveMarks(rowId, colName, inputElem) {
      const exam = document.getElementById('examSelect').value;
      const maxLimit = columnMap[exam].limit;
      const val = inputElem.value.trim();

      if (val !== "") {
        const num = Number(val);
        if (!Number.isInteger(num) || num < 0 || num > maxLimit) {
          alert(`ভুল নম্বর! নম্বর ০ থেকে ${maxLimit}-এর মধ্যে পূর্ণসংখ্যা হতে হবে।`);
          inputElem.classList.add('save-error');
          inputElem.value = "";
          setTimeout(() => inputElem.classList.remove('save-error'), 1500);
          return;
        }
      }

      const marksVal = val === "" ? null : parseInt(val);

      if (!navigator.onLine) {
        saveToLocalStorage(rowId, colName, marksVal);
        inputElem.classList.add('save-success');
        return;
      }

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/secure_update_result_ix`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            p_passkey: currentPasskey,
            p_id: rowId,
            p_column_name: colName,
            p_marks: marksVal
          })
        });

        const result = await res.json();
        if (result.success) {
          inputElem.classList.add('save-success');
          setTimeout(() => inputElem.classList.remove('save-success'), 1000);
        } else {
          alert(result.message);
          inputElem.classList.add('save-error');
        }
      } catch (err) {
        saveToLocalStorage(rowId, colName, marksVal);
        inputElem.classList.add('save-success');
      }
    }

    // Keyboard Arrow/Enter navigation
    function handleKeyNavigation(e, elem) {
      const inputs = Array.from(document.querySelectorAll('.mark-input:not([readonly])'));
      const index = inputs.indexOf(elem);

      if (e.key === 'Enter' || e.key === 'ArrowDown') {
        e.preventDefault();
        if (index + 1 < inputs.length) inputs[index + 1].focus();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (index - 1 >= 0) inputs[index - 1].focus();
      }
    }

    function saveToLocalStorage(id, col, val) {
      let draft = JSON.parse(localStorage.getItem('offline_marks_ix') || '[]');
      draft.push({ id, col, val });
      localStorage.setItem('offline_marks_ix', JSON.stringify(draft));
    }

    function setupOfflineSync() {
      window.addEventListener('online', async () => {
        let draft = JSON.parse(localStorage.getItem('offline_marks_ix') || '[]');
        if (draft.length > 0 && currentPasskey) {
          for (let item of draft) {
            await saveMarks(item.id, item.col, { value: item.val, classList: { add:()=>{}, remove:()=>{} } });
          }
          localStorage.removeItem('offline_marks_ix');
          alert("অফলাইন ডাটা সফলভাবে অটো-সিঙ্ক হয়েছে!");
        }
      });
    }
  </script>
</body>
</html>
