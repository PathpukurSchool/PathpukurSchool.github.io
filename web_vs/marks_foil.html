<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>স্কোর শিট / মার্কস ফয়েল - পাতপুকুর হাই স্কুল (উ: মা:)</title>

  <!-- Security Redirect Code -->
  <script>
    (function() {
      var referrer = document.referrer;
      var allowedDomain = "pathpukurschool.github.io";
      if (!referrer || referrer.indexOf(allowedDomain) === -1) {
        window.location.replace("https://pathpukurschool.github.io/");
      }
    })();
  </script>

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { 
      box-sizing: border-box; 
      font-family: 'Tiro Bangla', serif, Arial, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    body { 
      background-color: #f0f4f8; 
      margin: 0; 
      padding: 10px; 
      color: #111; 
    }
    
    .container { 
      max-width: 1000px; 
      margin: 0 auto; 
      background: #fff; 
      padding: 18px; 
      border-radius: 12px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
    }
    
    /* Header Structure */
    .header { 
      text-align: center; 
      border-bottom: 2.5px solid #0056b3; 
      padding-bottom: 10px; 
      margin-bottom: 12px; 
    }
    .school-name { 
      font-size: 23px; 
      color: #0056b3; 
      margin: 0; 
      font-weight: bold; 
      line-height: 1.3; 
    }
    .page-title { 
      font-size: 18px; 
      color: #2C3E50; 
      margin: 4px 0 0 0; 
      font-weight: bold; 
    }
    
    /* Blinking Notice Box */
    .notice-box {
      background-color: #fff8e1; 
      color: #856404; 
      padding: 10px 12px; 
      border: 1.5px solid #ffe082;
      border-left: 5px solid #ffc107; 
      border-radius: 6px; 
      font-size: 13.5px; 
      margin-bottom: 14px; 
      text-align: center;
      animation: blink 2.5s infinite;
    }
    @keyframes blink { 
      0% { opacity: 1; } 
      50% { opacity: 0.55; } 
      100% { opacity: 1; } 
    }

    /* Filter Controls */
    .filter-section { 
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-bottom: 14px; 
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    
    .select-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .select-group label {
      font-weight: bold;
      font-size: 14px;
      color: #1e293b;
    }

    .select-group select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1.5px solid #0056b3;
      font-size: 14px;
      outline: none;
      background-color: #fff;
      font-weight: bold;
      color: #0f172a;
    }

    /* Action Bar & Sub-heading Status */
    .action-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 14px; 
      gap: 10px; 
    }
    .total-badge { 
      background: #e3f2fd; 
      color: #0d47a1; 
      padding: 9px 14px; 
      font-weight: bold; 
      border-radius: 8px; 
      font-size: 14px; 
      border: 1px solid #90caf9; 
      flex: 1; 
      text-align: center; 
    }
    .btn-download {
      background-color: #1b5e20; 
      color: white; 
      border: none; 
      padding: 10px 18px; 
      font-size: 14px;
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: bold; 
      transition: background 0.2s, transform 0.1s; 
      min-width: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-download:active { 
      background-color: #0d3b13; 
      transform: scale(0.98); 
    }

    /* Printable A4 Layout Setup */
    .pages-wrapper {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .a4-wrapper {
      background: white;
      width: 210mm;
      height: 297mm;
      padding: 3mm 4mm;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
      overflow: hidden;
      position: relative;
    }

    /* Compact Header on A4 Sheet */
    .foil-header {
      border: 1px solid #000;
      padding: 3px 6px;
      margin-bottom: 4px;
    }

    .foil-meta-grid {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: bold;
      white-space: nowrap;
    }

    /* 3 Column Layout for High Density */
    .columns-container {
      display: flex;
      gap: 4px;
      width: 100%;
    }

    .column-block {
      flex: 1;
      width: 33.33%;
    }

    /* Clear Bordered Table Formatting */
    .marks-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .marks-table th, .marks-table td {
      border: 1.5px solid #111;
      padding: 0px 3px;
      font-size: 9.5px;
      height: 5.1mm;
      line-height: 1;
      vertical-align: middle;
    }

    .marks-table th {
      background-color: #0056b3;
      color: white;
      text-align: center;
      font-size: 10px;
      font-weight: bold;
      height: 5.5mm;
    }

    /* Empty Rows styling - Without Borders */
    .marks-table tr.empty-row td {
      border: none !important;
      background: transparent !important;
    }

    .col-roll {
      width: 15%;
      text-align: center;
      font-weight: bold;
    }

    .col-name {
      width: 57%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .col-marks {
      width: 28%;
    }

    /* Hover effect on screen view */
    .marks-table tbody tr:not(.empty-row):hover {
      background-color: #e2f0d9 !important;
      cursor: pointer;
    }

    @media (min-width: 600px) {
      body { padding: 20px; }
      .container { padding: 22px; }
      .school-name { font-size: 27px; }
      .page-title { font-size: 21px; }
    }

    /* Responsive adjustments for screens */
    @media screen and (max-width: 800px) {
      .a4-wrapper {
        width: 100%;
        height: auto;
        padding: 6px;
        overflow-x: auto;
      }
      .columns-container {
        min-width: 650px;
      }
    }

    /* Print Optimization for Pure A4 Paper */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0mm;
      }

      body {
        background: white;
        padding: 0;
        margin: 0;
        -webkit-print-color-adjust: exact;
      }

      .container {
        box-shadow: none;
        padding: 0;
        width: 100%;
        max-width: 100%;
        background: white;
      }

      .header, .notice-box, .filter-section, .action-bar {
        display: none !important;
      }

      .pages-wrapper {
        gap: 0;
      }

      .a4-wrapper {
        box-shadow: none;
        width: 210mm;
        height: 297mm;
        padding: 3mm 4mm;
        margin: 0;
        page-break-after: always;
        overflow: hidden;
      }

      .columns-container {
        min-width: 100% !important;
      }

      .marks-table th {
        background-color: #eee !important;
        color: #000 !important;
        border: 1px solid #000 !important;
      }

      .marks-table td {
        border: 1px solid #000 !important;
      }

      /* Printable state - Hide borders on empty rows during print */
      .marks-table tr.empty-row td {
        border: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1 class="school-name">পাতপুকুর হাই স্কুল (উঃ মাঃ)</h1>
      <h2 class="page-title">মার্কস ফয়েল / নম্বরপত্র রেকর্ড</h2>
    </div>

    <!-- Notice Box -->
    <div class="notice-box">
      <i class="fa-solid fa-circle-info"></i> অনুগ্রহ করে শ্রেণী ও সেকশন নির্বাচন করে মার্কস ফয়েল লোড করুন এবং প্রিন্ট বা পিডিএফ সেভ করুন।
    </div>

    <!-- Filter Section -->
    <div class="filter-section">
      <div class="select-group">
        <label for="selectClass">শ্রেণী (Class):</label>
        <select id="selectClass" onchange="loadStudents()">
          <option value="">-- শ্রেণী বেছে নিন --</option>
          <option value="V">Class V</option>
          <option value="VI">Class VI</option>
          <option value="VII">Class VII</option>
          <option value="VIII">Class VIII</option>
          <option value="IX">Class IX</option>
          <option value="X">Class X</option>
          <option value="XI">Class XI</option>
          <option value="XII">Class XII</option>
        </select>
      </div>

      <div class="select-group">
        <label for="selectSection">সেকশন (Section):</label>
        <select id="selectSection" onchange="loadStudents()">
          <option value="">-- সকল সেকশন --</option>
          <option value="A">Section A</option>
          <option value="B">Section B</option>
          <option value="C">Section C</option>
        </select>
      </div>
    </div>

    <!-- Action Bar / Screen Sub-Heading Status -->
    <div class="action-bar">
      <div class="total-badge" id="statusBadge">
        শ্রেণী ও সেকশন নির্বাচন করুন...
      </div>
      <button class="btn-download" onclick="window.print()">
        <i class="fa-solid fa-print"></i> প্রিন্ট করুন
      </button>
    </div>

    <!-- Printable Pages Wrapper Container -->
    <div id="pagesContainer" class="pages-wrapper"></div>
  </div>

  <script>
    // Supabase Settings
    const SUPABASE_URL = "https://bjjwzgzjjcpnndbuelkh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqand6Z3pqamNwbm5kYnVlbGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTk1NDMsImV4cCI6MjEwMjM5NTU0M30.ICT0pRA2GtlJhxKxo8ghp0x2pVLem1csBkq_hvNVGUs";

    // Convert student name to Proper/Title Case
    function toTitleCase(str) {
      if (!str) return '';
      return str.toLowerCase().split(' ').map(word => {
        return word.charAt(0).toUpperCase() + word.slice(1);
      }).join(' ');
    }

    async function loadStudents() {
      const cls = document.getElementById('selectClass').value;
      const sec = document.getElementById('selectSection').value;
      const statusBadge = document.getElementById('statusBadge');
      const pagesContainer = document.getElementById('pagesContainer');

      pagesContainer.innerHTML = '';

      if (!cls) {
        statusBadge.innerText = "শ্রেণী ও সেকশন নির্বাচন করুন...";
        return;
      }

      statusBadge.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ডাটা লোড হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন';

      let queryParams = [
        `class_name=eq.${encodeURIComponent(cls)}`,
        `order=roll_no.asc`
      ];

      if (sec) {
        queryParams.push(`section=eq.${encodeURIComponent(sec)}`);
      }

      try {
        const fetchUrl = `${SUPABASE_URL}/rest/v1/current_students?${queryParams.join('&')}`;
        
        const response = await fetch(fetchUrl, {
          method: 'GET',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status}`);
        }

        const students = await response.json();

        if (!students || students.length === 0) {
          statusBadge.innerText = "কোনো ছাত্র-ছাত্রীর রেকর্ড পাওয়া যায়নি!";
          return;
        }

        // Sub-heading summary for screen display (Class, Section, Total Students)
        const secText = sec ? `সেকশন: ${sec}` : 'সকল সেকশন';
        statusBadge.innerHTML = `শ্রেণী: ${cls} | ${secText} | মোট ছাত্র-ছাত্রী: <b>${students.length}</b> জন`;

        // Page setup: 50 Rows x 3 Columns = 150 per A4 Page
        const ROWS_PER_COLUMN = 50;
        const STUDENTS_PER_PAGE = ROWS_PER_COLUMN * 3; 

        let totalPages = Math.ceil(students.length / STUDENTS_PER_PAGE);

        for (let pageIdx = 0; pageIdx < totalPages; pageIdx++) {
          let pageStudents = students.slice(pageIdx * STUDENTS_PER_PAGE, (pageIdx + 1) * STUDENTS_PER_PAGE);
          renderA4Page(pageStudents, cls, sec);
        }

      } catch (err) {
        console.error(err);
        statusBadge.innerText = "ডাটা লোড করতে সমস্যা হয়েছে! সংযোগ পরীক্ষা করুন।";
      }
    }

    function renderA4Page(studentList, className, sectionName) {
      const pagesContainer = document.getElementById('pagesContainer');

      const pageElement = document.createElement('div');
      pageElement.className = 'a4-wrapper';

      // Header layout for Printable Document
      const headerHTML = `
        <div class="foil-header">
          <div class="foil-meta-grid">
            <div><b>Class:</b> ${className}</div>
            <div><b>Section:</b> ${sectionName || 'All'}</div>
            <div><b>Exam:</b> ..............................</div>
            <div><b>Subject:</b> ..............................</div>
            <div><b>Teacher's Sign:</b> .....................</div>
          </div>
        </div>
      `;

      // Split 150 potential students into 3 columns
      const col1 = studentList.slice(0, 50);
      const col2 = studentList.slice(50, 100);
      const col3 = studentList.slice(100, 150);

      function generateTableHTML(list) {
        let rows = '';
        
        // Render valid student data (English Roll Numbers maintained as in DB)
        list.forEach(st => {
          rows += `
            <tr>
              <td class="col-roll">${st.roll_no != null ? st.roll_no : ''}</td>
              <td class="col-name" title="${st.student_name || ''}">${toTitleCase(st.student_name || '')}</td>
              <td class="col-marks"></td>
            </tr>
          `;
        });

        // Fill remaining rows up to 50 WITHOUT borders (empty-row class applied)
        for (let i = list.length; i < 50; i++) {
          rows += `
            <tr class="empty-row">
              <td class="col-roll"></td>
              <td class="col-name"></td>
              <td class="col-marks"></td>
            </tr>
          `;
        }

        return `
          <table class="marks-table">
            <thead>
              <tr>
                <th class="col-roll">Roll</th>
                <th class="col-name">Student Name</th>
                <th class="col-marks">Marks</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
        `;
      }

      const columnsHTML = `
        <div class="columns-container">
          <div class="column-block">${generateTableHTML(col1)}</div>
          <div class="column-block">${generateTableHTML(col2)}</div>
          <div class="column-block">${generateTableHTML(col3)}</div>
        </div>
      `;

      pageElement.innerHTML = headerHTML + columnsHTML;
      pagesContainer.appendChild(pageElement);
    }
  </script>
</body>
</html>
