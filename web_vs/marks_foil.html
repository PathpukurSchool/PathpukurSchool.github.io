<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function() {
      // ইউজার কোন পেজ থেকে এসেছে তার ইউআরএল (Referrer)
      var referrer = document.referrer;
      
      // মূল ডোমেইন এর নাম
      var allowedDomain = "pathpukurschool.github.io";

      // যদি ইউজার মূল সাইটের কোন লিংক থেকে না আসে (সরাসরি URL Paste করে)
      if (!referrer || referrer.indexOf(allowedDomain) === -1) {
        // সরাসরি মূল সাইটে রিডাইরেক্ট করা হচ্ছে
        window.location.replace("https://pathpukurschool.github.io/");
      }
    })();
  </script>
  <title>স্কোর শিট / মার্কস ফয়েল - পাতপুকুর হাই স্কুল (উ: মা:)</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Tiro Bangla', 'Inter', serif, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      margin: 0;
      padding: 10px;
      color: #0f172a;
    }

    /* Screen UI Control Panel (Mobile Friendly) */
    .control-panel {
      background: #ffffff;
      padding: 12px 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      max-width: 1000px;
      margin: 0 auto 15px auto;
      border: 1px solid #cbd5e1;
    }

    .school-title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #1e3a8a;
      margin-bottom: 2px;
    }

    .page-heading {
      text-align: center;
      font-size: 13px;
      color: #475569;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .filter-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    .select-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .select-group label {
      font-weight: bold;
      font-size: 13px;
    }

    .select-group select {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #94a3b8;
      font-size: 13px;
      outline: none;
      background-color: #f8fafc;
    }

    .btn-print {
      background-color: #16a34a;
      color: white;
      border: none;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Status Bar */
    #statusMsg {
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      margin: 8px 0;
      color: #0284c7;
    }

    /* Printable A4 Container */
    .pages-wrapper {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .a4-wrapper {
      background: white;
      width: 210mm;
      height: 297mm;
      padding: 3mm 4mm;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
      overflow: hidden;
      position: relative;
    }

    /* Ultra Compact Single Line Header */
    .foil-header {
      border: 1px solid #000;
      padding: 2px 5px;
      margin-bottom: 3px;
    }

    .foil-meta-grid {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: bold;
      white-space: nowrap;
    }

    .foil-meta-grid div {
      display: inline-block;
    }

    /* 3 Column Layout Setup */
    .columns-container {
      display: flex;
      gap: 3px;
      width: 100%;
    }

    .column-block {
      flex: 1;
      width: 33.33%;
    }

    /* Table Formatting for High Density (150 Rows) */
    .marks-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .marks-table th, .marks-table td {
      border: 1px solid #000;
      padding: 0px 2px; /* Super tight row padding */
      font-size: 9.5px;
      height: 5.1mm; /* Fixed height for exact 50 rows per column fit */
      line-height: 1;
      vertical-align: middle;
    }

    .marks-table th {
      background-color: #f1f5f9;
      text-align: center;
      font-size: 9.5px;
      font-weight: bold;
      height: 5.5mm;
    }

    .col-roll {
      width: 14%; /* ১৪% করায় রোল নম্বর খুব সুন্দর আটবে */
      text-align: center;
      font-weight: bold;
    }

    .col-name {
      width: 58%; /* Proper Case করার পর ৫৮% নাম দেখার জন্য যথেষ্ট */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .col-marks {
      width: 28%; /* নম্বর ও শিক্ষকের রিমার্ক লেখার জন্য ২৮% জায়গা পাওয়া যাবে */
    }

    /* Responsive Mobile Adjustments for Web View */
    @media screen and (max-width: 768px) {
      .a4-wrapper {
        width: 100%;
        height: auto;
        padding: 5px;
        overflow-x: auto;
      }
      .columns-container {
        min-width: 650px; /* Horizontal scroll on smaller screens */
      }
    }

    /* PRINT OPTIMIZATION (Zero Margin & Max Density) */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0mm; /* Zero Margins */
      }

      body {
        background: white;
        padding: 0;
        margin: 0;
        -webkit-print-color-adjust: exact;
      }

      .control-panel, #statusMsg {
        display: none !important;
      }

      .pages-wrapper {
        gap: 0;
      }

      .a4-wrapper {
        box-shadow: none;
        width: 210mm;
        height: 297mm;
        padding: 3mm 4mm;
        margin: 0;
        page-break-after: always;
        overflow: hidden;
      }

      .columns-container {
        min-width: 100% !important;
      }

      .marks-table th {
        background-color: #e2e8f0 !important;
      }
    }
  </style>
</head>
<body>

  <!-- Screen Control Panel -->
  <div class="control-panel">
    <div class="school-title">Pathpukur High School (H. S.)</div>
    <div class="page-heading">Marks Foil / Score Sheet</div>

    <div class="filter-grid">
      <div class="select-group">
        <label for="selectClass">Class:</label>
        <select id="selectClass" onchange="loadStudents()">
          <option value="">-- Select Class--</option>
          <option value="V">Class V</option>
          <option value="VI">Class VI</option>
          <option value="VII">Class VII</option>
          <option value="VIII">Class VIII</option>
          <option value="IX">Class IX</option>
          <option value="X">Class X</option>
          <option value="XI">Class XI</option>
          <option value="XII">Class XII</option>
        </select>
      </div>

      <div class="select-group">
        <label for="selectSection">Section:</label>
        <select id="selectSection" onchange="loadStudents()">
          <option value="">-- All Section --</option>
          <option value="A">Section A</option>
          <option value="B">Section B</option>
          <option value="C">Section C</option>
        </select>
      </div>

      <button class="btn-print" onclick="window.print()">
        <i class="fa-solid fa-print"></i> Print
      </button>
    </div>
  </div>

  <div id="statusMsg">Please select Class & Section...</div>

  <!-- A4 Printable Area Container -->
  <div id="pagesContainer" class="pages-wrapper"></div>

  <script>
    // Supabase Connection Settings
    const SUPABASE_URL = "https://bjjwzgzjjcpnndbuelkh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqand6Z3pqamNwbm5kYnVlbGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTk1NDMsImV4cCI6MjEwMjM5NTU0M30.ICT0pRA2GtlJhxKxo8ghp0x2pVLem1csBkq_hvNVGUs";

    // Convert English numbers to Bengali numerals
    function toBengaliNumeral(num) {
      if (num === null || num === undefined || num === '') return '';
      const digits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      return num.toString().replace(/\d/g, x => digits[x]);
    }

    // স্টুডেন্টের নাম Proper Case (Title Case) করার ফাংশন
    function toTitleCase(str) {
      if (!str) return '';
      return str.toLowerCase().split(' ').map(word => {
        return word.charAt(0).toUpperCase() + word.slice(1);
      }).join(' ');
    }

    async function loadStudents() {
      const cls = document.getElementById('selectClass').value;
      const sec = document.getElementById('selectSection').value;
      const statusMsg = document.getElementById('statusMsg');
      const pagesContainer = document.getElementById('pagesContainer');

      pagesContainer.innerHTML = '';

      if (!cls) {
        statusMsg.innerText = "Please select a Class!";
        return;
      }

      statusMsg.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Student data loading! Please wait...';

      let queryParams = [
        `class_name=eq.${encodeURIComponent(cls)}`,
        `order=roll_no.asc`
      ];

      if (sec) {
        queryParams.push(`section=eq.${encodeURIComponent(sec)}`);
      }

      try {
        const fetchUrl = `${SUPABASE_URL}/rest/v1/current_students?${queryParams.join('&')}`;
        
        const response = await fetch(fetchUrl, {
          method: 'GET',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status}`);
        }

        const students = await response.json();

        if (!students || students.length === 0) {
          statusMsg.innerText = "No student record found in this Class & Section!";
          return;
        }

        statusMsg.innerText = `Total Student: ${students.length}`;

        // 50 Rows per Column * 3 Columns = 150 Students per A4 Page
        const ROWS_PER_COLUMN = 50;
        const STUDENTS_PER_PAGE = ROWS_PER_COLUMN * 3; 

        let totalPages = Math.ceil(students.length / STUDENTS_PER_PAGE);

        for (let pageIdx = 0; pageIdx < totalPages; pageIdx++) {
          let pageStudents = students.slice(pageIdx * STUDENTS_PER_PAGE, (pageIdx + 1) * STUDENTS_PER_PAGE);
          renderA4Page(pageStudents, cls, sec);
        }

      } catch (err) {
        console.error(err);
        statusMsg.innerText = "Data loading failure! Please check your internet connection!";
      }
    }

    function renderA4Page(studentList, className, sectionName) {
      const pagesContainer = document.getElementById('pagesContainer');

      const pageElement = document.createElement('div');
      pageElement.className = 'a4-wrapper';

      // Requested Ultra Compact Single-Line Header
      const headerHTML = `
        <div class="foil-header">
          <div class="foil-meta-grid">
            <div><b>Class:</b> ${className}</div>
            <div><b>Section:</b> ${sectionName || 'All'}</div>
            <div><b>Exam:</b> ..............................</div>
            <div><b>Subject:</b> ..............................</div>
            <div><b>Teacher's Sign:</b> .....................</div>
          </div>
        </div>
      `;

      // Split 150 students into 3 columns (50 students in each)
      const col1 = studentList.slice(0, 50);
      const col2 = studentList.slice(50, 100);
      const col3 = studentList.slice(100, 150);

      function generateTableHTML(list) {
        let rows = '';
        list.forEach(st => {
          rows += `
            <tr>
              <td class="col-roll">${toBengaliNumeral(st.roll_no)}</td>
              <td class="col-name" title="${st.student_name || ''}">${toTitleCase(st.student_name || '')}</td>
              <td class="col-marks"></td>
            </tr>
          `;
        });

        // Fill empty rows up to 50 if student count is lower
        for (let i = list.length; i < 50; i++) {
          rows += `
            <tr>
              <td class="col-roll">&nbsp;</td>
              <td class="col-name">&nbsp;</td>
              <td class="col-marks">&nbsp;</td>
            </tr>
          `;
        }

        return `
          <table class="marks-table">
            <thead>
              <tr>
                <th class="col-roll">Roll</th>
                <th class="col-name">Student Name</th>
                <th class="col-marks">Marks</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
        `;
      }

      const columnsHTML = `
        <div class="columns-container">
          <div class="column-block">${generateTableHTML(col1)}</div>
          <div class="column-block">${generateTableHTML(col2)}</div>
          <div class="column-block">${generateTableHTML(col3)}</div>
        </div>
      `;

      pageElement.innerHTML = headerHTML + columnsHTML;
      pagesContainer.appendChild(pageElement);
    }
  </script>
</body>
</html>
