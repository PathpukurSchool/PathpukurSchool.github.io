<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--মেন ওয়েব পেজে রি ডাইরেক্ট করার কোড -->
<meta name="robots" content="noindex, nofollow, noarchive">
  <script>
  (function() {
    try {
      var ref = document.referrer;
      if (!ref) {
        window.location.replace("https://pathpukurschool.github.io/");

      var refUrl = new URL(ref);
      // হুবহু ডোমেইন মেলাচ্ছে (সাব-ডোমেইন বাইপাস আটকাতে)

        window.location.replace("https://pathpukurschool.github.io/");

  <title>পাতপুকুর হাই স্কুল (উ: মা:) - নোটিশ প্যানেল</title>

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Tiro Bangla', 'Poppins', serif, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      margin: 0;
      padding: 12px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #334155;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.4);
      border: 1px solid #e2e8f0;
    }

    .school-title {
      text-align: center;
      color: #1e3a8a;
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 4px 0;
    }

    .header {
      text-align: center;
      border-bottom: 2px dashed #3b82f6;
      padding-bottom: 12px;
      margin-bottom: 18px;
    }

    .header h2 {
      margin: 4px 0 0;
      color: #2563eb;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #1e293b;
      font-size: 14px;
    }

    .form-group label span.req {
      color: #ef4444;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
      background: #f8fafc;
    }

    .form-control:focus {
      border-color: #3b82f6;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .form-control[readonly] {
      background-color: #e2e8f0;
      color: #64748b;
      cursor: not-allowed;
    }

    .date-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .date-wrapper input[type="text"] {
      padding-right: 45px;
    }

    .date-picker-btn {
      position: absolute;
      right: 8px;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .native-date-picker {
      position: absolute;
      right: 8px;
      opacity: 0;
      width: 35px;
      height: 35px;
      cursor: pointer;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group {
      flex: 1;
    }

    textarea.form-control {
      resize: vertical;
      min-height: 100px;
    }

    .passkey-group {
      background: #fef2f2;
      border: 1.5px solid #fca5a5;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .passkey-group label {
      color: #991b1b;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .btn {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-submit {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-clear {
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #cbd5e1;
      max-width: 100px;
    }

    .btn-delete {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: white;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
      display: none;
    }

    .draft-banner {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fcd34d;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
      align-items: center;
      justify-content: space-between;
    }

    @media (max-width: 500px) {
      .row {
        flex-direction: column;
        gap: 0;
      }
      .card {
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="school-title">পাতপুকুর হাই স্কুল (উ: মা:)</h1>
    <div class="header">
      <h2><i class="fa-solid fa-bullhorn"></i> নোটিশ আপলোড ও ম্যানেজমেন্ট প্যানেল</h2>
    </div>

    <!-- Local Draft Alert -->
    <div class="draft-banner" id="draftBanner">
      <span><i class="fa-solid fa-floppy-disk"></i> পূর্বে লেখা ড্রাফট লোড করা হয়েছে!</span>
      <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="hideDraftBanner()"></i>
    </div>

    <form id="noticeForm">
      
      <!-- Sl Dropdown & Date -->
      <div class="row">
        <div class="form-group">
          <label for="sl_no">ক্রমিক নং (Sl No) <span class="req">*</span></label>
          <select id="sl_no" class="form-control" style="font-weight: bold; color: #1d4ed8;" onchange="onSlChange()">
            <option value="">লোডিং...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date_val">তারিখ (dd-mm-yyyy) <span class="req">*</span></label>
          <div class="date-wrapper">
            <input type="text" id="date_val" class="form-control" placeholder="dd-mm-yyyy" required>
            <button type="button" class="date-picker-btn"><i class="fa-solid fa-calendar-days"></i></button>
            <input type="date" id="native_date" class="native-date-picker" onchange="syncDateFromPicker(this.value)">
          </div>
        </div>
      </div>

      <!-- Heading -->
      <div class="form-group">
        <label for="heading">নোটিশের বিষয়/শিরোনাম (Heading) <span class="req">*</span></label>
        <input type="text" id="heading" class="form-control" placeholder="এখানে শিরোনাম লিখুন..." required autocomplete="off">
      </div>

      <!-- Notice Body -->
      <div class="form-group">
        <label for="notice_body">বিস্তারিত নোটিশ (Notice Body) <span class="req">*</span></label>
        <textarea id="notice_body" class="form-control" placeholder="এখানে বিস্তারিত বিবরণ লিখুন..." required></textarea>
      </div>

      <!-- Link & Is New -->
      <div class="row">
        <div class="form-group">
          <label for="link">লিঙ্ক (Link - ঐচ্ছিক):</label>
          <input type="url" id="link" class="form-control" placeholder="https://example.com/file.pdf">
        </div>

        <div class="form-group">
          <label for="is_new">নতুন ব্যাজ (Is New):</label>
          <select id="is_new" class="form-control">
            <option value="true">True (নতুন)</option>
            <option value="false">False (পুরাতন)</option>
          </select>
        </div>
      </div>

      <!-- Passkey Field (Placed at the end before Submit) -->
      <div class="form-group passkey-group">
        <label for="passkey"><i class="fa-solid fa-key"></i> সিকিউরিটি পাসকি (Passkey) <span class="req">*</span></label>
        <input type="password" id="passkey" class="form-control" placeholder="Passkey প্রবেশ করান..." required autocomplete="new-password">
      </div>

      <!-- Action Buttons -->
      <div class="btn-group">
        <button type="button" class="btn btn-clear" onclick="clearForm(true)">
          <i class="fa-solid fa-rotate-left"></i> রিফ্রেশ
        </button>
        <button type="button" class="btn btn-delete" id="deleteBtn" onclick="deleteNotice()">
          <i class="fa-solid fa-trash-can"></i> ডিলিট
        </button>
        <button type="submit" class="btn btn-submit" id="submitBtn">
          <i class="fa-solid fa-paper-plane"></i> আপলোড করুন
        </button>
      </div>

    </form>
  </div>

  <script>
    // ----------------------------------------------------
    // Supabase Credentials
    // ----------------------------------------------------
    const SUPABASE_URL = "https://bjjwzgzjjcpnndbuelkh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqand6Z3pqamNwbm5kYnVlbGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTk1NDMsImV4cCI6MjEwMjM5NTU0M30.ICT0pRA2GtlJhxKxo8ghp0x2pVLem1csBkq_hvNVGUs";

    let fetchedNotices = [];
    let maxSlNo = 0;

    // Initialization
    window.onload = function() {
      setDefaultDate();
      loadNoticeDropdown();
      attachAutoSaveEvents();
    };

    // Set Default Today Date (dd-mm-yyyy)
    function setDefaultDate() {
      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();
      document.getElementById('date_val').value = `${dd}-${mm}-${yyyy}`;
    }

    // Convert Date Picker (yyyy-mm-dd) to (dd-mm-yyyy)
    function syncDateFromPicker(val) {
      if(!val) return;
      const parts = val.split('-');
      document.getElementById('date_val').value = `${parts[2]}-${parts[1]}-${parts[0]}`;
      saveDraft();
    }

    // Load Dropdown list from Supabase
    async function loadNoticeDropdown() {
      const slSelect = document.getElementById('sl_no');
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/Notice?select=*&order=sl_no.asc`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        fetchedNotices = await response.json();

        slSelect.innerHTML = '';
        maxSlNo = fetchedNotices.length;
        
        // 1 to N Dropdown
        for (let i = 1; i <= maxSlNo; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = `ক্রমিক নং: ${i} (পুরাতন)`;
          slSelect.appendChild(opt);
        }

        // Add N+1 option for new notice
        const newOpt = document.createElement('option');
        newOpt.value = maxSlNo + 1;
        newOpt.textContent = `ক্রমিক নং: ${maxSlNo + 1} (নতুন নোটিশ)`;
        slSelect.appendChild(newOpt);

        // Default to New Notice Selection
        slSelect.value = maxSlNo + 1;
        onSlChange();

      } catch (err) {
        console.error("Dropdown loading error:", err);
        slSelect.innerHTML = '<option value="1">ক্রমিক নং: 1 (নতুন)</option>';
      }
    }

    // On SL Number Dropdown Selection Change
    function onSlChange() {
      const selectedSl = parseInt(document.getElementById('sl_no').value);
      const deleteBtn = document.getElementById('deleteBtn');
      const submitBtn = document.getElementById('submitBtn');
      const dateInput = document.getElementById('date_val');
      const datePickerBtn = document.querySelector('.date-picker-btn');

      const existingNotice = fetchedNotices.find(n => n.sl_no === selectedSl);

      if (existingNotice) {
        // Old Notice Selected: Load Data into fields
        document.getElementById('heading').value = existingNotice.heading || '';
        document.getElementById('notice_body').value = existingNotice.notice_body || '';
        document.getElementById('link').value = existingNotice.Link || '';
        document.getElementById('is_new').value = existingNotice.is_new ? 'true' : 'false';
        dateInput.value = existingNotice.date_val || '';
        
        // Prevent Date editing for old notices
        dateInput.readOnly = true;
        datePickerBtn.style.display = 'none';

        // UI Controls for Old Notice
        deleteBtn.style.display = 'flex';
        submitBtn.innerHTML = `<i class="fa-solid fa-pen-to-square"></i> আপডেট করুন`;

      } else {
        // New Notice Selected
        dateInput.readOnly = false;
        datePickerBtn.style.display = 'block';
        deleteBtn.style.display = 'none';
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> আপলোড করুন`;

        // Load Draft or reset to default
        loadDraft();
      }
    }

    // Auto Save Events for LocalStorage
    function attachAutoSaveEvents() {
      const fields = ['heading', 'notice_body', 'link', 'is_new', 'date_val'];
      fields.forEach(id => {
        document.getElementById(id).addEventListener('input', saveDraft);
      });
    }

    // Save Draft (Excluding Passkey)
    function saveDraft() {
      const selectedSl = parseInt(document.getElementById('sl_no').value);
      if (selectedSl <= maxSlNo) return; // Don't overwrite draft if editing old notice

      const draftData = {
        heading: document.getElementById('heading').value,
        notice_body: document.getElementById('notice_body').value,
        link: document.getElementById('link').value,
        is_new: document.getElementById('is_new').value,
        date_val: document.getElementById('date_val').value
      };
      localStorage.setItem('notice_draft', JSON.stringify(draftData));
    }

    // Load Draft from LocalStorage
    function loadDraft() {
      const saved = localStorage.getItem('notice_draft');
      if (saved) {
        try {
          const draft = JSON.parse(saved);
          if (draft.heading || draft.notice_body) {
            document.getElementById('heading').value = draft.heading || '';
            document.getElementById('notice_body').value = draft.notice_body || '';
            document.getElementById('link').value = draft.link || '';
            document.getElementById('is_new').value = draft.is_new || 'true';
            if (draft.date_val) document.getElementById('date_val').value = draft.date_val;

            document.getElementById('draftBanner').style.display = 'flex';
          }
        } catch(e) {}
      } else {
        setDefaultDate();
        document.getElementById('heading').value = '';
        document.getElementById('notice_body').value = '';
        document.getElementById('link').value = '';
        document.getElementById('is_new').value = 'true';
      }
    }

    function hideDraftBanner() {
      document.getElementById('draftBanner').style.display = 'none';
    }

    // Reset Form & Clear LocalStorage
    function clearForm(confirmUser = false) {
      if (confirmUser && !confirm("আপনি কি নতুন করে ফর্মটি রিফ্রেশ করতে চান?")) return;
      
      document.getElementById('heading').value = '';
      document.getElementById('notice_body').value = '';
      document.getElementById('link').value = '';
      document.getElementById('is_new').value = 'true';
      document.getElementById('passkey').value = '';
      
      localStorage.removeItem('notice_draft');
      hideDraftBanner();
      loadNoticeDropdown();
    }

    // ----------------------------------------------------
    // Submit / Update Form
    // ----------------------------------------------------
 document.getElementById('noticeForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const selectedSl = parseInt(document.getElementById('sl_no').value);
  const isEditing = selectedSl <= maxSlNo;

  // পুরানো নোটিশ আপডেট করার জন্য কনফার্মেশন (সমস্যা ২ সমাধান)
  if (isEditing) {
    const headingVal = document.getElementById('heading').value;
    const confirmUpdate = confirm(`আপনি কি নিশ্চিত যে ক্রমিক নং ${selectedSl}-এর নোটিশটি আপডেট করতে চান?\n\nশিরোনাম: "${headingVal}"`);
    if (!confirmUpdate) return;
  }

  const passkey = document.getElementById('passkey').value.trim();
  const submitBtn = document.getElementById('submitBtn');
  const originalBtnContent = submitBtn.innerHTML;

  if (!passkey) {
    showBtnError(submitBtn, "⚠️ অনুগ্রহ করে পাসকি (Passkey) প্রদান করুন!", originalBtnContent);
    return;
  }

  // বোতাম প্রসেসিং অবস্থায় নিয়ে যাওয়া
  submitBtn.disabled = true;
  submitBtn.style.background = "linear-gradient(135deg, #2563eb, #1d4ed8)";
  submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> প্রসেসিং হচ্ছে...`;

  try {
    const payload = {
      p_passkey: passkey,
      p_sl_no: selectedSl,
      p_date_val: document.getElementById('date_val').value.trim(),
      p_heading: document.getElementById('heading').value.trim(),
      p_notice_body: document.getElementById('notice_body').value.trim(),
      p_link: document.getElementById('link').value.trim() || null,
      p_is_new: document.getElementById('is_new').value === 'true'
    };

    const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/secure_save_notice`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (result && result.success) {
      alert("🎉 " + result.message);
      clearForm(false);
    } else {
      // ভুল পাসকি বা অন্য কোনো ব্যর্থতায় বোতামে লাল অ্যালার্ট দেখাবে
      showBtnError(submitBtn, "ব্যর্থ হয়েছে!", originalBtnContent);
      alert("❌ " + (result.message || "পাসকি ভুল দেওয়া হয়েছে।"));
    }

  } catch (err) {
    console.error(err);
    showBtnError(submitBtn, "ত্রুটি ঘটেছে!", originalBtnContent);
    alert("❌ সার্ভারের সাথে যোগাযোগ করা যাচ্ছে না!");
  } finally {
    document.getElementById('passkey').value = ''; 
  }
});

// বোতামে লাল অ্যালার্ট দেখানোর হেলপার ফাংশন
function showBtnError(btn, msg, defaultContent) {
  btn.disabled = true;
  btn.style.background = "linear-gradient(135deg, #dc2626, #991b1b)"; // লাল রঙ
  btn.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${msg}`;
  
  setTimeout(() => {
    btn.disabled = false;
    btn.style.background = ""; // আগের কালারে ফেরা
    btn.innerHTML = defaultContent;
  }, 2000);
}

    // ----------------------------------------------------
    // Delete Notice Functionality
    // ----------------------------------------------------
    async function deleteNotice() {
  const selectedSl = parseInt(document.getElementById('sl_no').value);
  const heading = document.getElementById('heading').value;
  const passkey = document.getElementById('passkey').value.trim();
  const deleteBtn = document.getElementById('deleteBtn');
  const originalBtnContent = deleteBtn.innerHTML;

  if (!passkey) {
    showBtnError(deleteBtn, "⚠️ অনুগ্রহ করে পাসকি (Passkey) প্রদান করুন!", originalBtnContent);
    document.getElementById('passkey').focus();
    return;
  }

  // ডিলিট করার পূর্বে কনফার্মেশন
  const isConfirmed = confirm(`⚠️ সতর্কবার্তা!\n\nআপনি কি নিশ্চিত যে ক্রমিক নং ${selectedSl}-এর নোটিশটি চিরতরে ডিলিট করতে চান?\n\nশিরোনাম: "${heading}"`);
  if (!isConfirmed) return;

  deleteBtn.disabled = true;
  deleteBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ডিলিট হচ্ছে...`;

  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/secure_delete_notice`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        p_passkey: passkey,
        p_sl_no: selectedSl
      })
    });

    const result = await response.json();

    if (result && result.success) {
      alert("🗑️ " + result.message);
      clearForm(false);
    } else {
      showBtnError(deleteBtn, "ভুল পাসকি!", originalBtnContent);
      alert("❌ ডিলিট ব্যর্থ হয়েছে: " + (result.message || "পাসকি ভুল দেওয়া হয়েছে।"));
    }

  } catch (err) {
    console.error(err);
    showBtnError(deleteBtn, "ত্রুটি ঘটেছে!", originalBtnContent);
    alert("❌ সার্ভারের সাথে যোগাযোগ ব্যর্থ হয়েছে!");
  } finally {
    document.getElementById('passkey').value = '';
  }
}
        
  </script>
  
</body>
</html>
