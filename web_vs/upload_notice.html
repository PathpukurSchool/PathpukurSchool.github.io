<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function() {
      // ইউজার কোন পেজ থেকে এসেছে তার ইউআরএল (Referrer)
      var referrer = document.referrer;
      
      // মূল ডোমেইন এর নাম
      var allowedDomain = "pathpukurschool.github.io";

      // যদি ইউজার মূল সাইটের কোন লিংক থেকে না আসে (সরাসরি URL Paste করে)
      if (!referrer || referrer.indexOf(allowedDomain) === -1) {
        // সরাসরি মূল সাইটে রিডাইরেক্ট করা হচ্ছে
        window.location.replace("https://pathpukurschool.github.io/");
      }
    })();
  </script>
  <title>পাতপুকুর হাই স্কুল (উঃ মাঃ) - নোটিশ আপলোড প্যানেল</title>

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Tiro Bangla', 'Poppins', serif, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #334155;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 650px;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid #e2e8f0;
    }

    .header {
      text-align: center;
      border-bottom: 2px dashed #3b82f6;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .header h2 {
      margin: 0;
      color: #1e3a8a;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .header p {
      margin: 5px 0 0;
      color: #64748b;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #1e293b;
      font-size: 15px;
    }

    .form-group label span.req {
      color: #ef4444;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
      background: #f8fafc;
    }

    .form-control:focus {
      border-color: #3b82f6;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group {
      flex: 1;
    }

    textarea.form-control {
      resize: vertical;
      min-height: 110px;
    }

    /* Auto Sl No Badge */
    .sl-badge {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1.5px solid #bfdbfe;
      font-weight: 700;
    }

    /* Action Buttons */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-submit {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-submit:hover {
      background: #1e40af;
    }

    .btn-clear {
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #cbd5e1;
      max-width: 120px;
    }

    .btn-clear:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    /* Alert Banner */
    .draft-banner {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fcd34d;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
      display: none;
      align-items: center;
      justify-content: space-between;
    }

    @media (max-width: 500px) {
      .row {
        flex-direction: column;
        gap: 0;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h2><i class="fa-solid fa-bullhorn" style="color: #2563eb;"></i> নোটিশ আপলোড প্যানেল</h2>
      <p>স্কুলের মূল ওয়েবসাইটে নতুন নোটিশ যুক্ত করুন</p>
    </div>

    <!-- Local Draft Status -->
    <div class="draft-banner" id="draftBanner">
      <span><i class="fa-solid fa-floppy-disk"></i> পূর্বে লেখা ড্রাফট লোড করা হয়েছে!</span>
      <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="hideDraftBanner()"></i>
    </div>

    <form id="noticeForm">
      
      <!-- Auto Sl No & Date -->
      <div class="row">
        <div class="form-group">
          <label>ক্রমিক নং (Sl No):</label>
          <input type="text" id="sl_no" class="form-control sl-badge" readonly value="লোডিং...">
        </div>

        <div class="form-group">
          <label for="date_val">তারিখ (Date) <span class="req">*</span></label>
          <input type="text" id="date_val" class="form-control" placeholder="dd-mm-yyyy" required>
        </div>
      </div>

      <!-- Security Login Fields -->
      <div class="row">
        <div class="form-group">
          <label for="admin_id"><i class="fa-solid fa-user-shield" style="color: #2563eb;"></i> সিকিউরিটি আইডি (ID) <span class="req">*</span></label>
          <input type="text" id="admin_id" class="form-control" placeholder="User ID দিন" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="admin_pin"><i class="fa-solid fa-lock" style="color: #dc2626;"></i> পাসওয়ার্ড (Password) <span class="req">*</span></label>
          <input type="password" id="admin_pin" class="form-control" placeholder="পাসওয়ার্ড দিন" required>
        </div>
      </div>

      <!-- Heading -->
      <div class="form-group">
        <label for="heading">নোটিশের বিষয়/শিরোনাম (Heading) <span class="req">*</span></label>
        <input type="text" id="heading" class="form-control" placeholder="এখানে শিরোনাম লিখুন (বাংলা/English)..." required autocomplete="off">
      </div>

      <!-- Notice Body -->
      <div class="form-group">
        <label for="notice_body">বিস্তারিত নোটিশ (Notice Body) <span class="req">*</span></label>
        <textarea id="notice_body" class="form-control" placeholder="এখানে বিস্তারিত বিবরণ লিখুন..." required></textarea>
      </div>

      <!-- Link & Is New -->
      <div class="row">
        <div class="form-group">
          <label for="link">লিঙ্ক (Link - ঐচ্ছিক):</label>
          <input type="url" id="link" class="form-control" placeholder="https://example.com/file.pdf">
        </div>

        <div class="form-group">
          <label for="is_new">নতুন ব্যাজ (Is New):</label>
          <select id="is_new" class="form-control">
            <option value="true">True (নতুন)</option>
            <option value="false">False (পুরাতন)</option>
          </select>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="btn-group">
        <button type="button" class="btn btn-clear" onclick="clearForm(true)">
          <i class="fa-solid fa-rotate-left"></i> রিসেট
        </button>
        <button type="submit" class="btn btn-submit" id="submitBtn">
          <i class="fa-solid fa-paper-plane"></i> আপলোড করুন
        </button>
      </div>

    </form>
  </div>

  <script>
    // ----------------------------------------------------
    // 1. Supabase Configuration
    // ----------------------------------------------------
    const SUPABASE_URL = "https://bjjwzgzjjcpnndbuelkh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqand6Z3pqamNwbm5kYnVlbGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTk1NDMsImV4cCI6MjEwMjM5NTU0M30.ICT0pRA2GtlJhxKxo8ghp0x2pVLem1csBkq_hvNVGUs";
  
    // ----------------------------------------------------
    // 2. Window Load Initialization
    // ----------------------------------------------------
    window.onload = function() {
      setDefaultDate();
      loadDraft();
      fetchNextSlNo();
      attachAutoSaveEvents();
    };

    // আজকের তারিখ dd-mm-yyyy ফরম্যাটে সেট করা
    function setDefaultDate() {
      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();
      document.getElementById('date_val').value = `${dd}-${mm}-${yyyy}`;
    }

    // ----------------------------------------------------
    // 3. Auto Fetch Next Sl No from Supabase
    // ----------------------------------------------------
    async function fetchNextSlNo() {
      const slInput = document.getElementById('sl_no');
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/Notice?select=sl_no&order=sl_no.desc&limit=1`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        const data = await response.json();

        if (data && data.length > 0 && data[0].sl_no !== undefined) {
          slInput.value = parseInt(data[0].sl_no) + 1;
        } else {
          slInput.value = 1; // টেবিল খালি থাকলে ১ থেকে শুরু হবে
        }
      } catch (err) {
        console.error("Sl No fetching error:", err);
        slInput.value = "1";
      }
    }

    // ----------------------------------------------------
    // 4. LocalStorage Draft Management
    // ----------------------------------------------------
    function attachAutoSaveEvents() {
      const fields = ['heading', 'notice_body', 'link', 'is_new', 'date_val'];
      fields.forEach(id => {
        document.getElementById(id).addEventListener('input', saveDraft);
      });
    }

    function saveDraft() {
      const draftData = {
        heading: document.getElementById('heading').value,
        notice_body: document.getElementById('notice_body').value,
        link: document.getElementById('link').value,
        is_new: document.getElementById('is_new').value,
        date_val: document.getElementById('date_val').value
      };
      localStorage.setItem('notice_draft', JSON.stringify(draftData));
    }

    function loadDraft() {
      const saved = localStorage.getItem('notice_draft');
      if (saved) {
        try {
          const draft = JSON.parse(saved);
          if (draft.heading || draft.notice_body) {
            document.getElementById('heading').value = draft.heading || '';
            document.getElementById('notice_body').value = draft.notice_body || '';
            document.getElementById('link').value = draft.link || '';
            document.getElementById('is_new').value = draft.is_new || 'true';
            if(draft.date_val) document.getElementById('date_val').value = draft.date_val;
            
            document.getElementById('draftBanner').style.display = 'flex';
          }
        } catch(e) {}
      }
    }

    function hideDraftBanner() {
      document.getElementById('draftBanner').style.display = 'none';
    }

    function clearForm(confirmUser = false) {
      if (confirmUser && !confirm("আপনি কি নতুন করে ফর্মটি ফাঁকা করতে চান?")) return;
      
      document.getElementById('heading').value = '';
      document.getElementById('notice_body').value = '';
      document.getElementById('link').value = '';
      document.getElementById('is_new').value = 'true';
      document.getElementById('admin_id').value = '';
      document.getElementById('admin_pin').value = '';
      
      localStorage.removeItem('notice_draft');
      hideDraftBanner();
      setDefaultDate();
    }

    // ----------------------------------------------------
    // 5. Secure Submit Form to Supabase
    // ----------------------------------------------------
    document.getElementById('noticeForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const userId = document.getElementById('admin_id').value.trim();
      const userPassword = document.getElementById('admin_pin').value.trim();
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> যাচাই করা হচ্ছে...`;

      try {
        // ১. Supabase RPC Function ডেকে আইডি এবং পাসওয়ার্ড ডাটাবেস লেভেলে চেক করা
        const secResponse = await fetch(`${SUPABASE_URL}/rest/v1/rpc/verify_page_access`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            p_page_name: 'notice_security',
            p_user_id: userId,
            p_password: userPassword
          })
        });

        const isMatch = await secResponse.json();

        // আইডি বা পাসওয়ার্ড না মিললে (False আসলে) আপলোড আটকাবে
        if (!isMatch) {
          alert("❌ ভুল সিকিউরিটি আইডি অথবা পাসওয়ার্ড! সঠিকভাবে পুনরায় চেষ্টা করুন।");
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> আপলোড করুন`;
          return;
        }

        // ২. সিকিউরিটি চেক সফল হলে নোটিশ ডাটা প্রস্তুত ও আপলোড
        submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> আপলোড হচ্ছে...`;

        const payload = {
          sl_no: parseInt(document.getElementById('sl_no').value),
          date_val: document.getElementById('date_val').value.trim(),
          heading: document.getElementById('heading').value.trim(),
          notice_body: document.getElementById('notice_body').value.trim(),
          Link: document.getElementById('link').value.trim() || null,
          is_new: document.getElementById('is_new').value === 'true'
        };

        const response = await fetch(`${SUPABASE_URL}/rest/v1/Notice`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          alert("🎉 নোটিশটি সফলভাবে Supabase-এ আপলোড হয়েছে!");
          clearForm(false);
          fetchNextSlNo();
        } else {
          const errData = await response.json();
          alert("❌ আপলোড ব্যর্থ হয়েছে: " + (errData.message || "Unknown Error"));
        }

      } catch (err) {
        console.error(err);
        alert("❌ সার্ভারের সাথে যোগাযোগ করা যাচ্ছে না!");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> আপলোড করুন`;
      }
    });
  </script>
</body>
</html>
