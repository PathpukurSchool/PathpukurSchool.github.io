<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta name="robots" content="noindex, nofollow, noarchive">

    <!-- 🛡️ ১. কন্টেন্ট সিকিউরিটি শিল্ড (অনুমোদিত না হলে পেজ সম্পূর্ণ অদৃশ্য থাকবে) -->
    <style id="security-shield">
        body { display: none !important; }
    </style>

    <!-- 🛡️ ২. রিফারার ভ্যালিডেশন স্ক্রিপ্ট (লিংক সরাসরি কপি করে খোলা আটকাবে) -->
    <script>
    (function() {
        try {
            var ref = document.referrer;
            var isValidReferrer = false;

            // রিফারার চেক (লিংকটি সরাসরি কপি করে এড্রেসবারে দিয়ে ঢুকছে নাকি মূল পেজ থেকে আসছে)
            if (ref) {
                var refUrl = new URL(ref);
                if (refUrl.hostname === "pathpukurschool.github.io") {
                    isValidReferrer = true;
                }
            }

            // যদি লিংক কপি করে সরাসরি ঢোকার চেষ্টা করা হয় (Referrer না থাকে বা ডোমেইন না মিলে)
            if (!isValidReferrer) {
                // সরাসরি মূল ইনডেক্স পেজে পাঠিয়ে দেবে
                window.location.replace("https://pathpukurschool.github.io/");
                return;
            }

            // মূল পেজ থেকে ক্লিকে এসে থাকলে কন্টেন্ট প্রদর্শন করো
            document.addEventListener("DOMContentLoaded", function() {
                var shield = document.getElementById("security-shield");
                if (shield) shield.remove();
            });

        } catch (e) {
            window.location.replace("https://pathpukurschool.github.io/");
        }
    })();
    </script>
  <!-- একাডেমিক ক্যালেন্ডার -->
 <title>Pathpukur High School (H: S:)</title>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * { box-sizing: border-box; font-family: 'Tiro Bangla', serif, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #f0f4f8; margin: 0; padding: 10px; color: #111; }
    
    .container { 
      max-width: 900px; 
      margin: 0 auto; 
      background: #fff; 
      padding: 18px; 
      border-radius: 12px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
    }
    
    /* Header Structure */
    .header { text-align: center; border-bottom: 2.5px solid #0056b3; padding-bottom: 10px; margin-bottom: 12px; }
    .school-name { font-size: 23px; color: #0056b3; margin: 0; font-weight: bold; line-height: 1.3; }
    .page-title { font-size: 18px; color: #2C3E50; margin: 4px 0 0 0; font-weight: bold; }
    
    /* Blinking Notice Box */
    .notice-box {
      background-color: #fff8e1; color: #856404; padding: 10px 12px; border: 1.5px solid #ffe082;
      border-left: 5px solid #ffc107; border-radius: 6px; font-size: 13.5px; margin-bottom: 14px; text-align: center;
      animation: blink 2.5s infinite;
    }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.55; } 100% { opacity: 1; } }

    /* Filter Input */
    .filter-section { margin-bottom: 14px; }
    .filter-section input {
      width: 100%; padding: 11px 14px; font-size: 15px; border: 1.5px solid #444;
      border-radius: 8px; outline: none; background: #fff; transition: border-color 0.2s;
    }
    .filter-section input:focus { border-color: #0056b3; box-shadow: 0 0 5px rgba(0,86,179,0.3); }

    /* Action Bar */
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
    .total-badge { background: #e3f2fd; color: #0d47a1; padding: 8px 14px; font-weight: bold; border-radius: 8px; font-size: 14px; border: 1px solid #90caf9; flex: 1; text-align: center; }
    .btn-download {
      background-color: #1b5e20; color: white; border: none; padding: 9px 16px; font-size: 14px;
      border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s; min-width: 140px;
    }
    .btn-download:active { background-color: #0d3b13; transform: scale(0.98); }

    /* Clear Bordered Table with Hover & Selection */
    .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; border: 2px solid #111; min-width: 550px; }
    th, td { padding: 9px 8px; text-align: left; border: 1.5px solid #333; font-size: 14px; }
    th { background-color: #0056b3; color: white; font-size: 15px; text-align: center; font-weight: bold; }
    
    /* Interactive Row Hover and Touch Selection */
    tbody tr { cursor: pointer; transition: background-color 0.2s; }
    tbody tr:nth-child(even) { background-color: #f8f9fa; }
    tbody tr:hover { background-color: #e2f0d9 !important; } 
    tbody tr.selected-row { background-color: #c8e6c9 !important; font-weight: bold; }

    @media (min-width: 600px) {
      body { padding: 20px; }
      .container { padding: 22px; }
      .school-name { font-size: 27px; }
      .page-title { font-size: 21px; }
      th, td { padding: 10px 12px; font-size: 15px; }
    }

    /* Print Optimizations for A4 Page */
    @media print {
      @page { size: A4 portrait; margin: 10mm; }
      body { background: white; padding: 0; color: #000; }
      .container { box-shadow: none; padding: 0; width: 100%; max-width: 100%; }
      .filter-section, .btn-download { display: none !important; }
      .notice-box { animation: none; opacity: 1; border: 1px solid #000; background: #fff; color: #000; margin-bottom: 8mm; }
      table { border: 2px solid #000; width: 100%; min-width: 100%; }
      tr { page-break-inside: avoid; }
      th, td { border: 1px solid #000 !important; padding: 6px 8px; font-size: 11pt; }
      th { background-color: #eee !important; color: #000 !important; }
      tbody tr:hover { background-color: transparent !important; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1 class="school-name">পাতপুকুর হাই স্কুল (উঃ মাঃ)</h1>
    <h2 class="page-title" id="pageTitleHeading">Academic Calendar: 2026</h2>
  </div>

  <div class="notice-box">
    <strong>বিশেষ দ্রষ্টব্য:</strong> বিদ্যালয়ের প্রশাসনিক প্রয়োজন অথবা পর্ষদ, সংসদ ও সরকারী নির্দেশিকার পরিমার্জন বা পরিবর্তনের প্রেক্ষিতে এই সময়সূচী পরিবর্তনযোগ্য।
  </div>

  <div class="filter-section">
    <input type="text" id="searchInput" placeholder="🔍 ক্লাস, বিষয় বা তারিখ খুঁজুন..." onkeyup="filterData()">
  </div>

  <div class="action-bar">
    <div class="total-badge" id="totalItemsBadge">মোট এন্ট্রি: ০ টি</div>
    <button class="btn-download" onclick="window.print()">🖨️ প্রিন্ট</button>
  </div>

  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th style="width: 12%;">ক্রমিক নম্বর</th>
          <th style="width: 20%;">ক্লাস</th>
          <th style="width: 38%;">বিষয়</th>
          <th style="width: 30%;">আনুমানিক সময়সীমা</th>
        </tr>
      </thead>
      <tbody id="calendarTableBody">
        <tr><td colspan="4" style="text-align:center;">ডাটা লোড হচ্ছে...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://bjjwzgzjjcpnndbuelkh.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqand6Z3pqamNwbm5kYnVlbGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTk1NDMsImV4cCI6MjEwMjM5NTU0M30.ICT0pRA2GtlJhxKxo8ghp0x2pVLem1csBkq_hvNVGUs';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let rawData = [];

  function enToBnNum(str) {
    if (str === null || str === undefined) return '';
    const bn = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    return str.toString().replace(/\d/g, d => bn[d]);
  }

  // Extract Year dynamically from the first valid date text
  function updateDynamicYear(dataList) {
    if (!dataList || dataList.length === 0) return;
    for (let item of dataList) {
      if (item.date_val) {
        const matches = item.date_val.match(/\d{4}/);
        if (matches) {
          document.getElementById('pageTitleHeading').innerText = `Academic Calendar: ${matches[0]}`;
          break;
        }
      }
    }
  }

  async function fetchCalendarData() {
    const { data, error } = await _supabase
      .from('Academic_Calendar')
      .select('*')
      .order('id', { ascending: true });

    if (error) {
      console.error(error);
      document.getElementById('calendarTableBody').innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">ডাটা লোড করতে সমস্যা হয়েছে!</td></tr>';
      return;
    }

    rawData = data;
    updateDynamicYear(rawData);
    renderTable(rawData);
  }

  function renderTable(dataList) {
    const tbody = document.getElementById('calendarTableBody');
    tbody.innerHTML = '';

    if (dataList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">কোনো তথ্য পাওয়া যায়নি।</td></tr>';
      document.getElementById('totalItemsBadge').innerText = 'মোট এন্ট্রি: ০ টি';
      return;
    }

    dataList.forEach((item, index) => {
      const slNo = enToBnNum(index + 1); // Dynamic Serial Number

      const row = document.createElement('tr');
      row.onclick = function() {
        this.classList.toggle('selected-row');
      };

      row.innerHTML = `
        <td style="text-align:center; font-weight:bold;">${slNo}</td>
        <td style="text-align:center;"><strong>${item.class_name || ''}</strong></td>
        <td>${item.subject || ''}</td>
        <td style="text-align:center;">${item.date_val || ''}</td>
      `;
      tbody.appendChild(row);
    });

    document.getElementById('totalItemsBadge').innerText = `মোট এন্ট্রি: ${enToBnNum(dataList.length)} টি`;
  }

  // Universal Search Filter (Ignores date format mismatches)
  function filterData() {
    const searchText = document.getElementById('searchInput').value.toLowerCase().trim();

    const filtered = rawData.filter(item => {
      const className = (item.class_name || '').toLowerCase();
      const subject = (item.subject || '').toLowerCase();
      const dateVal = (item.date_val || '').toLowerCase();
      
      return className.includes(searchText) || subject.includes(searchText) || dateVal.includes(searchText);
    });

    renderTable(filtered);
  }

  fetchCalendarData();
</script>

</body>
</html>
