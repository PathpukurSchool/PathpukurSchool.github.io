<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>একাডেমিক ক্যালেন্ডার</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Font Awesome & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'Tiro Bangla', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            margin: 0 !important;
            padding: 0 !important;
        }
        html, body {
            height: auto !important;
            min-height: unset !important;
            width: 100%;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<!-- Body ট্যাগের p-1 sm:p-2 সরিয়ে ফেলা হয়েছে -->
<body class="bg-gradient-to-br from-sky-50 to-sky-100 text-slate-800 h-fit overflow-x-hidden">
    
    <!-- main ট্যাগের max-w-4xl ও mx-auto সরিয়ে w-full করা হয়েছে -->
    <main class="w-full space-y-1">

        <!-- Legend Bar -->
        <div class="glass-card rounded-lg p-1.5 shadow-sm flex flex-wrap justify-center gap-2 md:gap-4 text-[10px] sm:text-xs font-bold">
            <div class="flex items-center space-x-1">
                <span class="w-2.5 h-2.5 rounded-full bg-red-500 inline-block"></span>
                <span>রবিবার / ছুটি</span>
            </div>
            <div class="flex items-center space-x-1">
                <span class="w-2.5 h-2.5 rounded-full bg-sky-500 inline-block"></span>
                <span>পরীক্ষার রুটিন</span>
            </div>
            <div class="flex items-center space-x-1">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>
                <span>একাডেমিক ইভেন্ট</span>
            </div>
        </div>

        <!-- Calendar Container -->
        <div class="glass-card rounded-xl shadow-md overflow-hidden border border-sky-100">
            
            <!-- Controls Bar -->
            <div class="bg-slate-800 text-white p-2 flex flex-row justify-between items-center gap-1">
                
                <!-- Left Buttons -->
                <div class="flex items-center space-x-1">
                    <button onclick="changeYear(-1)" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-[10px] sm:text-xs font-semibold transition" title="আগের বছর">
                        <i class="fa-solid fa-angles-left"></i>
                    </button>
                    <button onclick="changeMonth(-1)" class="px-2 py-1 bg-sky-600 hover:bg-sky-500 rounded text-[10px] sm:text-xs font-semibold transition">
                        <i class="fa-solid fa-chevron-left"></i> <span class="hidden sm:inline">আগের মাস</span>
                    </button>
                </div>

                <!-- Calendar Title & Reset Button with Spinner -->
                <div class="text-center flex items-center gap-2">
                    <h2 id="calendarTitle" class="text-xs sm:text-base font-bold text-amber-300">--</h2>
                    <button id="resetBtn" onclick="resetToCurrentMonth()" class="p-1 sm:px-2 sm:py-1 bg-amber-500 hover:bg-amber-600 text-slate-900 rounded text-[10px] font-bold transition shadow-sm flex items-center justify-center min-w-[24px]" title="বর্তমান মাস">
                        <i id="resetIcon" class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>

                <!-- Right Buttons -->
                <div class="flex items-center space-x-1">
                    <button onclick="changeMonth(1)" class="px-2 py-1 bg-sky-600 hover:bg-sky-500 rounded text-[10px] sm:text-xs font-semibold transition">
                        <span class="hidden sm:inline">পরের মাস</span> <i class="fa-solid fa-chevron-right"></i>
                    </button>
                    <button onclick="changeYear(1)" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-[10px] sm:text-xs font-semibold transition" title="পরের বছর">
                        <i class="fa-solid fa-angles-right"></i>
                    </button>
                </div>
            </div>

            <!-- Calendar Days Header -->
            <div class="grid grid-cols-7 bg-slate-100 text-center text-[11px] font-bold border-b border-slate-200">
                <div class="py-1 text-red-600">রবি</div>
                <div class="py-1 text-slate-700">সোম</div>
                <div class="py-1 text-slate-700">মঙ্গল</div>
                <div class="py-1 text-slate-700">বুধ</div>
                <div class="py-1 text-slate-700">বৃহস্পতি</div>
                <div class="py-1 text-slate-700">শুক্র</div>
                <div class="py-1 text-slate-700">শনি</div>
            </div>

            <!-- Calendar Days Grid -->
            <div id="calendarGrid" class="grid grid-cols-7 gap-0.5 p-1 bg-slate-50 min-h-[220px]">
                <!-- Dynamic Days -->
            </div>
        </div>

    </main>

    <!-- Event Modal Details -->
    <div id="eventModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-2 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-3 sm:p-4 shadow-2xl border border-sky-100 relative space-y-2">
            <button onclick="closeModal()" class="absolute top-2 right-3 text-slate-400 hover:text-slate-600 text-lg font-bold">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="flex items-center space-x-2 border-b border-slate-200 pb-2">
                <div id="modalIcon" class="p-2 rounded-full text-white text-base"></div>
                <div>
                    <h3 id="modalTitle" class="text-sm font-bold text-slate-900">ইভেন্ট ডিটেইলস</h3>
                    <p id="modalDate" class="text-[10px] text-slate-500 font-semibold">--</p>
                </div>
            </div>

            <div id="modalBody" class="text-xs text-slate-700 space-y-1.5 max-h-60 overflow-y-auto">
                <!-- Dynamic Content -->
            </div>

            <div class="text-right pt-1">
                <button onclick="closeModal()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-1 rounded-lg text-xs font-bold transition">বন্ধ করুন</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://bjjwzgzjjcpnndbuelkh.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqand6Z3pqamNwbm5kYnVlbGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTk1NDMsImV4cCI6MjEwMjM5NTU0M30.ICT0pRA2GtlJhxKxo8ghp0x2pVLem1csBkq_hvNVGUs";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const bengaliMonths = ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"];

        let currentDate = new Date();
        let eventsData = {}; 

        window.onload = async () => {
            await fetchYearEvents(currentDate.getFullYear());
            renderCalendar();
        };

        // ১. একক তারিখ পার্স করার সময় Timezone Bug এড়ানো
        function parseSingleDate(str) {
            if (!str) return null;
            str = String(str).trim().replace(/\u00A0/g, ' ').replace(/\s+/g, ' ');

            let dmyRegex = /^(\d{1,2})[\.\/-](\d{1,2})[\.\/-](\d{4})$/;
            let matchDMY = str.match(dmyRegex);
            if (matchDMY) {
                let day = parseInt(matchDMY[1], 10);
                let month = parseInt(matchDMY[2], 10);
                let year = parseInt(matchDMY[3], 10);
                return { day, month, year };
            }

            let ymdRegex = /^(\d{4})[\.\/-](\d{1,2})[\.\/-](\d{1,2})$/;
            let matchYMD = str.match(ymdRegex);
            if (matchYMD) {
                let year = parseInt(matchYMD[1], 10);
                let month = parseInt(matchYMD[2], 10);
                let day = parseInt(matchYMD[3], 10);
                return { day, month, year };
            }

            return null;
        }

        // ২. তারিখের রেঞ্জ এবং সিঙ্গেল ডেট থেকে 'YYYY-MM-DD' অ্যারে গঠন
        function parseToDateDetails(dateStr) {
            if (!dateStr) return { dates: [], isFromOnly: false, startDateStr: '' };

            let str = String(dateStr).trim();
            let dates = [];

            let parts = [];
            if (str.includes('থেকে')) parts = str.split('থেকে');
            else if (str.includes(' to ')) parts = str.split(' to ');
            else if (str.includes(' - ')) parts = str.split(' - ');
            else if (str.includes('-')) {
                let splitDash = str.split('-');
                if (splitDash.length === 2 && splitDash[1].trim() !== '') parts = splitDash;
            }

            // কেস ১: "X থেকে" (শেষ তারিখ অনুপস্থিত)
            if (parts.length > 0 && (parts.length === 1 || parts[1].trim() === '')) {
                let startParsed = parseSingleDate(parts[0]);
                if (startParsed) {
                    let y = startParsed.year;
                    let m = startParsed.month.toString().padStart(2, '0');
                    let d = startParsed.day.toString().padStart(2, '0');
                    return { 
                        dates: [`${y}-${m}-${d}`], 
                        isFromOnly: true, 
                        startDateStr: `${d}/${m}/${y}` 
                    };
                }
            }

            // কেস ২: "শুরু থেকে শেষ" তারিখ রেঞ্জ
            if (parts.length === 2 && parts[1].trim() !== '') {
                let startParsed = parseSingleDate(parts[0]);
                let endParsed = parseSingleDate(parts[1]);

                if (startParsed && endParsed) {
                    let current = new Date(startParsed.year, startParsed.month - 1, startParsed.day, 12, 0, 0);
                    let end = new Date(endParsed.year, endParsed.month - 1, endParsed.day, 12, 0, 0);

                    while (current <= end) {
                        let y = current.getFullYear();
                        let m = (current.getMonth() + 1).toString().padStart(2, '0');
                        let d = current.getDate().toString().padStart(2, '0');
                        dates.push(`${y}-${m}-${d}`);
                        current.setDate(current.getDate() + 1);
                    }
                    return { dates, isFromOnly: false, startDateStr: '' };
                }
            }

            // কেস ৩: একক তারিখ
            let single = parseSingleDate(str);
            if (single) {
                let y = single.year;
                let m = single.month.toString().padStart(2, '0');
                let d = single.day.toString().padStart(2, '0');
                dates.push(`${y}-${m}-${d}`);
            }

            return { dates, isFromOnly: false, startDateStr: '' };
        }

        // ৩. ডাটাবেস থেকে ডাটা ফেচিং
        async function fetchYearEvents(targetYear) {
            eventsData = {};

            // ১. Holiday Table Fetch
            const { data: holidays } = await _supabase.from('Holiday').select('*');
            if (holidays) {
                holidays.forEach(h => {
                    let parsed = parseToDateDetails(h.date_val);
                    parsed.dates.forEach(stdDate => {
                        if (stdDate.startsWith(targetYear.toString())) {
                            if (!eventsData[stdDate]) eventsData[stdDate] = [];
                            eventsData[stdDate].push({
                                type: 'holiday',
                                title: h.occasion || 'স্কুল ছুটি',
                                days: h.days || 1,
                                remarks: h.remarks || '',
                                isFromOnly: parsed.isFromOnly,
                                startDateStr: parsed.startDateStr
                            });
                        }
                    });
                });
            }

            // ২. Exam Routine Table Fetch
            const { data: exams } = await _supabase.from('exam_routine').select('*').eq('session', targetYear.toString());
            if (exams) {
                exams.forEach(ex => {
                    let parsed = parseToDateDetails(ex.exam_date);
                    parsed.dates.forEach(stdDate => {
                        if (stdDate) {
                            if (!eventsData[stdDate]) eventsData[stdDate] = [];
                            eventsData[stdDate].push({
                                type: 'exam',
                                exam_name: ex.exam_name,
                                isFromOnly: parsed.isFromOnly,
                                startDateStr: parsed.startDateStr,
                                classes: {
                                    'Class V': ex.class_v,
                                    'Class VI': ex.class_vi,
                                    'Class VII': ex.class_vii,
                                    'Class VIII': ex.class_viii,
                                    'Class IX': ex.class_ix,
                                    'Class X': ex.class_x,
                                    'Class XI': ex.class_xi
                                }
                            });
                        }
                    });
                });
            }

            // ৩. Academic Calendar Table Fetch
            const { data: academic } = await _supabase.from('Academic_Calendar').select('*');
            if (academic) {
                academic.forEach(ac => {
                    let parsed = parseToDateDetails(ac.date_val);
                    parsed.dates.forEach(stdDate => {
                        if (stdDate.startsWith(targetYear.toString())) {
                            if (!eventsData[stdDate]) eventsData[stdDate] = [];
                            eventsData[stdDate].push({
                                type: 'academic',
                                class_name: ac.class_name,
                                subject: ac.subject,
                                isFromOnly: parsed.isFromOnly,
                                startDateStr: parsed.startDateStr
                            });
                        }
                    });
                });
            }
        }

        // ৪. ক্যালেন্ডার রেন্ডারিং (সব নিয়ম ফিল্টারসহ)
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('calendarTitle').innerText = `${bengaliMonths[month]} ${year}`;

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            for (let i = 0; i < firstDayOfMonth; i++) {
                grid.innerHTML += `<div class="p-0.5 bg-transparent"></div>`;
            }

            const today = new Date();
            const todayStr = `${today.getFullYear()}-${(today.getMonth() + 1).toString().padStart(2, '0')}-${today.getDate().toString().padStart(2, '0')}`;

            for (let day = 1; day <= daysInMonth; day++) {
                const dayDate = new Date(year, month, day);
                const dayOfWeek = dayDate.getDay();
                
                const monthStr = (month + 1).toString().padStart(2, '0');
                const dayStr = day.toString().padStart(2, '0');
                const dateKey = `${year}-${monthStr}-${dayStr}`;

                let rawEvents = eventsData[dateKey] || [];

                let isSunday = dayOfWeek === 0;
                let hasHoliday = isSunday || rawEvents.some(e => e.type === 'holiday');

                // নিয়ম ১: রবিবার বা holiday থাকলে পরীক্ষা বা একাডেমিক ইভেন্ট সম্পূর্ণ বাদ দেওয়া হলো
                let filteredEvents = rawEvents;
                if (hasHoliday) {
                    filteredEvents = rawEvents.filter(e => e.type === 'holiday');
                } else {
                    // নিয়ম ৩: একই দিনে পরীক্ষা এবং একাডেমিক ক্যালেন্ডারের ডুপ্লিকেট সামেটিভ এন্ট্রি ফিল্টার করা
                    let hasExam = rawEvents.some(e => e.type === 'exam');
                    if (hasExam) {
                        filteredEvents = rawEvents.filter(e => {
                            if (e.type === 'academic') {
                                let sub = (e.subject || '').toLowerCase();
                                // যদি একাডেমিক ইভেন্টটি পরীক্ষার নাম হয় তবে বাদ যাবে (যেহেতু পরীক্ষার রুটিন আছে)
                                if (sub.includes('পরীক্ষা') || sub.includes('exam') || sub.includes('সামেটিভ')) {
                                    return false;
                                }
                            }
                            return true;
                        });
                    }
                }

                let hasExam = filteredEvents.some(e => e.type === 'exam');
                let hasAcademic = filteredEvents.some(e => e.type === 'academic');

                let bgStyle = "bg-white hover:bg-sky-50";
                let textStyle = "text-slate-800";
                let badgeDots = "";

                if (hasHoliday) {
                    bgStyle = "bg-red-50 hover:bg-red-100 border-red-200";
                    textStyle = "text-red-600 font-extrabold";
                    badgeDots += `<span class="w-1 h-1 rounded-full bg-red-500"></span>`;
                } else {
                    if (hasExam) {
                        bgStyle = "bg-sky-50 hover:bg-sky-100 border-sky-200";
                        textStyle = "text-sky-800 font-bold";
                        badgeDots += `<span class="w-1 h-1 rounded-full bg-sky-500"></span>`;
                    }
                    if (hasAcademic) {
                        if (!hasExam) {
                            bgStyle = "bg-emerald-50 hover:bg-emerald-100 border-emerald-200";
                            textStyle = "text-emerald-800 font-bold";
                        }
                        badgeDots += `<span class="w-1 h-1 rounded-full bg-emerald-500"></span>`;
                    }
                }

                const isToday = dateKey === todayStr ? 'ring-2 ring-amber-500 font-extrabold bg-amber-50' : '';

                const dayCard = document.createElement('div');
                dayCard.className = `p-1 h-9 sm:h-10 border rounded-lg flex flex-col justify-between cursor-pointer transition-all ${bgStyle} ${isToday}`;
                dayCard.onclick = () => showEventDetails(dateKey, isSunday, filteredEvents);

                dayCard.innerHTML = `
                    <div class="text-[11px] leading-none ${textStyle}">${day}</div>
                    <div class="flex space-x-0.5 justify-end">${badgeDots}</div>
                `;

                grid.appendChild(dayCard);
            }
        }

        async function changeMonth(offset) {
            const oldYear = currentDate.getFullYear();
            currentDate.setMonth(currentDate.getMonth() + offset);
            const newYear = currentDate.getFullYear();

            if (oldYear !== newYear) {
                await fetchYearEvents(newYear);
            }
            renderCalendar();
        }

        async function changeYear(offset) {
            currentDate.setFullYear(currentDate.getFullYear() + offset);
            await fetchYearEvents(currentDate.getFullYear());
            renderCalendar();
        }

        async function resetToCurrentMonth() {
            const btn = document.getElementById('resetBtn');
            const icon = document.getElementById('resetIcon');

            btn.disabled = true;
            icon.className = "fa-solid fa-spinner fa-spin";

            try {
                const oldYear = currentDate.getFullYear();
                currentDate = new Date();
                const newYear = currentDate.getFullYear();

                if (oldYear !== newYear || Object.keys(eventsData).length === 0) {
                    await fetchYearEvents(newYear);
                }
                renderCalendar();
            } finally {
                icon.className = "fa-solid fa-rotate-right";
                btn.disabled = false;
            }
        }

        // ৫. পপ-আপ মেসেজ প্রদর্শন ফাংশন
        function showEventDetails(dateKey, isSunday, events) {
            const modal = document.getElementById('eventModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalDate = document.getElementById('modalDate');
            const modalIcon = document.getElementById('modalIcon');
            const modalBody = document.getElementById('modalBody');

            modalDate.innerText = `তারিখ: ${dateKey}`;
            modalBody.innerHTML = '';

            // ক. রবিবার ছুটি
            if (isSunday) {
                modalTitle.innerText = "সাপ্তাহিক ছুটি (রবিবার)";
                modalIcon.className = "p-2 rounded-full bg-red-500 text-white";
                modalIcon.innerHTML = `<i class="fa-solid fa-umbrella-beach"></i>`;
                modalBody.innerHTML = `<p class="text-red-600 font-medium bg-red-50 p-2 rounded border border-red-100"><i class="fa-solid fa-circle-info mr-1"></i> রবিবার থাকার কারণে বিদ্যালয় বন্ধ থাকবে।</p>`;
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                return;
            }

            // খ. ছুটির তালিকা অনুযায়ী ছুটি
            let hasHoliday = events.some(e => e.type === 'holiday');
            if (hasHoliday) {
                modalTitle.innerText = "স্কুল বন্ধ (ছুটি)";
                modalIcon.className = "p-2 rounded-full bg-red-500 text-white";
                modalIcon.innerHTML = `<i class="fa-solid fa-gift"></i>`;

                events.filter(e => e.type === 'holiday').forEach(ev => {
                    let fromTextHtml = ev.isFromOnly 
                        ? `<div class="text-[11px] text-amber-700 font-bold bg-amber-100 p-1 rounded my-1"><i class="fa-solid fa-clock mr-1"></i> ${ev.startDateStr || dateKey} তারিখ থেকে শুরু</div>` 
                        : '';

                    modalBody.innerHTML += `
                        <div class="p-2 bg-red-50 border-l-4 border-red-500 rounded-r space-y-0.5">
                            <div class="font-bold text-red-800 text-xs"><i class="fa-solid fa-umbrella-beach mr-1"></i> ছুটির উপলক্ষ: ${ev.title}</div>
                            <div class="text-[11px] text-red-600">ছুটির সময়কাল: ${ev.days} দিন</div>
                            ${ev.remarks ? `<div class="text-[11px] text-slate-600">মন্তব্য: ${ev.remarks}</div>` : ''}
                            ${fromTextHtml}
                        </div>
                    `;
                });

                modal.classList.remove('hidden');
                modal.classList.add('flex');
                return;
            }

            // গ. কোনো ইভেন্ট না থাকলে (সাধারণ কার্যদিবস - কোনো বাড়তি মেসেজ ছাড়া)
            if (events.length === 0) {
                modalTitle.innerText = "কোনো বিশেষ সূচী নেই";
                modalIcon.className = "p-2 rounded-full bg-slate-600 text-white";
                modalIcon.innerHTML = `<i class="fa-solid fa-calendar-day"></i>`;
                modalBody.innerHTML = `<p class="text-slate-500 text-center py-2 font-medium">আজকের দিনে নির্দিষ্ট কোনো ছুটির সূচী বা পরীক্ষার রুটিন নেই।</p>`;
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                return;
            }

            // ঘ. পরীক্ষার রুটিন এবং অন্যান্য একাডেমিক ইভেন্ট প্রদর্শন
            modalTitle.innerText = "নির্ধারিত সূচী ও ইভেন্ট";
            modalIcon.className = "p-2 rounded-full bg-indigo-600 text-white";
            modalIcon.innerHTML = `<i class="fa-solid fa-bell"></i>`;

            events.forEach(ev => {
                if (ev.type === 'exam') {
                    let classListHtml = '';
                    Object.entries(ev.classes).forEach(([cls, sub]) => {
                        if (sub) {
                            classListHtml += `<li class="text-[11px]"><strong>${cls}:</strong> ${sub}</li>`;
                        }
                    });

                    let fromTextHtml = ev.isFromOnly 
                        ? `<div class="text-[11px] text-amber-700 font-bold bg-amber-100 p-1 rounded my-1"><i class="fa-solid fa-clock mr-1"></i> ${ev.startDateStr || dateKey} তারিখ থেকে শুরু</div>` 
                        : '';

                    modalBody.innerHTML += `
                        <div class="p-2 bg-sky-50 border-l-4 border-sky-500 rounded-r space-y-1">
                            <div class="font-bold text-sky-900 text-xs"><i class="fa-solid fa-file-pen mr-1"></i> ${ev.exam_name || 'পরীক্ষার রুটিন'}</div>
                            <ul class="space-y-0.5 bg-white p-1.5 rounded border border-sky-100">${classListHtml}</ul>
                            ${fromTextHtml}
                        </div>
                    `;
                } else if (ev.type === 'academic') {
                    let fromTextHtml = ev.isFromOnly 
                        ? `<div class="text-[11px] text-amber-700 font-bold bg-amber-100 p-1 rounded my-1"><i class="fa-solid fa-clock mr-1"></i> ${ev.startDateStr || dateKey} তারিখ থেকে শুরু</div>` 
                        : '';

                    modalBody.innerHTML += `
                        <div class="p-2 bg-emerald-50 border-l-4 border-emerald-500 rounded-r space-y-0.5">
                            <div class="font-bold text-emerald-900 text-xs"><i class="fa-solid fa-book-open mr-1"></i> একাডেমিক ইভেন্ট</div>
                            <div class="text-[11px] text-emerald-800">শ্রেণী: <strong>${ev.class_name}</strong></div>
                            <div class="text-[11px] text-emerald-700">বিষয় / বিস্তারিত: ${ev.subject}</div>
                            ${fromTextHtml}
                        </div>
                    `;
                }
            });

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('eventModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
</body>
</html>
