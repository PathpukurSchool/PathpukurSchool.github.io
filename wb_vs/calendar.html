<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>একাডেমিক ক্যালেন্ডার ও ছুটির তালিকা</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Font Awesome & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', 'Tiro Bangla', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body class="min-h-screen pb-12 text-slate-800">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-900 via-indigo-800 to-sky-900 text-white shadow-xl">
        <div class="max-w-6xl mx-auto px-4 py-6 text-center">
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide flex items-center justify-center gap-2">
                <i class="fa-solid fa-calendar-days text-amber-400"></i> পাতপুকুর হাই স্কুল (উ: মা:)
            </h1>
            <p class="text-xs md:text-sm text-sky-200 mt-1">একাডেমিক ক্যালেন্ডার, ছুটির তালিকা ও পরীক্ষার সময়সূচী</p>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-6 space-y-6">

        <!-- Legend Bar -->
        <div class="glass-card rounded-xl p-3 shadow-sm flex flex-wrap justify-center gap-4 text-xs font-bold">
            <div class="flex items-center space-x-1.5">
                <span class="w-3.5 h-3.5 rounded-full bg-red-500 inline-block"></span>
                <span>রবিবার / স্কুল ছুটি (Holiday)</span>
            </div>
            <div class="flex items-center space-x-1.5">
                <span class="w-3.5 h-3.5 rounded-full bg-sky-500 inline-block"></span>
                <span>পরীক্ষার রুটিন (Exam Routine)</span>
            </div>
            <div class="flex items-center space-x-1.5">
                <span class="w-3.5 h-3.5 rounded-full bg-emerald-500 inline-block"></span>
                <span>একাডেমিক ইভেন্ট (Academic Event)</span>
            </div>
        </div>

        <!-- Calendar Container -->
        <div class="glass-card rounded-2xl shadow-xl overflow-hidden border border-sky-100">
            
            <!-- Controls Bar -->
            <div class="bg-slate-800 text-white p-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center space-x-2">
                    <button onclick="changeYear(-1)" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-semibold transition" title="আগের বছর"><i class="fa-solid fa-angles-left"></i></button>
                    <button onclick="changeMonth(-1)" class="px-3 py-1 bg-sky-600 hover:bg-sky-500 rounded-lg text-xs font-semibold transition"><i class="fa-solid fa-chevron-left"></i> আগের মাস</button>
                </div>

                <div class="text-center">
                    <h2 id="calendarTitle" class="text-xl md:text-2xl font-bold tracking-wide text-amber-300">--</h2>
                </div>

                <div class="flex items-center space-x-2">
                    <button onclick="changeMonth(1)" class="px-3 py-1 bg-sky-600 hover:bg-sky-500 rounded-lg text-xs font-semibold transition">পরের মাস <i class="fa-solid fa-chevron-right"></i></button>
                    <button onclick="changeYear(1)" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-semibold transition" title="পরের বছর"><i class="fa-solid fa-angles-right"></i></button>
                </div>
            </div>

            <!-- Calendar Days Header -->
            <div class="grid grid-cols-7 bg-slate-100 text-center text-xs md:text-sm font-bold border-b border-slate-200">
                <div class="py-2.5 text-red-600">রবি</div>
                <div class="py-2.5 text-slate-700">সোম</div>
                <div class="py-2.5 text-slate-700">মঙ্গল</div>
                <div class="py-2.5 text-slate-700">বুধ</div>
                <div class="py-2.5 text-slate-700">বৃহস্পতি</div>
                <div class="py-2.5 text-slate-700">শুক্র</div>
                <div class="py-2.5 text-slate-700">শনি</div>
            </div>

            <!-- Calendar Days Grid -->
            <div id="calendarGrid" class="grid grid-cols-7 gap-1 p-2 bg-slate-50 min-h-[360px]">
                <!-- Dynamic Days -->
            </div>
        </div>

    </main>

    <!-- Event Modal Details -->
    <div id="eventModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-sky-100 relative space-y-4">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="flex items-center space-x-3 border-b border-slate-200 pb-3">
                <div id="modalIcon" class="p-3 rounded-full text-white text-xl"></div>
                <div>
                    <h3 id="modalTitle" class="text-lg font-bold text-slate-900">ইভেন্ট ডিটেইলস</h3>
                    <p id="modalDate" class="text-xs text-slate-500 font-semibold">--</p>
                </div>
            </div>

            <div id="modalBody" class="text-sm text-slate-700 space-y-2 max-h-80 overflow-y-auto">
                <!-- Dynamic Content -->
            </div>

            <div class="text-right pt-2">
                <button onclick="closeModal()" class="bg-slate-800 hover:bg-slate-900 text-white px-5 py-2 rounded-xl text-xs font-bold transition">বন্ধ করুন</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://bjjwzgzjjcpnndbuelkh.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqand6Z3pqamNwbm5kYnVlbGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTk1NDMsImV4cCI6MjEwMjM5NTU0M30.ICT0pRA2GtlJhxKxo8ghp0x2pVLem1csBkq_hvNVGUs";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const bengaliMonths = ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"];

        let currentDate = new Date();
        let eventsData = {}; // Store events indexed by YYYY-MM-DD

        window.onload = async () => {
            await fetchYearEvents(currentDate.getFullYear());
            renderCalendar();
        };

        // Standardize any String Date format into YYYY-MM-DD
        function parseToStandardDate(dateStr) {
            if (!dateStr) return null;
            let str = dateStr.trim();
            
            // YYYY-MM-DD format
            if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(str)) {
                let parts = str.split('-');
                return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
            }
            // DD/MM/YYYY or DD-MM-YYYY format
            if (/^\d{1,2}[\/-]\d{1,2}[\/-]\d{4}$/.test(str)) {
                let parts = str.split(/[\/-]/);
                return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
            }
            // Standard JS Date Fallback
            let d = new Date(str);
            if (!isNaN(d.getTime())) {
                return d.toISOString().split('T')[0];
            }
            return null;
        }

        // Fetch Supabase Data according to Selected Year
        async function fetchYearEvents(targetYear) {
            eventsData = {};

            // 1. Fetch Holidays
            const { data: holidays } = await _supabase.from('Holiday').select('*');
            if (holidays) {
                holidays.forEach(h => {
                    let stdDate = parseToStandardDate(h.date_val);
                    if (stdDate && stdDate.startsWith(targetYear.toString())) {
                        if (!eventsData[stdDate]) eventsData[stdDate] = [];
                        eventsData[stdDate].push({
                            type: 'holiday',
                            title: h.occasion || 'স্কুল ছুটি',
                            days: h.days || 1,
                            remarks: h.remarks || ''
                        });
                    }
                });
            }

            // 2. Fetch Exam Routines (Check session === targetYear)
            const { data: exams } = await _supabase.from('exam_routine').select('*').eq('session', targetYear.toString());
            if (exams) {
                exams.forEach(ex => {
                    let stdDate = parseToStandardDate(ex.exam_date);
                    if (stdDate) {
                        if (!eventsData[stdDate]) eventsData[stdDate] = [];
                        eventsData[stdDate].push({
                            type: 'exam',
                            exam_name: ex.exam_name,
                            classes: {
                                'Class V': ex.class_v,
                                'Class VI': ex.class_vi,
                                'Class VII': ex.class_vii,
                                'Class VIII': ex.class_viii,
                                'Class IX': ex.class_ix,
                                'Class X': ex.class_x,
                                'Class XI': ex.class_xi
                            }
                        });
                    }
                });
            }

            // 3. Fetch Academic Calendar
            const { data: academic } = await _supabase.from('Academic_Calendar').select('*');
            if (academic) {
                academic.forEach(ac => {
                    let stdDate = parseToStandardDate(ac.date_val);
                    if (stdDate && stdDate.startsWith(targetYear.toString())) {
                        if (!eventsData[stdDate]) eventsData[stdDate] = [];
                        eventsData[stdDate].push({
                            type: 'academic',
                            class_name: ac.class_name,
                            subject: ac.subject
                        });
                    }
                });
            }
        }

        // Render Calendar UI
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('calendarTitle').innerText = `${bengaliMonths[month]} ${year}`;

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            // Blank boxes before the start day of month
            for (let i = 0; i < firstDayOfMonth; i++) {
                grid.innerHTML += `<div class="p-2 bg-transparent"></div>`;
            }

            const todayStr = new Date().toISOString().split('T')[0];

            for (let day = 1; day <= daysInMonth; day++) {
                const dayDate = new Date(year, month, day);
                const dayOfWeek = dayDate.getDay();
                
                // Formatted Date String YYYY-MM-DD
                const monthStr = (month + 1).toString().padStart(2, '0');
                const dayStr = day.toString().padStart(2, '0');
                const dateKey = `${year}-${monthStr}-${dayStr}`;

                const dayEvents = eventsData[dateKey] || [];

                let isSunday = dayOfWeek === 0;
                let hasHoliday = isSunday || dayEvents.some(e => e.type === 'holiday');
                let hasExam = dayEvents.some(e => e.type === 'exam');
                let hasAcademic = dayEvents.some(e => e.type === 'academic');

                // Dynamic Styling Logic
                let bgStyle = "bg-white hover:bg-sky-50";
                let textStyle = "text-slate-800";
                let badgeDots = "";

                if (hasHoliday) {
                    bgStyle = "bg-red-50 hover:bg-red-100 border-red-200";
                    textStyle = "text-red-600 font-extrabold";
                } else if (hasExam) {
                    bgStyle = "bg-sky-50 hover:bg-sky-100 border-sky-200";
                    textStyle = "text-sky-800 font-bold";
                } else if (hasAcademic) {
                    bgStyle = "bg-emerald-50 hover:bg-emerald-100 border-emerald-200";
                    textStyle = "text-emerald-800 font-bold";
                }

                // Dot Badges inside Calendar Day
                if (hasHoliday) badgeDots += `<span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>`;
                if (hasExam) badgeDots += `<span class="w-1.5 h-1.5 rounded-full bg-sky-500"></span>`;
                if (hasAcademic) badgeDots += `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>`;

                const isToday = dateKey === todayStr ? 'ring-2 ring-indigo-500 ring-offset-1 font-extrabold' : '';

                const dayCard = document.createElement('div');
                dayCard.className = `p-2 min-h-[64px] border rounded-xl flex flex-col justify-between cursor-pointer transition-all ${bgStyle} ${isToday}`;
                dayCard.onclick = () => showEventDetails(dateKey, isSunday, dayEvents);

                dayCard.innerHTML = `
                    <div class="text-xs md:text-sm ${textStyle}">${day}</div>
                    <div class="flex space-x-1 justify-end">${badgeDots}</div>
                `;

                grid.appendChild(dayCard);
            }
        }

        async function changeMonth(offset) {
            const oldYear = currentDate.getFullYear();
            currentDate.setMonth(currentDate.getMonth() + offset);
            const newYear = currentDate.getFullYear();

            if (oldYear !== newYear) {
                await fetchYearEvents(newYear);
            }
            renderCalendar();
        }

        async function changeYear(offset) {
            currentDate.setFullYear(currentDate.getFullYear() + offset);
            await fetchYearEvents(currentDate.getFullYear());
            renderCalendar();
        }

        // Show Event Modal Details
        function showEventDetails(dateKey, isSunday, events) {
            const modal = document.getElementById('eventModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalDate = document.getElementById('modalDate');
            const modalIcon = document.getElementById('modalIcon');
            const modalBody = document.getElementById('modalBody');

            modalDate.innerText = `তারিখ: ${dateKey}`;
            modalBody.innerHTML = '';

            if (isSunday && events.length === 0) {
                modalTitle.innerText = "রবিবার (সাপ্তাহিক ছুটি)";
                modalIcon.className = "p-3 rounded-full bg-red-500 text-white";
                modalIcon.innerHTML = `<i class="fa-solid fa-umbrella-beach"></i>`;
                modalBody.innerHTML = `<p class="text-slate-600 font-medium">সাপ্তাহিক ছুটির দিন হিসেবে বিদ্যালয় বন্ধ থাকবে।</p>`;
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                return;
            }

            if (events.length === 0) {
                modalTitle.innerText = "সাধারণ কার্যদিবস";
                modalIcon.className = "p-3 rounded-full bg-slate-500 text-white";
                modalIcon.innerHTML = `<i class="fa-solid fa-school"></i>`;
                modalBody.innerHTML = `<p class="text-slate-600 font-medium">এই দিনে কোনো বিশেষ ছুটি বা নির্ধারিত পরীক্ষার রুটিন নেই। বিদ্যালয় স্বাভাবিক নিয়মে খোলা থাকবে।</p>`;
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                return;
            }

            modalTitle.innerText = "নির্ধারিত সূচী ও ইভেন্ট";
            modalIcon.className = "p-3 rounded-full bg-indigo-600 text-white";
            modalIcon.innerHTML = `<i class="fa-solid fa-bell"></i>`;

            if (isSunday) {
                modalBody.innerHTML += `<div class="p-2.5 bg-red-50 text-red-700 rounded-lg text-xs font-bold"><i class="fa-solid fa-calendar-check mr-1"></i> সাপ্তাহিক ছুটি (রবিবার)</div>`;
            }

            events.forEach(ev => {
                if (ev.type === 'holiday') {
                    modalBody.innerHTML += `
                        <div class="p-3 bg-red-50 border-l-4 border-red-500 rounded-r-xl space-y-1">
                            <div class="font-bold text-red-800 text-sm"><i class="fa-solid fa-gift mr-1"></i> ছুটির উপলক্ষ: ${ev.title}</div>
                            <div class="text-xs text-red-600">ছুটির মেয়াদ: ${ev.days} দিন</div>
                            ${ev.remarks ? `<div class="text-xs text-slate-600">মন্তব্য: ${ev.remarks}</div>` : ''}
                        </div>
                    `;
                } else if (ev.type === 'exam') {
                    let classListHtml = '';
                    Object.entries(ev.classes).forEach(([cls, sub]) => {
                        if (sub) {
                            classListHtml += `<li class="text-xs"><strong>${cls}:</strong> ${sub}</li>`;
                        }
                    });

                    modalBody.innerHTML += `
                        <div class="p-3 bg-sky-50 border-l-4 border-sky-500 rounded-r-xl space-y-2">
                            <div class="font-bold text-sky-900 text-sm"><i class="fa-solid fa-file-pen mr-1"></i> ${ev.exam_name || 'পরীক্ষার রুটিন'}</div>
                            <ul class="space-y-1 bg-white p-2.5 rounded-lg border border-sky-100">${classListHtml}</ul>
                        </div>
                    `;
                } else if (ev.type === 'academic') {
                    modalBody.innerHTML += `
                        <div class="p-3 bg-emerald-50 border-l-4 border-emerald-500 rounded-r-xl space-y-1">
                            <div class="font-bold text-emerald-900 text-sm"><i class="fa-solid fa-book-open mr-1"></i> একাডেমিক ইভেন্ট</div>
                            <div class="text-xs text-emerald-800">শ্রেণী: <strong>${ev.class_name}</strong></div>
                            <div class="text-xs text-emerald-700">বিষয় / বিস্তারিত: ${ev.subject}</div>
                        </div>
                    `;
                }
            });

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('eventModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
</body>
</html>
